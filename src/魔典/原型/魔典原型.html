     · 无点全名：若名册短名恰为其**前缀或后缀**也认（「天之宫今宵」↔ 今宵）
   后缀式前缀匹配仍要求长度≥2，避免「宵」这种单字命中。
   两条都只认「恰好等于前缀/后缀」，**不放开任意包含**——否则日后若来一位
   「莉莉姆二世」，首段就会撞上「莉莉姆」，把两个人合并成同一条羁绊。
   宁可少认一个别名，不可错并两个人。 */
let __heroBridge = null;
function heroAliasIndex(){
  if(__heroBridge) return __heroBridge;
  const m = new Map();
  const add = (k, v)=>{ const a=m.get(k)||new Set(); v.forEach(x=>a.add(x)); m.set(k,a); };
  const list = (typeof D !== 'undefined' && D && D.heroines) || [];   // 无卡内数据时降级为空桥
  for(const h of list){
    const full = String(h.name||'').trim();
    if(!full) continue;
    const parts = full.split(/[·・･]/).map(s=>s.trim()).filter(Boolean);
    if(parts.length >= 2){                          // 带·全名：首段/末段互为别名
      const head = HERO_NORM(parts[0]), tail = HERO_NORM(parts[parts.length-1]);
      if(head.length < 2 || tail.length < 2) continue;
      add(head, [parts[0], parts[parts.length-1]]);
      add(tail, [parts[0], parts[parts.length-1]]);
    }else if(HERO_NORM(full).length >= 4){          // 无点全名：天之宫今宵 ↔ 今宵
      const nf = HERO_NORM(full);
      for(let L=2; L*2 <= nf.length; L++){          // 取不短于一半的前缀/后缀，长度≥2
        add(nf.slice(0, L), [full]);
        add(nf.slice(-L), [full]);
      }
    }
  }
  __heroBridge = m;
  return m;
}
function bondAliases(name){
  const out = [String(name||'')];
  const parts = String(name||'').split(/[·・･]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length > 1){                       // 名册自身就是全名 → 首段/末段都算别名
    out.push(parts[0]);
    out.push(parts[parts.length-1]);
  }else{
    const extra = heroAliasIndex().get(HERO_NORM(name));   // 名册是短名 → 借静态全名桥接
    if(extra) extra.forEach(x=>out.push(x));
  }
  return out.filter(s=>HERO_NORM(s).length >= 2);   // 长度门槛，防单字误命中

  if(!B || typeof B !== 'object') return null;

/* 实体化阶段 —— 严格按世界书〈心界住民系统〉的「双重进化条件」实时推算，

     阶段一（默认）｜阶段二=好感≥30 且碎晶≥2｜阶段三=好感≥60 且碎晶≥5｜阶段四=好感≥90 且碎晶≥9
   两条铁律决定了这里该怎么写：
   ① 阶段名因住民而异（菲娜=戒备·公务期…结契·完全实体；蒂蒂阈值为80），是 AI 按专属条目

  {n:3, fav:60, shard:5,  hint:'好感60＋碎晶5'},
  {n:4, fav:90, shard:9,  hint:'好感90＋碎晶9'},

function renderAnimaStage(xj){
  const fav = Number(xj.好感度)||0, sh = Number(xj.碎晶数)||0;

    const gap = (!done && s.n<=4) ? `　差 ${Math.max(0,s.fav-fav)} 好感 · ${Math.max(0,s.shard-sh)} 碎晶` : '';
    return `<div class="as-row${done?' done':''}${cur===s.n?' cur':''}">
      <span class="as-no">${s.n}</span>
      <span class="as-hint">${esc(s.hint)}${gap}</span>
      <span class="as-mark">${done?'✓':''}</span></div>`;
  }).join('');
  return `
  <div class="sec-title">实体化 · 阶段 ${cur}/4</div>
  <div class="as-track">${row}</div>
  <div class="as-note">阶段名以 <b>实体化进度</b> 变量为准（各住民专属条目不同）——当前：<b>${esc(xj.实体化进度||'未实体化')}</b></div>`;

/* 「已遭遇」判定器 —— MVU 自由文本 ↔ 名册短名的宽松匹配。
   AI 写入 `图鉴.已遭遇种族` 的形态千差万别：'莉莉姆' / '莉莉姆·堤露埃拉' /
   '史莱姆（蓝）' / '魅魔一族'……名册侧只有短名。三级判定由严到宽：
     ① 原样相等
     ② 归一后相等（去「·」、空格、全/半角括号及其内容）
     ③ **仅当 MVU 条目带「·」（全名形态）** 时，才允许互为前缀
   ③ 的门槛是踩过坑才加的：若对所有条目都放开前缀，
     '史莱姆（蓝）' 会把「史莱姆女王」也一并点亮 —— 玩家明确只遇见了蓝色史莱姆，
     却解锁了女王。图鉴的紧张感就靠这种精确度撑着，不能慷慨。
     全名（莉莉姆·堤露埃拉）才是真正需要前缀兜底的场景。 */
function makeMetMatcher(list){
  const norm = (s)=> String(s??'')
    .replace(/[（(][^）)]*[）)]/g, '')   // 去掉括号注释
    .replace(/[·・･\s]/g, '')           // 去掉间隔点与空白
    .replace(/[Ａ-Ｚａ-ｚ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .trim();
  const pool = (Array.isArray(list) ? list : [])
    .map(x => (typeof x === 'string' ? x : (x && (x.名称 || x.名 || x.name)) || ''))
    .map(s => {
      const raw = String(s).trim();
      return { raw, n:norm(raw), isFull:/[·・･]/.test(raw) };
    })
    .filter(x => x.n.length >= 2);
  return (name)=>{
    const n = norm(name);
    if(!n || n.length < 2) return false;
    for(const it of pool){
      if(it.raw === name || it.n === n) return true;
      if(!it.isFull) continue;                       // 非全名条目不走前缀兜底
      const [lo,hi] = it.n.length <= n.length ? [it.n, n] : [n, it.n];
      if(hi.length >= 3 && lo === hi.slice(0, lo.length)) return true;
    }
    return false;
  };
}

     未收录一律显示 ??? 且不可点开。原实现把整个名册模式连三分类一起锁进密码后，
     与面板文案「重新上锁只收回未收录项，已收录进度不受影响」自相矛盾，故修正。 */

function renderHome(){
  const w  = Stat.get('世界', g(D,'world', {}));

  const bt = Stat.get('战斗', null) || {};

  const fighting = bt.状态 && bt.状态 !== '空闲';

        ${meter('法力', p.当前法力 ?? 0, p.法力上限 ?? 120, ['#2F4A5E','#43617A'])}
      </div></div>` : '';

  /* ② 生命·法力（左栏）：由原先的一行文本升级为量条 */
  const vitals = [
    meter('体力', p.当前体力 ?? 0, p.体力上限 ?? 200, ['#5B6B4C','#7C8B68']),
    meter('法力', p.当前法力 ?? 0, p.法力上限 ?? 120, ['#43617A','#2F4A5E']),
    meter('魔化度', p.魔化度 ?? 0, 100, (p.魔化度 ?? 0) >= 80 ? ['#6D231C','#B04A3E'] : ['#8A7040','#C9AE6D']),
    meter('历练值', p.历练值 ?? 0, 100, ['#8A7040','#C9AE6D']),
  ].join('');

  return `
  <div class="sec-title">天地小账</div>
  <div class="plaque"><h4>${esc(w.时间||'尚未记时')}<span class="k-latin">${esc(w.地点||'未知之地')}</span></h4>
    <div class="p-desc">${esc(w.季节||'—')} · ${esc(w.时段||'—')} · 天气${esc(w.天气||'—')} · 月相${esc(w.月相||'—')} · 魔力浓度 ${esc(w.魔力浓度||'普通')}${w.雷斯卡特耶沦陷?`<br>雷斯卡特耶 · ${esc(w.雷斯卡特耶沦陷)}`:''}${w.世界动态?`<br>${esc(w.世界动态)}`:''}</div></div>
  ${tierLadder(p)}
  <div class="sec-title">${esc((p.姓名||'无名旅人') + (p.身份?` · ${p.身份}`:''))} · Lv.${p.等级??1} ${esc(p.阶层||'')}</div>
  ${battleFlag}
  <div class="ov-2col">
    <div>
      <div class="sec-title" style="margin-top:10px">生命 · 法力</div>
      ${vitals}
      ${p.魔化段位 ? `<div class="chip-row"><span class="chip">${esc(p.魔化段位)}</span></div>` : ''}
      ${p.信仰对象 && p.信仰对象!=='无' ? kvLike('信仰', p.信仰对象) : ''}
    </div>
    <div>
      <div class="sec-title" style="margin-top:10px">八维</div>
      ${radar8(p)}
    </div>
  </div>
  <div class="sec-title sv-cinnabar">天平速览</div>
  ${meter('佳婿风评', f.佳婿风评??0, 100, ['#96372E','#B04A3E'])}
  ${meterCentered('魔界友好度', f.魔界友好度??0)}
  ${meterCentered('教团信任度', f.教团信任度??0)}
  <div class="sec-title">囊中与帐下</div>
  <div class="dex-legend">
    <span class="dl-step">金币 ${a.金币??0}</span><span class="dl-arrow">·</span>
    <span class="dl-step">银币 ${a.银币??0}</span><span class="dl-arrow">·</span>
    <span class="dl-step">铜币 ${a.铜币??0}</span><span class="dl-arrow">·</span>
    <span class="dl-step">魔晶 ${a.魔晶??0}</span></div>
  ${xj ? plaque(xj.名字||'未选定', 'Anima Mundi', `实体化 · ${xj.实体化进度||'未实体化'} · 碎晶 ${xj.碎晶数??0}/12 · 好感 ${xj.好感度??0}`) : ''}
  <div class="sec-title">卷帙统计</div>

}
/* 总览用的小键值行（原型的 kv 语义） */
function kvLike(k,v){ return `<div class="p-desc" style="margin-top:4px">${esc(k)} · ${esc(v)}</div>`; }

/* —— 柒 · 事件档案（旧 files 签：近期卷宗） —— */

  <div class="sec-title">近期 · 事件卷宗</div>
  ${recent.length ? [...recent].reverse().map(e=>`

    <div class="p-desc">${esc(e.摘要||'')}${e.地点?`<br>地点 · ${esc(e.地点)}`:''}${e.结果?`<br>结果 · ${esc(e.结果)}`:''}${e.后果?`<br>后果 · ${esc(e.后果)}`:''}</div></div>`).join('') : emptyNote('尚无事件卷宗。')}
  <div class="sec-title">冷却 · 封印中的事件</div>

  let api={};

            flow:(r.flow||[]).length,cards:(r.cards||[]).length,opts:(r.options||[]).length,
            head:(r.header||'').slice(0,16)};
  }); }catch(e){ floors=[{err:''+e}]; }
  return {

.rchip-lab{flex:none;font-size:11.5px;color:var(--ink-faint);letter-spacing:.16em}
.rchip-hint{font-size:11px;color:var(--ink-faint);letter-spacing:.1em}
.rchip-clear{margin-left:auto;color:var(--gilt-dim)}
.rchip:disabled{opacity:.4;pointer-events:none}
.rchip-row.prof-row{margin-top:16px;gap:8px}
.rchip-row.prof-row .rst{margin-left:auto;color:var(--cinnabar)}
.sum-dim{font-size:.82em;color:var(--ink-faint)}
/* 种族手风琴 */
.race-acc{display:flex;flex-direction:column;gap:4px;margin:2px 0 8px}
.race-cat{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid rgba(120,88,40,.38);border-radius:3px;background:rgba(246,242,231,.45);font-size:12.5px;letter-spacing:.12em;color:var(--ink-soft);transition:all .2s;text-align:left}
.race-cat:hover{border-color:var(--gilt)}
.race-cat.has{border-color:var(--cinnabar);color:var(--cinnabar)}
.race-cat.open::after{content:'▾';margin-left:auto;color:var(--gilt-dim)}
.race-cat:not(.open)::after{content:'▸';margin-left:auto;color:var(--gilt-dim)}
.race-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px;padding:6px 10px;border:1px dashed rgba(120,96,56,.32);border-top:none;border-radius:0 0 3px 3px;background:rgba(251,247,235,.4)}
.race-items:empty,.race-cat:not(.open)+.race-items{display:none}
.race-item{padding:4px 8px;border:1px solid rgba(120,88,40,.35);border-radius:3px;background:rgba(246,242,231,.5);font-size:12px;color:var(--ink-soft);text-align:center;letter-spacing:.06em;transition:all .18s}
.race-item:hover{border-color:var(--gilt);box-shadow:0 5px 12px rgba(96,66,28,.2),inset 0 1px 0 rgba(255,255,255,.7)}
.race-item.sel{background:rgba(150,55,46,.12);border-color:var(--cinnabar);color:var(--cinnabar);font-weight:600}
.race-fam{grid-column:1/-1;font-size:10.5px;letter-spacing:.14em;color:var(--gilt-dim);border-bottom:1px solid rgba(120,96,56,.22);padding:3px 2px 2px;margin-top:2px}
/* 羁绊名册 */
.bnd-item{margin-bottom:10px;border:1px solid rgba(120,88,40,.4);border-radius:4px;background:linear-gradient(172deg,rgba(246,242,231,.72),rgba(239,234,221,.48));transition:border-color .22s,box-shadow .22s}
.bnd-item.active{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar),0 8px 18px rgba(150,55,46,.14)}
.bnd-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 13px;cursor:pointer}
.bnd-hd:hover{background:rgba(201,174,109,.08)}
.bnd-nm{font-weight:700;font-size:14.5px;letter-spacing:.06em;color:var(--ink)}
.bnd-rc{font-size:11.5px;color:var(--gilt-dim);border:1px solid rgba(138,112,64,.55);border-radius:9px;padding:1px 7px;letter-spacing:.08em}
.bnd-rc.is-custom{color:var(--cinnabar);border-color:rgba(150,55,46,.6)}
.bnd-rel{font-size:11px;color:var(--cinnabar);border:1px solid rgba(150,55,46,.45);border-radius:9px;padding:1px 7px;background:rgba(150,55,46,.1)}
.bnd-del{margin-left:auto;background:none;border:none;font-family:var(--font-serif);font-size:11.5px;color:var(--cinnabar);letter-spacing:.1em;cursor:pointer;padding:2px 4px}
.bnd-del:hover{text-decoration:underline}
.bnd-desc{padding:0 13px 7px;font-size:12px;line-height:1.75;color:var(--ink-soft)}
.bnd-desc b{color:var(--lapis)}
.bnd-item .rchip-row{padding:0 11px}
.chip-x{background:none;border:none;font-size:12px;color:var(--cinnabar);cursor:pointer;margin-left:4px;padding:0 2px}
.rit-enter-mini{border-color:rgba(150,55,46,.6);color:var(--cinnabar);font-weight:600}
@media (max-width:760px){
  .rit-grid,.rit-grid.cols-3,.rit-grid.cols-4{grid-template-columns:repeat(2,1fr)}
  .rit-grid.cols-2{grid-template-columns:1fr}
  .rit-body{padding:12px 16px 16px}
  .rc-step span{font-size:0}
  .rc-step em{font-size:11px}
  .rit-opt.bond{padding-right:78px}
}
/* ══════════ 卷册删改（删楼层 + 重生成，合并一册） ══════════ */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.sc-grid{grid-template-columns:1fr}}
.sc-card{border:1px solid rgba(120,96,56,.36);border-radius:5px;padding:13px 15px;
  background:linear-gradient(172deg,rgba(250,246,236,.86),rgba(238,232,216,.7));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(96,66,28,.1)}
.sc-lab{font-family:var(--font-sans);font-size:11.5px;letter-spacing:.2em;color:var(--gilt-dim);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.sc-lab em{font-style:normal;font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}
.sc-in{display:flex;align-items:stretch;gap:7px;margin-bottom:8px}
.sc-in input{flex:1;min-width:0;background:rgba(255,253,246,.66);border:1px solid rgba(120,96,56,.45);border-radius:3px;
  padding:8px 11px;font-family:var(--font-sans);font-size:15px;color:var(--ink);outline:none}
.sc-in input:focus{border-color:var(--cinnabar)}
.sc-go{flex:none;padding:0 18px;border:1px solid rgba(150,55,46,.6);border-radius:3px;
  background:linear-gradient(180deg,rgba(150,55,46,.14),rgba(150,55,46,.08));color:var(--cinnabar);
  font-family:var(--font-serif);font-size:13px;font-weight:700;letter-spacing:.14em;transition:box-shadow .2s,background .2s}
.sc-go:hover:not(:disabled){background:rgba(150,55,46,.2);box-shadow:0 4px 10px rgba(150,55,46,.2)}
.sc-go:disabled{opacity:.42;cursor:not-allowed}
.sc-hint{font-family:var(--font-sans);font-size:10.5px;line-height:1.8;color:var(--ink-faint);letter-spacing:.04em}
.sc-cur{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;margin-bottom:9px;
  border:1px solid rgba(120,96,56,.34);border-radius:4px;background:rgba(251,247,235,.45);
  font-family:var(--font-sans);font-size:12px;color:var(--ink-soft)}
.sc-cur b{font-family:var(--font-serif);font-size:14px;color:var(--ink)}
.sc-cur .sc-pill{padding:2px 9px;border:1px solid rgba(120,96,56,.5);border-radius:10px;font-size:10.5px;color:var(--gilt-dim)}
.sc-chapters{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto}
.sc-ch{border:1px solid rgba(120,96,56,.4);border-radius:3px;background:rgba(246,242,231,.55);
  padding:5px 11px;font-family:var(--font-serif);font-size:12.5px;color:var(--ink-soft);transition:box-shadow .2s,border-color .2s,color .2s}
.sc-ch:hover{border-color:var(--gilt);color:var(--ink);box-shadow:0 4px 10px rgba(96,66,28,.18)}
.sc-ch.on{border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700;background:rgba(150,55,46,.12)}
.sc-ch.on.busy{opacity:.55;pointer-events:none}
@media (hover:none){.sc-go{min-height:44px;padding:0 20px}.sc-in input{font-size:16px}.sc-ch{min-height:40px;padding:8px 14px}}

/* [合入] 魔典-美化.css — 克劳德卡顿优化与美化包 */
/* 魔典-美化 v1 — 覆盖层：放在魔典原有 <style> 之后。只改质感与层次，不动结构与配色体系。 */

:root{
  --mdx-gilt-rule:linear-gradient(90deg,transparent,rgba(169,138,70,.5) 16%,rgba(201,174,109,.95) 50%,rgba(169,138,70,.5) 84%,transparent);
  --mdx-lift:0 1px 0 rgba(255,252,242,.55) inset,0 2px 4px rgba(96,66,28,.10),0 12px 26px -10px rgba(70,46,18,.34);
  --mdx-lift-hi:0 1px 0 rgba(255,252,242,.6) inset,0 3px 6px rgba(96,66,28,.14),0 18px 34px -12px rgba(70,46,18,.42);
}
::selection{background:rgba(150,55,46,.2);color:inherit}

/* ── 书页：更深的装订沟与四角压暗，纸面更有厚度 ── */
.page::before{
  box-shadow:
    inset 0 0 0 1px rgba(120,96,56,.30),
    inset 0 0 0 5px rgba(246,240,222,.16),
    inset 0 0 0 6px rgba(169,138,70,.16),
    inset 16px 0 26px -6px rgba(84,60,28,.22),
    inset -30px 0 64px rgba(120,90,44,.18),
    inset 0 -34px 64px rgba(120,90,44,.15),
    inset 0 30px 56px rgba(122,92,46,.08);
}
.page.leaving,.page.enter-r,.page.enter-l,.page.entering{will-change:transform,opacity;backface-visibility:hidden}

/* ── 天头 / 地脚：单线换成描金双线 ── */
.folio-head{
  border-bottom:none;
  background-image:linear-gradient(90deg,transparent,rgba(120,88,40,.42) 10%,rgba(120,88,40,.42) 90%,transparent),var(--mdx-gilt-rule);
  background-size:100% 1px,100% 1px;
  background-position:0 100%,0 calc(100% - 3px);
  background-repeat:no-repeat;
}
.folio-foot{
  border-top:none;
  background-image:var(--mdx-gilt-rule);
  background-size:100% 1px;background-position:0 0;background-repeat:no-repeat;
  font-variant-numeric:oldstyle-nums;
}

/* ── 正文排版：行距、字距、断行更讲究（首字下沉按作者先前的决定保持不加） ── */
.prose p{
  line-height:2.05;letter-spacing:.022em;margin:0 0 .55em;
  text-wrap:pretty;font-kerning:normal;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  text-shadow:0 .5px 0 rgba(255,250,236,.4);
}
.prose strong{color:var(--cinnabar-deep);font-weight:700}
.dlg{color:#7A2A22}

/* ── 章题：描金菱花分隔 ── */
.chapter-tag{margin:8px 0 22px}
.chapter-tag h2{position:relative;padding-left:20px;text-shadow:0 1px 0 rgba(255,250,236,.5)}
.chapter-tag h2::before{
  content:'';position:absolute;left:2px;top:50%;width:8px;height:8px;
  transform:translateY(-50%) rotate(45deg);
  background:linear-gradient(135deg,var(--gilt-hi),var(--gilt-dim));
  box-shadow:0 0 0 2px rgba(246,240,222,.7),0 0 0 3px rgba(169,138,70,.45);
}
.chapter-tag .ct-rule{height:1px;background:var(--mdx-gilt-rule);position:relative}
.chapter-tag .ct-rule::after{
  content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;
  transform:translate(-50%,-50%) rotate(45deg);background:var(--gilt);
}
.sec-title::before{
  content:'';flex:none;width:6px;height:6px;transform:rotate(45deg);
  background:currentColor;opacity:.75;box-shadow:0 0 0 2px rgba(246,240,222,.6);
}

/* ── 便签 / 见闻 / 战况：分层阴影 + 一道描金细线 ── */
.mind-slip,.note-slip{box-shadow:var(--mdx-lift)}
.news-clip{border-color:rgba(47,74,94,.30);box-shadow:var(--mdx-lift)}
.news-clip .nc-head{
  background:linear-gradient(180deg,#3A5B74,#2A4458);
  box-shadow:inset 0 -1px 0 rgba(201,174,109,.55),inset 0 1px 0 rgba(255,255,255,.08);
  text-shadow:0 1px 1px rgba(0,0,0,.3);
}
.duel-banner{box-shadow:var(--mdx-lift)}
.duel-banner .db-head{
  box-shadow:inset 0 -1px 0 rgba(201,174,109,.55),inset 0 1px 0 rgba(255,255,255,.08);
  text-shadow:0 1px 1px rgba(0,0,0,.3);
}

/* ── 标本插页（功能卡）：内衬描金框 ── */
.specimen{outline:1px solid rgba(169,138,70,.30);outline-offset:-6px;box-shadow:var(--mdx-lift),inset 0 0 34px rgba(120,96,56,.10)}

/* ── 数值条：圆润轨道 + 光泽填充，颜色仍取各条自带的朱砂 / 青金 / 苔绿 ── */
.meter .m-track{
  height:8px;border-radius:999px;
  background:linear-gradient(180deg,rgba(96,66,28,.22),rgba(96,66,28,.10));
  box-shadow:inset 0 1px 2px rgba(43,34,26,.30),0 1px 0 rgba(255,250,238,.65);
}
.meter .m-fill{
  border-radius:999px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 60%),
    linear-gradient(90deg,var(--mv,#A98A46),var(--mv2,#C9AE6D));
  box-shadow:0 0 6px -1px var(--mv2,#C9AE6D);
}
.meter .m-val{font-variant-numeric:tabular-nums}

/* ── 选项签：悬停轻抬，朱砂印点更立体 ── */
.choice-slip{
  box-shadow:0 1px 0 rgba(255,252,242,.6) inset,0 3px 8px -3px rgba(96,66,28,.28);
  transition:transform .22s var(--ease-out),box-shadow .22s var(--ease-out),border-color .22s;
}
.choice-slip:hover{transform:translateY(-1px);border-color:rgba(150,55,46,.62);box-shadow:var(--mdx-lift-hi)}
.choice-slip:active{transform:translateY(0)}
.choice-slip::before{
  background:radial-gradient(circle at 35% 30%,var(--cinnabar-hi),var(--cinnabar) 55%,var(--cinnabar-deep));
  box-shadow:0 0 0 2px rgba(246,240,222,.75),0 1px 3px rgba(0,0,0,.35);
}

/* ── 目录 ── */
.toc-item{transition:transform .24s var(--ease-out),border-color .24s,background-color .24s,box-shadow .24s}
.toc-item:hover{box-shadow:0 6px 16px -10px rgba(70,46,18,.45)}
.toc-item.on{box-shadow:inset 3px 0 0 var(--cinnabar)}

/* ── 翻页把手 ── */
.leaf-handle{box-shadow:0 1px 0 rgba(255,252,242,.6) inset,0 10px 24px -6px rgba(0,0,0,.45)}

/* ── 焦点与滚动条 ── */
:focus-visible{outline:2px solid rgba(169,138,70,.85);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:rgba(120,88,40,.45) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(169,138,70,.55),rgba(120,88,40,.55));border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* [合入] 魔典-紫曜夜读.css — 第二套主题，挂 data-mdx-theme="night" */
/* 魔典-紫曜夜读 v1 — 第二套主题，移植自旧版轻前端「紫曜魔章 / 魅夜魔导书」。
   全部规则挂在 html[data-mdx-theme="night"] 下：不切换时对羊皮纸主题零影响。放在魔典原样式与美化层之后。 */

html[data-mdx-theme="night"]{

  --cinnabar:#ff5e8a;--cinnabar-deep:#c2184f;--cinnabar-hi:#ff8fae;
  --gilt:#e8c385;--gilt-hi:#ffe9b8;--gilt-dim:#c9a56a;
  --lapis:#c9a4ff;--lapis-hi:#dcc6ff;
  --moss:#7ec8a0;--moss-deep:#62b58c;
  --leather-0:#2a1040;--leather-1:#1a0a24;
  --nt-violet:#b478ff;--nt-violet-deep:#7a3fd1;--nt-violet-dim:rgba(180,120,255,.14);
  --nt-rose:#ff5e8a;--nt-rose-dim:rgba(255,94,138,.14);
  --nt-gilt-dim:rgba(232,195,133,.16);
  --nt-hair:rgba(200,160,255,.18);--nt-hair-strong:rgba(200,160,255,.36);
  --nt-card:linear-gradient(180deg,rgba(33,18,52,.78),rgba(15,8,23,.9));

  --mdx-lift:var(--nt-shadow);--mdx-lift-hi:var(--nt-float);
  color-scheme:dark;
}
@keyframes mdxBreath{0%,100%{opacity:.6;filter:drop-shadow(0 0 6px rgba(180,120,255,.45))}50%{opacity:1;filter:drop-shadow(0 0 16px rgba(201,160,255,.7))}}
@keyframes mdxEvIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes mdxSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes mdxSpinR{to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes mdxSheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes mdxCrit{0%,100%{box-shadow:0 0 5px rgba(232,195,133,.25)}50%{box-shadow:0 0 16px rgba(232,195,133,.55)}}
html[data-mdx-theme="night"] ::selection{background:rgba(180,120,255,.3);color:#fff}
