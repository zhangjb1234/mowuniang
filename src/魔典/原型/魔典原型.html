  }

  /* 关键词提交：单一入口。
     手机没有回车键，所以四条路都接到这里：
     ① 点「＋」按钮  ② 回车  ③ 失焦  ④ 输入逗号/顿号即分隔多词 */
  function addKeys(raw, quiet){
    const parts = String(raw||'')
      .split(/[,，、;；\s]+/)
      .map(s=>s.trim())
      .filter(Boolean);
    if(!parts.length) return 0;
    let added = 0, dup = 0;
    for(const p of parts){
      if(S.keys.indexOf(p) < 0){ S.keys.push(p); added++; } else dup++;
    }
    S.keyInput = ''; save();
    if(insertOpen) openInsert(insertOpen);
    if(dup && !quiet) notify('其中 '+dup+' 个关键词已在列。','warn',2600);
    return added;
  }
  /* 「＋」按钮的可用态：空输入时禁用，避免点了没反应 */
  function syncKeyAddBtn(root){
    const btn = root.querySelector('#nf-keyadd');
    const inp = root.querySelector('[data-nf="keyInput"]');
    if(btn && inp) btn.disabled = !inp.value.trim();
  }

  /* —— 绑定 —— */
  function bind(root){
    root.querySelectorAll('[data-nf]').forEach(el=>{
      const k = el.dataset.nf;
      if(k === 'keyInput'){
        // 提交口径统一到 addKeys：按钮 / 回车 / 失焦 / 分隔符 都走它
        // 回车在触屏上=换行（手机要能分段写多个关键词），在桌面指针设备上=提交。
        // 触屏提交只走「＋」按钮与失焦，不劫持回车。
        const touch = matchMedia("(hover:none)").matches || ("ontouchstart" in window && navigator.maxTouchPoints > 0);
        el.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" && !touch){ e.preventDefault(); addKeys(el.value); }
          if(e.key === "," || e.key === "\uff0c" || e.key === "\u3001"){ e.preventDefault(); addKeys(el.value); }
        });
        el.addEventListener("blur", ()=>{ setTimeout(()=>{ if(document.activeElement && document.activeElement.id === "nf-keyadd") return; addKeys(el.value, true); }, 120); });
        el.addEventListener("input", ()=>{ S.keyInput = el.value; save(); syncKeyAddBtn(root); });
      }else{
        el.addEventListener('input', ()=>{ S[k] = el.value; save(); });
      }
    });
// 检索框：只重渲不丢焦点；输入法组词期间不重绘，compositionend 再刷新
    const rq = root.querySelector('[data-nf="raceQ"]');
    if(rq){
      rq.addEventListener('input', (e)=>{ S.raceQ = rq.value; if(e.isComposing) return; reraceKeepFocus(rq); });
      rq.addEventListener('compositionend', ()=>{ S.raceQ = rq.value; reraceKeepFocus(rq); });
    }
    // 三级树：大类
    root.querySelectorAll('[data-nf-cat]').forEach(b=>b.addEventListener('click', ()=>{
      S.ui.openCat = (S.ui.openCat === b.dataset.nfCat) ? '' : b.dataset.nfCat;
      S.ui.openFam = '';
      if(insertOpen) openInsert(insertOpen);
    }));
    // 三级树：科属
    root.querySelectorAll('[data-nf-fam]').forEach(b=>b.addEventListener('click', ()=>{
      const k = b.dataset.nfFam;
      S.ui.openFam = (S.ui.openFam === k) ? '' : k;
      if(insertOpen) openInsert(insertOpen);
    }));
    // 三级树：种族（只可选，不可自定义）
    root.querySelectorAll('[data-nf-race]').forEach(b=>b.addEventListener('click', ()=>{
      S.race = b.dataset.nfRace;
      save(); if(insertOpen) openInsert(insertOpen);
    }));
    // 下拉：性别 / 实力阶层
    root.querySelectorAll('[data-nf-sel]').forEach(el=>el.addEventListener('change', ()=>{
      S[el.dataset.nfSel] = el.value; save();
      if(el.dataset.nfSel==='gender') openInsert(insertOpen); // 选「自定义」时露出输入框
    }));
    // AI 补全（单维度）
    root.querySelectorAll('[data-nf-ai]').forEach(b=>b.addEventListener('click', async ()=>{
      const dim = b.dataset.nfAi;
      if(insertOpen) openInsert(insertOpen);
      const r = await aiFill(dim);
      notify(r.msg, r.ok ? 'gild' : 'warn', r.ok ? 3600 : 5000);
      if(insertOpen) openInsert(insertOpen);
    }));
    // 关键词「＋」按钮：手机端的主提交路径
    const kadd = root.querySelector('#nf-keyadd');
    if(kadd) kadd.addEventListener("click", ()=>{
      const inp = root.querySelector('[data-nf="keyInput"]');
      if(inp) addKeys(inp.value);
    });
    syncKeyAddBtn(root);
    const hb = root.querySelector('[data-nf-husb]');
    if(hb) hb.addEventListener('click', ()=>{ S.husband = !S.husband; save(); if(insertOpen) openInsert(insertOpen); });
    root.querySelectorAll('[data-nf-keydel]').forEach(b=>b.addEventListener('click', ()=>{
      S.keys.splice(+b.dataset.nfKeydel, 1); save(); if(insertOpen) openInsert(insertOpen);
    }));
    const go = root.querySelector('#nf-commit');
    if(go) go.addEventListener('click', async ()=>{
      go.disabled = true;
      const r = await commit();
      notify(r.msg, r.ok ? 'gild' : 'warn', r.ok ? 4200 : 6500);
      go.disabled = false;
      if(insertOpen) openInsert(insertOpen);
    });
    const rs = root.querySelector('#nf-reset');
    if(rs) rs.addEventListener('click', ()=>{ S = fresh(); save(); if(insertOpen) openInsert(insertOpen); });
    root.querySelectorAll('[data-nf-del]').forEach(b=>b.addEventListener('click', async ()=>{
      const r = await removeOne(b.dataset.nfDel);
      notify(r.msg, r.ok ? 'gild' : 'warn', 4000);
      if(insertOpen) openInsert(insertOpen);
    }));
  }

  return { render, bind, fresh, _state:()=>S };
  /* 种族检索：重渲后归还焦点与光标 */
  function reraceKeepFocus(el){
    const pos = { s: el.selectionStart, e: el.selectionEnd };
    if(insertOpen) openInsert(insertOpen);
    const el2 = insertEl.querySelector('[data-nf="raceQ"]');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(pos.s, pos.e); }catch(e){} }
  }
})();

const Stat = (()=>{
  let stat = null, source = 'defaults';
  const FRAME = ()=> (window.MODIAN_DATA && window.MODIAN_DATA.schemaDefaults) || {};
  /* ⚠ 跨帧探测（关键修复）：魔典跑在界面正则提升的 iframe 里，酒馆助手的
     window.Mvu / getVariables / waitGlobalInitialized 未必注入在本上下文。
     此前 Stat 只查 window.*，真机上大概率永远取不到 → 静默落到 defaults，
     用户看到的就是「变量永远不更新」。此处照 NpcForge.frames() 的同款纪律
     逐帧探测：本上下文 → parent → top，并对 function 做 bind（否则 this 丢失）。 */
  function frames(){
    const out = [];
    try{ out.push(window); }catch(e){}
    try{ if(window.parent && window.parent !== window) out.push(window.parent); }catch(e){}
    try{ if(window.top && window.top !== window) out.push(window.top); }catch(e){}
    return out;
  }
  function pick(name){
    for(const f of frames()){
      try{
        const v = f[name];
        if(typeof v === 'function') return v.bind(f);
        if(v != null) return v;
      }catch(e){}
    }
    return null;
  }
  const MvuOf = ()=> pick('Mvu');
  const getVariablesOf = ()=> pick('getVariables');
  const waitGlobalOf = ()=> pick('waitGlobalInitialized');
  async function ensureMvu(timeoutMs){
    try{
      const m0 = MvuOf();
      if(m0 && typeof m0.getMvuData === 'function') return true;
      const wait = waitGlobalOf();
      if(typeof wait === 'function'){
        await Promise.race([
          wait('Mvu'),
          new Promise(r=>setTimeout(r, timeoutMs||6000)),
        ]);
      }
    }catch(e){}
    const m = MvuOf();
    return !!(m && typeof m.getMvuData === 'function');
  }
  async function sync(){
    // 第一级：MVU 最新楼层（幻璃镜同款：总览/行囊永远跟着最新一落走）；再退聊天级
    try{
      if(await ensureMvu(2500)){
        const mvu = MvuOf();
        const dm = mvu.getMvuData({type:'message', message_id:'latest'});
        const sm = (dm && dm.stat_data) ? dm.stat_data : dm;
        if(sm && typeof sm==='object' && Object.keys(sm).length){ stat = sm; source = 'mvu-latest'; return; }
        const d = mvu.getMvuData({type:'chat'});
        const sd = (d && d.stat_data) ? d.stat_data : d;
        if(sd && typeof sd==='object'){ stat = sd; source = 'mvu'; return; }
      }
    }catch(e){ statWarnOnce(); /* 落级 */ }
    // 第二级：聊天变量
    try{
      const gv = getVariablesOf();
      if(typeof gv === 'function'){
        const v = gv({type:'chat'});
        if(v && v.stat_data && typeof v.stat_data==='object'){ stat = v.stat_data; source = 'chat'; return; }
      }
    }catch(e){}
    // 第三级：初始档案（明示）
    stat = FRAME(); source = 'defaults';
  }
  function get(path, fb){
    let o = stat;
    for(const k of String(path).split('.')){
      o = (o && typeof o==='object') ? o[k] : undefined;
      if(o === undefined) break;
    }
    return (o === undefined || o === null) ? fb : o;
  }
  /* 楼层级读取（幻璃镜同款语义：看哪一楼，显示那一楼落盘时的世界状态）。
     第一级 Mvu.getMvuData({type:'message', message_id}) → 第二级聊天级缓存 get()。 */
  function getFloor(path, messageId, fb){
    try{
      const mvu = MvuOf();
      if(mvu && typeof mvu.getMvuData === 'function' && messageId != null){
        const d = mvu.getMvuData({type:'message', message_id: messageId});
        const sd = (d && d.stat_data) ? d.stat_data : d;
        if(sd && typeof sd === 'object'){
          let o = sd;
          for(const k of String(path).split('.')){ o = (o && typeof o==='object') ? o[k] : undefined; if(o === undefined) break; }
          if(o !== undefined && o !== null) return o;
        }
      }
    }catch(e){}
    return get(path, fb);
  }
  return { sync, get, getFloor, frames, pick, get source(){ return source; } };
})();
let __statWarned = false;
function statWarnOnce(){
  if(__statWarned) return; __statWarned = true;
  try{ notify('变量誊录出了岔子——暂以上一版为准。','warn'); }catch(e){}
}
/* MVU 变量更新 → 与楼层事件共用同一出口（刷新面照幻璃镜抄全）
   ⚠ 三处修复（用户报「不退出全屏就看不到最新 MVU」）：
   ① 事件名真身是 Mvu.events.VARIABLE_UPDATE_ENDED（见 common/galgame-core/mvu/mvuCore.ts
      的 onVariableUpdateEnded），此前只认 window.tavern_events.VARIABLE_UPDATE_ENDED，
      真机上取不到 → 订阅从未成立。三个来源全查并去重。
   ② eventOn 走跨帧探测（iframe 里本上下文未必有酒馆助手全局）。
   ③ 生成结束也兜底刷一次：MVU 落盘与楼层事件存在时序差。 */
function wireOneEvent(evtName, cb){
  if(!evtName || typeof evtName !== 'string') return false;
  let ok = false;
  for(const f of Stat.frames()){
    try{
      const eOn = f.eventOn;
      if(typeof eOn === 'function'){ eOn.call(f, evtName, cb); ok = true; }
    }catch(e){}
  }
  return ok;
}
(async function wireStatEvents(){
  const names = [];
  try{ const mvu = Stat.pick('Mvu'); if(mvu && mvu.events && mvu.events.VARIABLE_UPDATE_ENDED) names.push(mvu.events.VARIABLE_UPDATE_ENDED); }catch(e){}
  try{ const te = Stat.pick('tavern_events'); if(te && te.VARIABLE_UPDATE_ENDED) names.push(te.VARIABLE_UPDATE_ENDED); }catch(e){}
  names.push('mag_variable_updated');
  [...new Set(names)].forEach(n=>wireOneEvent(n, refreshStatsUI));
  // 收账时序兜底：变量事件可能早于/晚于楼层落地，两端各补一刀
  try{
    const ie = Stat.pick('iframe_events');
    if(ie && ie.GENERATION_ENDED) wireOneEvent(ie.GENERATION_ENDED, ()=> setTimeout(refreshStatsUI, 260));
  }catch(e){}
  await Stat.sync();
  // 定时兜底：MVU 缺席或事件面不全时，靠轮询也能看到最新（读命中即退出，不空转）
  let lastSig = '';
  setInterval(()=>{
    if(document.hidden) return;
    const s = Stat.source();
    if(s === 'defaults') return;                 // 本来就没数据源，轮询无意义
    let sig = '';
    try{ sig = JSON.stringify(Stat.get('主角', null)) + '|' + JSON.stringify(Stat.get('资产', null)); }catch(e){}
    if(sig && sig !== lastSig){ lastSig = sig; refreshStatsUI(); }
  }, 4000);
})();

/* ---------- 正文解析器（宽容降级，纯函数） ---------- */
const TAGNAMES = ['正文','心语','大陆见闻','战况','魔物生成','获得物品','获取任务','技能生成','较量面板','状态栏','状态面板','UpdateVariable','update','StatusPlaceHolderImpl'];
const TAG_ALT = [...TAGNAMES,'options','start'].join('|');
function stripThinking(t){
  return cleanseFloor(t).text;
}
/* 楼层净炉：思维链/预设壳/弹幕/容器，顺序对齐幻璃镜-租借男友铁律 */
const SUOT_RE = /<SUOT\b[^>]*>([\s\S]*?)<\/SUOT>/i;
const SUOT_INDEX_RE = /^\s*[0-9０-９]+\s*[.、)）:：]\s*/;
function cleanseFloor(raw){
  let t = String(raw||'');
  const out = { text:'', notes: [], suot: '' };
  if(!t) return out;
  // ① 泉此方思维链前缀：闭标签前全截
  t = t.replace(/[\s\S]*?<\/konatan_planning~>/i, '');
  // ② <SUOT> 选项块先提（滤净链将删之）
  const sm = SUOT_RE.exec(t);
  if(sm) out.suot = sm[1];
  // ③ 留言小笺提取（泉此方 tucao / konatan_chat）
  t = t.replace(/<(tucao|konatan_chat)\b[^>]*>([\s\S]*?)<\/\1\s*>/gi, (m, g, c)=>{ out.notes.push({tag:g, text:c.trim()}); return ''; });
  // ④ 思维链对/未闭合流式尾/变体
  t = t.replace(/<(think|thinking|chain_of_thought|draft|simple_thinking|cot|think_nya~)[^>]*>[\s\S]*?<\/\1\s*>/gi,'')
       .replace(/<think(?:ing)?\s*\/>/gi,'')
       .replace(/\u22D8/g,'')
       .replace(/<(?:thinking|simple_thinking|think_nya~|think)>(?:(?!<\/(?:thinking|simple_thinking|think_nya~|think)>)[\s\S])*\s*$/i,'')
       .replace(/<\/?(?:thinking|simple_thinking|think_nya~|think|draft|Chain_of_Thought)>\s*/gi,'');
  // ⑤ 附加块 / SUOT / 弹幕 / game 壳 / details
  t = t.replace(/<(disclaimer|Reference_Example|summary|background|safety_check|advice)>[\s\S]*?<\/\1>/gi,'')
       .replace(/<SUOT\b[^>]*>[\s\S]*?<\/SUOT>/gi,'')
       .replace(/<!--\s*Technical Footer Start[\s\S]*?Technical Footer End\s*-->/gi,'')
       .replace(/<danmu\b[^>]*>[\s\S]*?<\/danmu\s*>/gi,'')
       .replace(/<\/?game\b[^>]*>\n?/gi,'')
       .replace(/<details\b[^>]*>[\s\S]*?<\/details\s*>/gi,'');
  // ⑥ Interleaving 容器（Dramatron）互斥：有容器只留容器体
  const closed = /<Interleaving>([\s\S]*)<\/Interleaving>/i.exec(t);
  const openOnly = closed ? null : /<Interleaving>([\s\S]*)$/i.exec(t);
  const container = (closed || openOnly);
  if(container) t = container[1].replace(/<\/?Interleaving>\n?/gi,'').replace(/<\/?content\b[^>]*>/gi,'');
  out.text = t;
  return out;
}
/* 预清洗：对应卡内 #2(反引号围栏) #3(样式块) #4(q标签) #5(标签漂移/加粗包裹) */
function preNormalize(t){
  t = t.replace(/`{2,}[^\n]*/g, '');                                  // 围栏行
  t = t.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');                 // AI 模仿样式块
  t = t.replace(/<\/?q\s*>/gi, '');                                     // 残留 q 标签
  const drift = new RegExp(String.raw`\**[ \t]*<\s*(\/?)\s*(${TAG_ALT})\s*(\/?>)[ \t]*\**`, 'gi');
  t = t.replace(drift, '<$1$2$3');                                      // 加粗/空格漂移归一
  return t;
}
function extractBlocks(t, name){
  const out = []; const re = new RegExp(String.raw`<\s*${name}\s*>([\s\S]*?)<\/\s*${name}\s*>`, 'gi');
  let m; while((m = re.exec(t))) out.push(m[1]);
  return out;
}
function parseFields(raw){
  // 字段行解析：兼容「键：值」「【键】值」「键|值」三态；不吃进去的行进 extras
  const fields = [], extras = [];
  raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let m = line.match(/^【([^】]+)】\s*[:：]?\s*(.+)$/) || line.match(/^([^:：|]{1,12})\s*[:：]\s*(.+)$/) || line.match(/^([^:：|]{1,12})\s*\|\s*(.+)$/);
    if(m) fields.push([m[1].trim(), m[2].trim()]); else extras.push(line);
  });
  return {fields, extras};
}
function parseFloor(raw){
  const r = { cover:false, header:'', prose:[], minds:[], news:[], duels:[], cards:[], options:[], statusSeen:false, updates:0, notes:[] };
  const cl = cleanseFloor(raw||'');
  let t = preNormalize(cl.text);
  r.notes = cl.notes;
  /* <start> 开局楼层：闭合与未闭合（流式截断）两形态都认；start 当包裹壳时把内层正文标签剥净留字 */
  const starts = extractBlocks(t,'start');
  if(!starts.length){
    const openTail = t.match(/<\s*start\s*>([\s\S]*)$/i);
    if(openTail) starts.push(openTail[1]);
  }
  if(starts.length){
    r.cover = true;
    r.coverText = starts.join('\n').replace(/<\s*\/?\s*(正文|content)\s*>/gi,'').trim();
    return r;
  }
  // 场景标头 = <正文> 之前独立一行
  const headMatch = t.match(/^([\s\S]*?)<\s*正文\s*>/);
  if(headMatch){ r.header = headMatch[1].split(/\r?\n/).map(s=>s.trim()).filter(Boolean).pop() || ''; }
  let bodies = extractBlocks(t,'正文');
  let body = '';
  if(bodies.length){
    body = bodies.join('\n');
  }else{
    // legacy 内容路：<content> 块合并（首开到末闭内的全部 content 串联）
    const cb = extractBlocks(t,'content');
    body = cb.length ? cb.join('\n') : t;
    if(!cb.length){
      // 兜底：剥掉功能标签后全文视为正文
      TAGNAMES.forEach(n=>{ if(n!=='正文') body = body.replace(new RegExp(String.raw`<\s*${n}\s*>[\s\S]*?(?:<\/\s*${n}\s*>|$)`,'gi'),''); });
    }
  }
  body = body.replace(/<\s*\/?\s*(正文|content)\s*>/gi,'');
  // 顺序游走：保真还原 正文段落 / 心语 / 大陆见闻 / 战况 的出现次序
  r.flow = [];
  const walk = /<\s*(心语|大陆见闻|战况)\s*>([\s\S]*?)<\/\s*\1\s*>/gi;
  let last = 0, wm;
  const pushProse = (txt)=>{ txt.split(/\n{2,}|(?<=\S)\n(?=\S)/).map(s=>s.trim()).filter(Boolean).forEach(p=>r.flow.push({type:'prose',text:p})); };
  while((wm = walk.exec(body))){
    pushProse(body.slice(last, wm.index));
    const type = wm[1]==='心语' ? 'mind' : wm[1]==='大陆见闻' ? 'news' : 'duel';
    r.flow.push({type, text: wm[2].trim()});
    last = walk.lastIndex;
  }
  pushProse(body.slice(last));
  // 正文后的功能标签（按源码出现顺序）
  r.cards = [];
  const tagMeta = {'魔物生成':['monstrum','魔物娘档案','MONSTRVM'],'获得物品':['res','获得物品','RES'],'获取任务':['mandatum','委托录','MANDATVM'],'技能生成':['artes','技能习得','ARS'],'较量面板':['certamen','较量记录','CERTAMEN']};
  const fcWalk = /<\s*(魔物生成|获得物品|获取任务|技能生成|较量面板)\s*>([\s\S]*?)<\/\s*\1\s*>/gi;
  let cm;
  while((cm = fcWalk.exec(t))){
    const meta = tagMeta[cm[1]];
    const p = parseFields(cm[2]);
    if(cm[1]==='较量面板'){ try{ p.cert = JSON.parse(cm[2].trim()); }catch(e){ p.cert = null; } }
    r.cards.push({tag: cm[1], cls: meta[0], title: meta[1], latin: meta[2], ...p});
  }
  // 选项（多路并取 + 去重，对齐蓝本 parseOptions）
  const CN = '一二三四五六七八九十';
  const pushOpt = (text, label)=>{
    text = (text||'').replace(/<\/?option\b[^>]*>/gi,'').replace(/\*\*/g,'').trim();
    if(!text || r.options.some(o=>o.text===text)) return;
    r.options.push({ label: label || ('选项' + (CN[r.options.length]||r.options.length+1)), text });
  };
  if(cl.suot) cl.suot.split(/\r?\n/).forEach(l=>pushOpt(l.replace(SUOT_INDEX_RE,'')));
  const obm = t.match(/<options\b[^>]*>([\s\S]*?)<\/options>/i);
  if(obm){
    const inner = obm[1];
    let matched = false;
    for(const m of inner.matchAll(/<option\b[^>]*>([\s\S]*?)<\/option>/gi)){ pushOpt(m[1]); matched = true; }
    if(!matched) {
      inner.split(/\r?\n/).forEach(line=>{
        const m = line.trim().match(/^>\s*([^:：]{1,6})\s*[:：]\s*(.+)$/);
        if(m){ pushOpt(m[2], m[1]); matched = true; }
      });
    }
    if(!matched) inner.split(/\r?\n/).filter(s=>s.trim()).forEach(s=>pushOpt(s));
  }
  for(const m of t.matchAll(/<option\b[^>]*>([\s\S]*?)<\/option>/gi)) pushOpt(m[1]);
  const cblk = t.match(/<choice>([\s\S]*?)<\/choice>/);
  if(cblk && cblk[1].includes('\n')) cblk[1].split(/\r?\n/).filter(s=>s.trim()).forEach(s=>pushOpt(s));
  for(const m of t.matchAll(/<choice>([^<]+?)<\/choice>/g)) pushOpt(m[1]);
  if(/<\s*状态栏\s*>[\s\S]*?(<\/\s*状态栏\s*>|$)/i.test(t) || /<\s*状态面板\s*\/?>/i.test(t)) r.statusSeen = true;
  r.updates = (t.match(/<\s*(UpdateVariable|update)\s*>/gi)||[]).length;
  return r;
}

    .replace(/“([^“”]{1,140})”/g, '<span class="dlg">“$1”</span>');               // 弯引号对白同款红色

  const riskCls = {'稳':'rk-safe','博':'rk-bold','险':'rk-risk','凶':'rk-doom','定':'rk-certain'};

function worldHeader(floorId){

function renderFloor(f, floorIdx){

  const total = FLOORS.length;
  const ord = idx + 1;
  const prevOk = idx > 0, nextOk = idx < FLOORS.length - 1;
  const html = `
    <header class="folio-head">${worldHeader(f.idx)}</header>
    <div class="scroll">
      ${r.header?`<div class="chapter-tag"><h2>${esc(r.header)}</h2><span class="ct-rule"></span><span class="ct-latin">CAPVT ${f.idx}</span></div>`:''}
      <div class="prose">${flowHtml(r.flow||[])}</div>
      ${(r.notes||[]).map(n=>`<aside class="preset-note"><span class="pn-label">${esc(n.tag.toUpperCase())}</span>${esc(n.text)}</aside>`).join('')}
      ${cards}${choices}
    </div>
    <footer class="folio-foot">
      <button class="ff-nav ff-prev" data-fnav="prev" ${prevOk?'':'disabled'} aria-label="上一页">‹ 上一页</button>
      <span class="ff-page">第 ${ord} 页 / 共 ${total} 页 · ${esc(f.label||'')}</span>
      <span class="ff-side"><span class="ff-scribe">${scribe}</span>${nextOk?`<button class="ff-latest" data-latest aria-label="回至最新页">回至最新页</button>`:''}<button class="ff-nav ff-next" data-fnav="next" ${nextOk?'':'disabled'} aria-label="下一页">下一页 ›</button></span>
    </footer>`;
  return {html, r};
}

/* ════════════════════════════════════════════════════
   伪全屏 + iframe 高度守卫（完全按幻璃镜机制重做，modian 前缀）
   蓝本：幻璃镜 GameScreen 伪全屏接管 + galgame-core/iframeGuard 高度守卫
        + galgame-core/ttFullscreenCompat TT 宿主兼容层（ST 上全 no-op）。
   进入：父页 <style id="tavern-modian-fs-hide"> 按 mesid 藏其余楼层
        → .mes fixed 八属性顶满视口（z 99999）→ iframe 100%/100%
        → __modianFullscreen=true → TT compat 接管（仅 TT 宿主生效）
        → 同时尝试原生 requestFullscreen（原生全屏是「魔典-锁定前端」的
          锁定触发器，Esc 退出归浏览器管；原生不可用时纯伪全屏兜底）。
   退出：先退原生全屏 → 清 .mes 八属性 → 摘藏楼 style → 标志 false
        → TT compat 恢复祖先链 → restoreIframeHeight（清内联→写目标高）
        → 守卫 burst（3×100ms 修竞态：全屏改了父页内联样式，不恢复是必现坑）。
   Esc/浏览器 UI 退出原生全屏 → fullscreenchange 同步走完整退出链。
   分工：本页负责视觉，「魔典-锁定前端」脚本负责保命（拦酒馆销毁 iframe）。
   浏览器裸跑：无父页 jQuery → 伪全屏静默跳过，只剩原生全屏尽力而为。
   ════════════════════════════════════════════════════ */
const FS_HIDE_ID = 'tavern-modian-fs-hide';

function parentJQ(){ try{ if(window.parent && window.parent !== window && window.parent.$) return window.parent.$; }catch(e){} return null; }
function selfIframe(){ try{ return window.frameElement || null; }catch(e){ return null; } }

/* ── TauriTavern 宿主全屏兼容层（照 galgame-core/ttFullscreenCompat 内联移植） ──
   背景：TT 宿主改写过 .mes 结构，并对第三方 fixed 浮层做几何管理；伪全屏直接
   把父页楼层改成 position:fixed，在 TT 上有两类已知症状——「不能全屏」（祖先链
   transform/contain 等把 fixed 困进祖先盒）与「发消息后全屏弹出」（楼层重渲染/
   虚拟化投影重置接管样式）。上游 SillyTavern 上 isTauriTavern() 为 false，
   三个入口全部 no-op，现有行为零改动。 */
const ttCompat = (()=>{
  const LOG = '[魔典·TT全屏兼容]';
  /* containing-block 陷阱属性 → 恒等值（非恒等值时后代 fixed 以该祖先为包含块而非视口） */
  const TRAP_PROPS = [
    ['transform','none'], ['contain','none'], ['filter','none'], ['backdrop-filter','none'],
    ['perspective','none'], ['will-change','auto'], ['content-visibility','visible'], ['container-type','normal']
  ];
  const SURFACE_ATTR = 'data-tt-mobile-surface', SURFACE_VALUE = 'fullscreen-window';
  let trapRestoreList = [], taggedEls = [], ttHostCache = null;

  /* TT 宿主检测：平台 ABI / 运行标记，本 iframe 与父窗口各查一轮（同源可读） */
  function isTauriTavern(){
    if(ttHostCache !== null) return ttHostCache;
    let detected = false;
    try{
      if(window.__TAURITAVERN__ && window.__TAURITAVERN__.abiVersion) detected = true;
      else if(window.__TAURI_RUNNING__ === true) detected = true;
    }catch(e){}
    if(!detected){
      try{
        const p = window.parent;
        if(p && p !== window){
          if(p.__TAURITAVERN__ && p.__TAURITAVERN__.abiVersion) detected = true;
          else if(p.__TAURI_RUNNING__ === true) detected = true;
        }
      }catch(e){ /* 跨域安全异常，按非 TT 处理 */ }
    }
    ttHostCache = detected;
    return detected;
  }
  function readTTDiagnostics(){
    const out = {};
    try{
      const p = (window.parent && window.parent !== window ? window.parent : window);
      out.abiVersion = (p.__TAURITAVERN__ && p.__TAURITAVERN__.abiVersion) ?? null;
      out.erProfile = (p.localStorage && p.localStorage.getItem('tt:embeddedRuntimeProfile')) ?? null;
    }catch(e){ out.erProfile = 'unreadable'; }
    return out;
  }
  /* 进入伪全屏（TT only）：中和祖先链 containing-block 陷阱（存原值，退出按原样
     恢复；幂等，先恢复上一轮）+ 打 fullscreen-window opt-in 标记（TT 几何防火墙
     尊重已显式标记的节点，不再当异常浮层修正） */
  function enter(takeoverEl){
    if(!isTauriTavern()) return;
    exit();
    if(!takeoverEl) return;
    let neutralized = 0;
    try{
      const doc = takeoverEl.ownerDocument;
      const root = doc && doc.documentElement;
      let node = takeoverEl.parentElement;
      while(node){
        const view = node.ownerDocument && node.ownerDocument.defaultView;
        if(view){
          const cs = view.getComputedStyle(node);
          for(const [prop, identity] of TRAP_PROPS){
            const value = cs.getPropertyValue(prop);
            if(value && value !== identity){
              trapRestoreList.push({
                el: node, prop,
                hadInline: node.style.getPropertyValue(prop) !== '',
                inlineValue: node.style.getPropertyValue(prop),
                inlinePriority: node.style.getPropertyPriority(prop)
              });
              node.style.setProperty(prop, identity, 'important');
              neutralized++;
            }
          }
        }
        if(node === root) break;
        node = node.parentElement;
      }
    }catch(err){ console.warn(LOG + ' 祖先链中和失败', err); }
    try{
      if(!takeoverEl.hasAttribute(SURFACE_ATTR)){
        takeoverEl.setAttribute(SURFACE_ATTR, SURFACE_VALUE);
        taggedEls.push(takeoverEl);
      }
    }catch(e){}
    console.info(LOG + ' 已接管:', Object.assign({ neutralized }, readTTDiagnostics()));
  }
  /* 退出伪全屏（TT only）：按原样恢复祖先链与标记（与 enter 成对调用，卸载兜底） */
  function exit(){
    while(trapRestoreList.length){
      const rec = trapRestoreList.pop();
      try{
        if(rec.hadInline) rec.el.style.setProperty(rec.prop, rec.inlineValue, rec.inlinePriority);
        else rec.el.style.removeProperty(rec.prop);
      }catch(e){}
    }
    while(taggedEls.length){
      const el = taggedEls.pop();
      try{ el.removeAttribute(SURFACE_ATTR); }catch(e){}
    }
  }
  /* 全屏状态再断言守卫：楼层重渲染/虚拟化投影协调会重置接管元素的
     内联样式，导致伪全屏丢失——标准 ST 同样发生（新楼到达 → 酒馆重渲染
     楼层 → position:fixed 被抹 → 退出全屏）。故**不设宿主门槛**，全宿主生效；
     TT 额外做祖先链中和与 opt-in 标记。 */
  function installReassert(applyFn, isActive){
    // iframe 内酒馆助手全局常常不存在 → 逐帧探测（window / parent / top）
    const frames = [];
    try{ frames.push(window); }catch(e){}
    try{ if(window.parent && window.parent!==window) frames.push(window.parent); }catch(e){}
    try{ if(window.top && window.top!==window) frames.push(window.top); }catch(e){}
    let events = {};
    let onFn = null;
    for(const f of frames){
      try{ if(!events.tavern_events && f.tavern_events) events = f.tavern_events; }catch(e){}
      try{ if(!onFn && typeof f.eventOn === 'function') onFn = f.eventOn.bind(f); }catch(e){}
    }
    if(!onFn) return ()=>{};
    const EVENT_KEYS = ['MESSAGE_RECEIVED','MESSAGE_SENT','MESSAGE_UPDATED','MESSAGE_SWIPED',
      'USER_MESSAGE_RENDERED','CHARACTER_MESSAGE_RENDERED','CHAT_CHANGED','MORE_MESSAGES_LOADED'];
    let timer, settleTimer;
    const schedule = ()=>{
      if(!isActive()) return;
      window.clearTimeout(timer); window.clearTimeout(settleTimer);
      timer = window.setTimeout(()=>{
        if(!isActive()) return;
        try{ applyFn(); }catch(err){ console.warn(LOG + ' 再断言失败', err); }
        settleTimer = window.setTimeout(()=>{ if(isActive()){ try{ applyFn(); }catch(e){} } }, 350);
      }, 250);
    };
    const disposers = [];
    for(const key of EVENT_KEYS){
      const name = events[key];
      if(typeof name !== 'string') continue;
      try{ const d = onFn(name, schedule); if(d && typeof d.stop === 'function') disposers.push(()=>d.stop()); }catch(e){}
    }
    return ()=>{
      window.clearTimeout(timer); window.clearTimeout(settleTimer);
      while(disposers.length){ try{ disposers.pop()(); }catch(e){} }
    };
  }
  return { isTauriTavern, enter, exit, installReassert };
})();

function isPseudoFS(){ return window.__modianFullscreen === true; }
function isAnyFullscreen(){ return isPseudoFS() || !!document.fullscreenElement; }

/* ── 伪全屏接管（照幻璃镜 GameScreen applyPseudoFullscreen） ── */
function applyPseudoFullscreen(){
  const p$ = parentJQ(); if(!p$) return false;
  const iframe = selfIframe();
  const $mes = iframe ? p$(iframe).closest('.mes') : p$('#chat .mes').last();
  const floorId = $mes.attr('mesid');
  let hideStyle = p$('#' + FS_HIDE_ID);
  if(hideStyle.length === 0) hideStyle = p$('<style id="' + FS_HIDE_ID + '"></style>').appendTo('head');
  hideStyle.text(floorId
    ? '#chat .mes:not([mesid="' + floorId + '"]) { display: none !important; }'
    : '#chat .mes { display: none !important; }');
  $mes.css({ position:'fixed', top:'0', left:'0', width:'100vw', height:'100vh',
    'z-index':'99999', 'max-width':'none', 'max-height':'none' });
  if(iframe){
    // 视口高写像素：iframe 与 .mes 之间的包裹链(height:auto)会让 height:100% 落空成 150px
    let ph = 0;
    try{ ph = window.parent.innerHeight|0; }catch(e){}
    p$(iframe).css({ width:'100%', height: (ph > 0 ? ph : window.innerHeight) + 'px' });
  }
  window.__modianFullscreen = true;
  ttCompat.enter($mes[0] || null);
  return true;
}
/* ── 撤销伪全屏接管（照幻璃镜 GameScreen clearPseudoFullscreen） ── */
function clearPseudoFullscreen(){
  const p$ = parentJQ(); if(!p$) return;
  const iframe = selfIframe();
  const $mes = iframe ? p$(iframe).closest('.mes') : p$('#chat .mes').last();
  $mes.css({ position:'', top:'', left:'', width:'', height:'', 'z-index':'', 'max-width':'', 'max-height':'' });
  p$('#' + FS_HIDE_ID).remove();
  window.__modianFullscreen = false;
  ttCompat.exit();
}
/* 退出全屏后恢复 iframe（照 galgame-core/restoreIframeHeight）：清内联 → 写回目标高 */
function restoreIframeHeight(){
  const p$ = parentJQ(), iframe = selfIframe();
  if(!p$ || !iframe) return;
  try{
    p$(iframe).css({ width:'', position:'', top:'', left:'', 'z-index':'', 'max-width':'', 'max-height':'' });
    p$(iframe).css({ height: targetHeight() + 'px' });
  }catch(e){}
}
function fsTabRefresh(){
  const on = isAnyFullscreen();
  // 常驻全屏钮同步文案与选中态
  document.querySelectorAll('.fs-toggle').forEach(b=>{
    const t = b.querySelector('.fs-t-label');
    if(t) t.textContent = on ? '收屏' : '全屏';
    b.classList.toggle('on', on);
  });
  document.body.classList.toggle('modian-fs-on', on);
}
function enterFullscreen(){
  if(isAnyFullscreen()) return true;
  const p$ = parentJQ();
  if(p$){
    applyPseudoFullscreen();
    console.info('[魔典] 已进入全屏模式');
    // 布防 .mes 样式守卫：全屏期间酒馆重渲染抹掉 position:fixed 时自动重接管
    try{ window.__modianGuardArm && window.__modianGuardArm(true); }catch(e){}
    // 原生全屏尽力而为：它是锁定前端的锁定触发器，Esc 归浏览器管；不可用（如 iframe 无 allowfullscreen）不影响伪全屏
    try{ document.documentElement.requestFullscreen().then(fsTabRefresh).catch(()=>{}); }
    catch(e){ console.warn('[魔典] 浏览器原生全屏失败，使用伪全屏', e); }
  }else{
    try{ document.documentElement.requestFullscreen().then(fsTabRefresh).catch(()=>{}); }
    catch(e){ console.warn('[魔典] 浏览器原生全屏失败，使用窗口最大化', e); }
  }
  fsTabRefresh();
  return true;
}
function exitFullscreen(){
  // 先撤防（铁律）：clearPseudo 改 .mes 内联样式会触发守卫的 MutationObserver，
  // 布防未撤时守卫会把「已恢复的楼层」误判为重渲染抹除并重新锁死（Esc 退屏锁层事故根源）。
  try{ window.__modianGuardArm && window.__modianGuardArm(false); }catch(e){}
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }
  catch(e){ console.warn('[魔典] 退出浏览器全屏失败', e); }
  clearPseudoFullscreen();
  restoreIframeHeight();
  iframeGuard.burst();
  fsTabRefresh();
  console.info('[魔典] 已退出全屏模式');
}
function toggleFullscreen(){ if(isAnyFullscreen()) exitFullscreen(); else enterFullscreen(); }
/* 用户按 Esc / 浏览器 UI 退出原生全屏 → 与按钮退出走完全相同的链（先撤防，缺一都锁层） */
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && isPseudoFS()){
    try{ window.__modianGuardArm && window.__modianGuardArm(false); }catch(e){}
    clearPseudoFullscreen();
    restoreIframeHeight();
    iframeGuard.burst();
    console.info('[魔典] 浏览器全屏退出，已同步退出伪全屏');
  }
  fsTabRefresh();
});

/* ── iframe 高度守卫：事件驱动（观察者×3 + rAF 合帧 + 差值写入），全屏期间静默 ── */
function targetHeight(){
  const mobile = window.innerWidth <= 760;
  const def = mobile ? 700 : 800;
  try{ const ph = window.parent.innerHeight; if(ph > 0 && ph < def + 40) return Math.max(400, ph - 20); }catch(e){}
  return def;
}
const iframeGuard = (()=>{
  const p$ = parentJQ(), iframe = selfIframe();
  if(!p$ || !iframe) return { force(){}, burst(){}, destroy(){} };
  let raf = 0, dead = false;
  const apply = ()=>{
    if(dead) return;
    try{
      if(window.__modianFullscreen){
        // 全屏期间不静默：外部（酒馆/TT 的 iframe 自动高度）会把 iframe 写成定值（实见 150px 挤扁），
        // 这里盯住并重写成视口像素高（包裹链 height:auto 会让 100% 落空）。写前比实测矩形，到位不动笔。
        let ph = 0; try{ ph = window.parent.innerHeight|0; }catch(e){}
        const want = Math.max(400, ph > 0 ? ph : window.innerHeight);
        const cur = iframe.getBoundingClientRect().height;
        if(Math.abs(cur - want) > 2) p$(iframe).css({ width:'100%', height: want + 'px' });
        return;
      }
      const t = targetHeight(); const h = p$(iframe).height() || 0;
      if(Math.abs(h - t) > 1) p$(iframe).css({ height: t + 'px' });
    }catch(e){}
  };
  const schedule = ()=>{ if(raf || dead) return; raf = requestAnimationFrame(()=>{ raf = 0; apply(); }); };
  apply();
  let o1 = null, o2 = null, o3 = null;
  try{ o1 = new MutationObserver(schedule); o1.observe(iframe, { attributes:true, attributeFilter:['style'] }); }catch(e){}
  try{ const pe = iframe.parentElement; if(pe){ o2 = new MutationObserver(schedule); o2.observe(pe, { attributes:true, attributeFilter:['style','class'] }); } }catch(e){}
  try{ o3 = new ResizeObserver(schedule); o3.observe(document.body); }catch(e){}
  const onResize = ()=>schedule();
  window.addEventListener('resize', onResize);
  return {
    force: apply,
    burst(){ apply(); setTimeout(apply, 100); setTimeout(apply, 200); },
    destroy(){
      dead = true; if(raf) cancelAnimationFrame(raf);
      if(o1) o1.disconnect(); if(o2) o2.disconnect(); if(o3) o3.disconnect();
      window.removeEventListener('resize', onResize);
      try{ p$(iframe).css({ height: '' }); }catch(e){}
    }
  };
})();
/* TT 宿主再断言守卫：楼层重渲染/虚拟化投影重置接管样式 → 事件驱动重新应用
   （ST 上 installReassert 返回空 disposer，行为不变） */
const disposeTTReassert = ttCompat.installReassert(()=>{
  applyPseudoFullscreen();
}, isPseudoFS);

/* 兜底守卫：酒馆重渲染楼层时会直接抹掉 .mes 的内联 position:fixed，
   而上述事件在部分宿主上不触发。直接在父页盯 .mes 的 style 变化，
   一旦被重置就立刻重新接管（与事件守卫互补，双保险）。 */
(function installMesStyleGuard(){
  const p$ = parentJQ(); if(!p$) return;
  let armed = false, raf = 0, busy = false;
  const reassert = ()=>{
    if(!armed || busy) return;               // busy 自锁：重接管期间忽略自己引发的 DOM 变化
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>{
      raf = 0;
      if(!armed) return;
      if(window.__modianFullscreen !== true) return;   // 双闸门：非全屏态绝不重接管（退出竞态的硬保险）
      const iframe = selfIframe();
      const $mes = iframe ? p$(iframe).closest('.mes') : p$('#chat .mes').last();
      if(!$mes.length) return;
      const pos = $mes.css('position');
      const z = String($mes.css('z-index') || '');
      if(pos === 'fixed' && z === '99999') return;   // 接管仍在 → 什么都不做
      busy = true;                                  // ← 关键：上锁，阻断自触发循环
      console.info('[魔典] 楼层接管样式被重置，已重新接管');
      try{ applyPseudoFullscreen(); }catch(err){ console.warn(err); }
      setTimeout(()=>{ busy = false; }, 120);        // 落盘后再解锁
    });
  };
  try{
    const mo = new MutationObserver(reassert);
    mo.observe(p$('#chat')[0] || p$(document.body)[0], { subtree:true, childList:true, attributes:true, attributeFilter:['style','class'] });
  }catch(e){}
  // 布防/撤防（仅切状态，不主动重接管——避免与 enterFullscreen 打架）
  window.__modianGuardArm = (on)=>{ armed = !!on; };
})();
/* 启动自愈：本 iframe 开机时，若父页没有任何楼层处于伪全屏钉态，
   说明父页残留的藏楼样式是上一轮异常留下的（owner 已被销毁/换 mesid），立即摘除。 */
try{
  const p$ = parentJQ();
  if(p$){
    const pinned = p$('#chat .mes').filter(function(){
      return p$(this).css('position')==='fixed' && String(p$(this).css('z-index'))==='99999';
    }).length;
    if(!pinned){
      const hs = window.parent.document.getElementById(FS_HIDE_ID);
      if(hs){ hs.remove(); console.info('[魔典] 已摘除上一轮遗留的藏楼样式'); }
    }
  }
}catch(e){}
window.addEventListener('pagehide', ()=>{ clearPseudoFullscreen(); iframeGuard.destroy(); disposeTTReassert(); });

/* ---------- 翻页 与 时序 ---------- */
let cur = 0;
let stage = 'cover'; // cover → endpaper → ritual → awaiting → reading
function setStage(s){ stage = s; tome.dataset.stage = s; }
/* 末页是真实楼层（非封面）的最大下标；没有则 -1 */
function lastRealIdx(){
  for(let i=FLOORS.length-1; i>=1; i--){ if(!parseFloor(FLOORS[i].raw).cover) return i; }
  return -1;
}
function showFloor(idx, dir){
  idx = Math.max(0, Math.min(FLOORS.length-1, idx));
  /* 封面判定：只认「这是真的封面页」（idx=0 的开场白）。
     关键：syncFloors 的占位封面在有真实楼层后若仍按 r.cover 回退 showCover()，
     新楼到达时会把用户按回封面，永远看不到第一幕——所以只有 idx===0 才允许退封面。
     ⚠ 末位若是封面占位（首个开场白被删/换位、酒馆把占位排到非 0 位），
       这里**绝不能早退**：早退会留下「封面已 opened(opacity:0) + 书页空白」=
       点封面后白屏无内容（用户实况）。改为回退到最近一页真实楼层；
       一页真实楼层都没有才退回封面（而不是留白）。*/
  if(parseFloor(FLOORS[idx].raw).cover && idx !== 0){
    const real = lastRealIdx();
    if(real >= 0){ idx = real; }
    else { showCover(); cur = 0; return; }
  }
  const {html, r} = renderFloor(FLOORS[idx], idx);
  const isRealCover = r.cover && idx === 0;

  cur = idx;

}

/* 触摸手势：横滑翻楼层，竖滑读当前楼层（方向占优判定，斜滑不误触） */
let touchStart = null;
addEventListener('touchstart', e=>{
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, {passive:true});
addEventListener('touchend', e=>{
  if(touchStart==null){ return; }
  const sx = touchStart.x, sy = touchStart.y; touchStart = null;
  if(ritOpen() || epOpen() || insertOpen || tocOpen() || stage!=='reading') return;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if(Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.3) return; // 竖滑/斜滑 → 交给原生滚动
  if(dx > 0){ if(cur>1) showFloor(cur-1,-1); else setStage('cover'), showCover(); }
  else if(cur>=1 && cur<FLOORS.length-1) showFloor(cur+1,1);
}, {passive:true});

/* 信笺橱窗：书底缘上方居中（手机端抬到书签底栏之上），随窗口 resize 重定位
 *
 * 坐标系铁律：伪全屏时 #stage 会挂 zoom:1.2，此时 getBoundingClientRect() 返回的是
 * 「缩放后的屏幕坐标」，而 letter 的 left/top 是 #stage 的「缩放前局部坐标」。
 * 两者混算必然错位（全屏时信笺底部被推出视口 ~140px）。
 * 故此处一律用 offsetLeft/offsetTop/offsetWidth（缩放前的布局坐标），
 * 夹逼也用 stage.clientWidth/Height（同样是局部坐标），全程不碰 rect。
 */
function positionLetter(){
  const stage = tome.parentElement || document.getElementById('stage');
  const sw = stage.clientWidth  || window.innerWidth;
  const sh = stage.clientHeight || window.innerHeight;
  const lw = letterEl.offsetWidth  || Math.min(560, sw * .92);
  const lh = letterEl.offsetHeight || 240;
  const pad = 10;
  const lift = sw <= 760 ? 62 : 26;   // 手机端为书签底栏留位
  // 局部坐标：tome.offsetLeft/Top 已是相对 #stage 的布局偏移（flex 居中已算好）
  let lx = tome.offsetLeft + (tome.offsetWidth  - lw) / 2;
  let ly = tome.offsetTop  + (tome.offsetHeight - lh) - lift;
  lx = Math.min(Math.max(pad, lx), Math.max(pad, sw - lw - pad));
  ly = Math.min(Math.max(pad, ly), Math.max(pad, sh - lh - pad));
  letterEl.style.left = Math.round(lx) + 'px';
  letterEl.style.top  = Math.round(ly) + 'px';
}
function openLetter(){
  positionLetter();
  letterEl.classList.add('open');
  quillTabEl()?.classList.add('active');
  letFrom.textContent = Stat.get('主角.姓名', null) || '无名旅人';
  updLetterCount();
}

const insertEl = document.getElementById('insert');
let insertOpen = null;
/* ═══════════════════════════════════════════════════════════════
   卷册删改 · 删楼层 + 重生成（合并一册）
   契约对齐幻璃镜：删除走 /cut start-end（彻底删楼，非清空内容）；
   重生成走静默 generate + setChatMessages 覆写（不删楼不建楼，iframe 零重载）。
   ⚠ iframe 适配：酒馆助手全局未必在本上下文，逐帧探测；取不到则明说，不假装成功。
   ═══════════════════════════════════════════════════════════════ */
const ScrollOps = (()=>{
  let from = '', to = '', target = null, busy = false;

  function frames(){
    const out = [];
    try{ out.push(window); }catch(e){}
    try{ if(window.parent && window.parent !== window) out.push(window.parent); }catch(e){}
    try{ if(window.top && window.top !== window) out.push(window.top); }catch(e){}
    return out;
  }
  function api(name){
    for(const f of frames()){
      try{ if(typeof f[name] === 'function') return f[name].bind(f); }catch(e){}
    }
    return null;
  }
  /* 当前 AI 楼层号（书页 idx，排除封面占位） */
  function aiFloorIds(){
    return FLOORS.filter(f=>!parseFloor(f.raw).cover).map(f=>Number(f.idx)).filter(n=>!isNaN(n));
  }
  function curIdxOf(floorId){ return FLOORS.findIndex(f=>Number(f.idx) === Number(floorId)); }

  async function doDelete(){
    if(busy) return;
    const a = parseInt(from, 10), b = parseInt(to, 10);
    if(isNaN(a) || isNaN(b) || a<0 || b<a){ notify('楼层范围无效：需「起始 ≤ 结束」。','warn',3200); return; }
    const cut = api('triggerSlash');
    if(!cut){ notify('未取得酒馆助手 triggerSlash，当前环境非酒馆，未执行。','warn',4200); return; }
    busy = true;
    try{
      await cut(`/cut ${a}-${b}`);
      notify(`已焚卷：第 ${a} 至 ${b} 页。`,'gild',3600);
      from = ''; to = '';
      setTimeout(()=>{ syncFloors(); if(insertOpen) openInsert(insertOpen); }, 700);
    }catch(e){
      notify('焚卷失败：' + ((e && e.message) || e), 'warn', 4200);
    }finally{ busy = false; }
  }

  async function doRegen(){
    if(busy) return;
    if(target === null){ notify('请先点选要重生成的楼层。','warn',3000); return; }
    const gen = api('generate');
    if(!gen){ notify('未取得酒馆助手 generate，当前环境非酒馆，未执行。','warn',4200); return; }
    busy = true;
    try{
      const cur = (getChatMessages(target)||[])[0];
      if(!cur) throw new Error('未找到该楼层');
      let userText = '';
      for(let k = target - 1; k >= 0; k--){
        const m = (getChatMessages(k)||[])[0];
        if(m && m.role === 'user'){ userText = m.message || ''; break; }
      }
      const histEnd = userText ? target - 2 : target - 1;
      const raw = histEnd >= 0
        ? await gen({ user_input: userText, should_stream:false, should_silence:true,
            overrides:{ chat_history:{ prompts: getChatMessages('0-'+histEnd) } } })
        : await gen({ should_stream:false, should_silence:true });
      if(!raw || typeof raw !== 'string') throw new Error('AI 返回为空');
      const setM = api('setChatMessages');
      if(setM) await setM([{ message_id: target, message: raw }], { refresh:'none' });
      notify(`第 ${target} 页已重演。`,'gild',3200);
      setTimeout(()=>{ syncFloors(); if(insertOpen) openInsert(insertOpen); }, 700);
    }catch(e){
      notify('重演失败：' + ((e && e.message) || e), 'warn', 4200);
    }finally{ busy = false; }
  }

  function render(){
    const ids = aiFloorIds();
    const cur = (target !== null && curIdxOf(target) >= 0) ? FLOORS[curIdxOf(target)] : null;
    return `
    <div class="sec-title">卷册 · 删改</div>
    <div class="sc-grid">
      <div class="sc-card">
        <div class="sc-lab">焚卷 <em>彻底删除楼层</em></div>
        <div class="sc-in">
          <input type="number" min="0" data-sc="from" value="${esc(from)}" placeholder="起">
          <span style="align-self:center;color:var(--gilt-dim)">—</span>
          <input type="number" min="0" data-sc="to" value="${esc(to)}" placeholder="止">
        </div>
        <div class="sc-in" style="margin-bottom:10px">
          <button type="button" class="sc-go" id="sc-del" ${busy?'disabled':''}>焚 毁</button>
        </div>
        <p class="sc-hint">按楼层号删除（用户楼与 AI 楼都算），走 /cut 彻底移除而非清空内容。<br>当前共 ${ids.length} 个 AI 楼层。</p>
      </div>
      <div class="sc-card">
        <div class="sc-lab">重演 <em>静默重生成，不删楼不建楼</em></div>
        <div class="sc-cur">${cur
          ? `当前 <b>第 ${target} 页</b><span class="sc-pill">${esc(cur.label||'')}</span>`
          : '<span style="color:var(--ink-faint)">未选楼层 —— 点下方任意一页</span>'}</div>
        <div class="sc-chapters">${ids.length ? ids.map(i=>
          `<button type="button" class="sc-ch${i===target?' on':''}${busy?' busy':''}" data-sc-ch="${i}">第 ${i} 页</button>`).join('')
          : '<span class="sc-hint">尚无 AI 楼层。</span>'}</div>
        <div class="sc-in" style="margin-top:10px">
          <button type="button" class="sc-go" id="sc-regen" ${(busy||target===null)?'disabled':''}>重 演</button>
        </div>
        <p class="sc-hint">静默生成后覆写原楼层内容，前端零重载（不退出全屏）。</p>
      </div>
    </div>`;
  }

  function bind(root){
    root.querySelectorAll('[data-sc]').forEach(el=>{
      const k = el.dataset.sc;
      el.addEventListener('input', ()=>{ if(k==='from') from = el.value; else to = el.value; });
    });
    root.querySelectorAll('[data-sc-ch]').forEach(b=>b.addEventListener('click', ()=>{
      target = +b.dataset.scCh;
      if(insertOpen) openInsert(insertOpen);
    }));
    const d = root.querySelector('#sc-del'); if(d) d.addEventListener('click', doDelete);
    const r = root.querySelector('#sc-regen'); if(r) r.addEventListener('click', doRegen);
  }

  return { render, bind, _state:()=>({from,to,target,busy}) };
})();

const WIKI_API = 'https://zhmonstergirlencyclopedia.miraheze.org/w/api.php';
function mgeCleanWiki(wt){
  return String(wt)
    .replace(/<references\s*\/?>/gi,'')
    .replace(/<ref[\s\S]*?<\/ref>/gi,'')
    .replace(/<ref[^>]*\/>/gi,'')
    .replace(/\{\{角色信息[\s\S]*?\}\}/g,'')
    .replace(/\{\{[^}]*\}\}/g,'')
    .replace(/\[\[(?:分类|Category|File|文件|Image):[^\]]*\]\]/gi,'')
    .replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g,'$1')
    .replace(/'/g,'').replace(/'/g,'')
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/^\s*=+\s*([^=\n]+?)\s*=+\s*$/gm,'【$1】')
    .replace(/<!--[\s\S]*?-->/g,'')
    .replace(/<\/(?:p|div|blockquote|center|table|ul|ol|li)>/gi,'\n\n')
    .replace(/<\/?[a-zA-Z][^>]*>/g,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
function wikiBlock(r){

        const res = await fetch(WIKI_API + '?action=parse&redirects=1&prop=wikitext&format=json&origin=*&page=' + encodeURIComponent(name), { signal: ctl.signal });
        clearTimeout(tm);
        const dd = await res.json();
        const wt = dd && dd.parse && dd.parse.wikitext && dd.parse.wikitext['*'];
        c[name] = wt ? mgeCleanWiki(wt).slice(0, 1800) : false;

function dexApi(name){
  const fr = [window];
  try{ if(window.parent && window.parent!==window) fr.push(window.parent); }catch(e){}
  try{ if(window.top && window.top!==window) fr.push(window.top); }catch(e){}
  for(const f of fr){ try{ if(typeof f[name]==='function') return f[name].bind(f); }catch(e){} }

async function fetchHeroineWb(name){
  /* 读角色卡绑定世界书（primary + additional），按条目名/关键词匹配女主 —— 每次打开详情现取，条目被 AI 改了显示就跟着变 */
  try{
    const namesFn = dexApi('getCharWorldbookNames');
    const getFn = dexApi('getWorldbook');
    if(!namesFn || !getFn) return null;
    const cb = await namesFn('current');
    const books = [];
    if(cb && cb.primary) books.push(cb.primary);
    if(cb && Array.isArray(cb.additional)) books.push(...cb.additional);
    for(const wbn of books){
      let entries = null;
      try{ entries = await getFn(wbn); }catch(e){ continue; }
      const hit = (entries||[]).find(e=>{
        if(!e) return false;
        if(e.name && (e.name === name || e.name.includes(name))) return true;
        const ks = (e.strategy && e.strategy.keys) || [];
        return ks.some(k=> typeof k==='string' && k.length>=2 && (k === name || name.includes(k)));
      });
      if(hit && hit.content) return hit.content;
    }
    return false;
  }catch(e){ return null; }
}

  const head = `<div class="sec-title">种族总览 · ${esc(DX.stats||(cats.length+' 大类'))}</div>
  <div class="plaque"><h4>收录进度<span class="k-latin">Collectio</span></h4>
    <div class="p-desc">已收录 <b>${metSet.size}</b> / ${total} 种族</div></div>`;
  if(!unlocked){
    return head + `
    <div class="dex-lock">
      <div class="dl-seal">${ICON.seal}</div>
      <div class="dl-text">未收录图鉴已封印 · 念对密语可临时预览</div>
      <div class="dl-form"><input id="dex-pass" type="text" placeholder="密语" autocomplete="off"><button id="dex-verify">验印</button></div>
    </div>`;
  }
  // 详情模式
  if(window.__dexDetail){
    const all = cats.flatMap(c=>c.races);
    const r = all.find(x=>x.no===window.__dexDetail) || all.flatMap(c=>c.races.map(x=>({...x,cat:c.name}))).find(x=>x.no===window.__dexDetail);
    const catName = (cats.find(c=>c.races.some(x=>x.no===window.__dexDetail))||{}).name||'';
    if(r){
      const rows = [['科属',r.family2||r.family],['类型',r.type||catName],['栖息地',r.habitat2||r.habitat],['性格',r.character],['食谱',r.food],['特征',r.feat],['别名',r.alias]].filter(([,v])=>v);
      return `<div class="dex-detail">
      <button class="dd-back" data-dback>${ICON.chevL}<span>返回名册</span></button>
      <div class="dd-hero">${cameo(r.name.slice(0,1),'NO.'+r.no)}
        <div class="dd-id"><div class="dd-no">NO.${r.no} · ${esc(catName)}</div>
          <div class="dd-nm">${esc(r.name)}</div>
          ${r.en?`<div class="dd-en">${esc(r.en)}</div>`:''}</div></div>
      <dl class="dd-fields">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      ${r.intro?`<div class="dd-lore"><div class="dw-cardlabel">图鉴条目 · 卡内</div><p>${esc(r.intro)}</p></div>`:''}
      ${wikiBlock(r)}
      ${r.en?`<div class="dd-lore"><div class="dw-cardlabel">英文 WIKI · MGE Wiki</div><p><a class="dex-enlink" href="https://mgewiki.moe/index.php/${encodeURIComponent(r.en.replace(/ /g,'_'))}" target="_blank" rel="noopener">${esc(r.en)} · 前往英文 wiki ↗</a></p></div>`:''}
      <div class="dw-cardlabel">你的图鉴 · 交往关系</div>
      ${emptyNote('与此族尚无羁绊。')}
    </div>`;}
  }
  // 名册模式（搜索 + 三种排法）
  const mode = window.__dexMode||'type';
  const q = (window.__dexQ||'').trim();
  const raceCell = (r,cat)=>`<button class="dex-slot${metSet.has(r.name)?' met':''}" data-race="${r.no}">${cameo(r.name.slice(0,1),'NO.'+r.no)}<span class="ds-nm">${esc(r.name)}</span>${r.en?`<span class="ds-en">${esc(r.en)}</span>`:''}${metSet.has(r.name)?'<span class="ds-met">已遭遇</span>':''}</button>`;
  const match = (r,cat)=>{ if(!q) return true; const s=(r.name+' '+r.en+' '+r.no+' '+(r.family||'')+' '+(r.habitat||'')+' '+cat).toLowerCase(); return s.includes(q.toLowerCase()); };
  let body = '';
  const tap = `<div class="dw-searchbar"><input id="dex-q" type="search" autocomplete="off" placeholder="搜索名称 / 编号 / 类型 / 科属 / 栖息地" value="${esc(q)}"><span class="dw-tabs">${[['type','大类'],['family','科属'],['number','编号']].map(([v,n])=>`<button class="dw-tab${mode===v?' on':''}" data-mode="${v}">${n}</button>`).join('')}</span></div>`;
  if(mode==='number'){
    const all = cats.flatMap(c=>c.races.map(r=>({...r,cat:c.name}))).sort((a,b)=>a.no.localeCompare(b.no));
    const list = all.filter(r=>match(r,''));
    body = `<div class="dex-grid">${list.map(r=>raceCell(r,'')).join('')}</div>${list.length?'':emptyNote('没有匹配的记录。')}`;
  }else if(mode==='family'){
    const fams = {};
    cats.forEach(c=>c.races.forEach(r=>{ const f=r.family||'未归科属'; (fams[f]=fams[f]||[]).push({...r,cat:c.name}); }));
    body = Object.entries(fams).map(([f,rs])=>{
      const list = rs.filter(r=>match(r,f));
      if(!list.length && q) return '';
      return `<div class="dw-region">${esc(f)}<span>${rs.length} 种族</span></div><div class="dex-grid">${list.map(r=>raceCell(r,'')).join('')}</div>`;
    }).join('') || emptyNote('没有匹配的记录。');
  }else{
    body = cats.map(c=>{
      const list = c.races.filter(r=>match(r,c.name));
      if(!list.length && q) return '';
      return `<div class="dw-region">${esc(c.name)}<span>${c.races.length} 种族${c.alts?` · 异写 ${esc(c.alts)}`:''}</span></div><div class="dex-grid">${list.map(r=>raceCell(r,c.name)).join('')}</div>`;
    }).join('') || emptyNote('没有匹配的记录。');
  }
  return head + tap + `<div class="dex-list">${body}</div>`;
}

/* —— 陆 · 委托与任务 —— */
function renderMandata(){
  const quests = Stat.get('任务', {}) || {};
  const questKeys = Object.keys(quests);
  const chains = Stat.get('事件记录.进行中', {}) || {};
  const chainKeys = Object.keys(chains);
  const recent = Stat.get('事件记录.近期', []) || [];
  const doneCnt = questKeys.filter(k=>/完成|达成/.test((quests[k]&&quests[k].结果)||'')).length;
  const bondRaces = new Set(Object.values(Stat.get('羁绊', {}) || {}).map(b=>b && b.种族).filter(Boolean));
  const repNow = Stat.get('阵营声望', {});
  const maxRep = Math.max(Math.abs(repNow.魔界友好度||0), Math.abs(repNow.教团信任度||0), Math.abs(repNow.佳婿风评||0));
  const holdNow = Stat.get('据点', {});
  const litNow = Stat.get('图鉴.已遭遇种族', []).length;
  const bondedNow = Stat.get('图鉴.结缘对象', []).length;
  const deeds = [
    ['初次结缘','与任意 1 位魔物娘结缘', bondedNow>=1],
    ['三重羁绊','同时与「独角兽」「双角兽」结缘', bondRaces.has('独角兽')&&bondRaces.has('双角兽')],
    ['三重羁绊','同时与「白蛇」「双角兽」结缘', bondRaces.has('白蛇')&&bondRaces.has('双角兽')],
    ['三重羁绊','同时与「女武神」「暗黑女武神」结缘', bondRaces.has('女武神')&&bondRaces.has('暗黑女武神')],
    ['三重羁绊','同时与「吸血鬼」「狼人」结缘', bondRaces.has('吸血鬼')&&bondRaces.has('狼人')],
    ['三重羁绊','同时与「丧尸」「骷髅」「幽灵」结缘', ['丧尸','骷髅','幽灵'].every(r=>bondRaces.has(r))],
    ['三重羁绊','同时与「凯西」「猫又」「斯芬克斯」结缘', ['凯西','猫又','斯芬克斯'].every(r=>bondRaces.has(r))],
    ['三重羁绊','同时与「魅魔」「莉莉姆」结缘', bondRaces.has('魅魔')&&bondRaces.has('莉莉姆')],
    ['三重羁绊','同时与「亚巴顿」「亚巴顿群众」结缘', bondRaces.has('亚巴顿')&&bondRaces.has('亚巴顿群众')],
    ['三重羁绊','同时与「龙」「龍」结缘', bondRaces.has('龙')&&bondRaces.has('龍')],
    ['三重羁绊','同时与「哥布林」「大哥布林」结缘', bondRaces.has('哥布林')&&bondRaces.has('大哥布林')],
    ['完成 1 次任务','完成 1 次任务', doneCnt>=1],
    ['熟手冒险者','完成 5 次任务', doneCnt>=5],
    ['委托十连','完成 10 次任务', doneCnt>=10],
    ['功成名就','完成 25 次任务', doneCnt>=25],
    ['任一阵营声望达 ±60','任一阵营声望达 ±60', maxRep>=60],
    ['拥有任意据点','拥有任意据点', !!(holdNow&&holdNow.状态&&holdNow.状态!=='无')],
    ['全图鉴达成','破百那晚记得给自己倒一杯——图鉴比你先认识全世界了', litNow>=237],
  ];
  return `
  <div class="sec-title">进行中 · 委托</div>
  ${questKeys.length ? questKeys.map(k=>{ const t=quests[k]||{}; return `
    <div class="plaque"><h4>${esc(k)}<span class="k-latin">${esc([t.类型,t.进度].filter(Boolean).join(' · ')||'委托')}</span><span class="init-badge">${esc(t.结果||'未结算')}</span></h4>
    <div class="p-desc">${[['目标',t.目标],['报酬',t.报酬],['期限',t.期限],['来源',t.来源],['关联区域',t.关联区域],['关联人物',t.关联NPC],['接取',t.接取时间],['后果',t.后果]].filter(([,v])=>v&&!/未结算|无$/.test(String(v))).map(([l,v])=>`${l} · ${esc(v)}`).join('<br>')}</div></div>`; }).join('') : emptyNote('当前没有进行中的任务。')}
  <div class="sec-title">事件链</div>
  ${chainKeys.length ? chainKeys.map(k=>{ const e=chains[k]||{}; return `
    <div class="plaque"><h4>${esc(k)}<span class="k-latin">${esc(e.阶段||'预兆')}</span></h4>
    ${meter('进度', Number(e.进度)||0, 100, ['#96372E','#B04A3E'])}
    <div class="p-desc">${[['源势力',e.源势力],['目标势力',e.目标势力],['预兆',e.预兆],['起始',e.开始时间]].filter(([,v])=>v&&!/未知|^无$/.test(String(v))).map(([l,v])=>`${l} · ${esc(v)}`).join('<br>')||'—'}</div></div>`; }).join('') : emptyNote('尚无进行中的事件链。')}
  ${recent.length ? `<div class="sec-title">近期事件</div>` + recent.slice(-6).reverse().map(e=>`
    <div class="plaque"><h4>${esc(e.键||'未命名事件')}<span class="k-latin">${esc([e.时间,e.地点].filter(Boolean).join(' · ')||'')}</span></h4>
    <div class="p-desc">${esc(e.摘要||'')}${e.结果?`<br>结果 · ${esc(e.结果)}`:''}</div></div>`).join('') : ''}
  <div class="sec-title">行会印鉴 · 成就录</div>
  ${deeds.map(([t,d,ok])=>`
    <div class="plaque" style="display:flex;align-items:center;gap:12px">
      <span style="flex:none;width:30px;height:30px;${ok?'':'opacity:.55;filter:grayscale(1)'}">${ICON.seal}</span>
      <div><h4 style="font-size:13.5px">${esc(t)}</h4><div class="p-desc">${esc(d)}</div></div>
      <span class="init-badge">${ok?'已钤印':'未钤印'}</span></div>`).join('')}`;
}

if(!FLOORS.length){
  FLOORS = [{ idx:0, label:'封面 · 扉页', raw:'<start>\n'+(D.firstMesText||'')+'\n</start>' }];   // 保底单封面（真机拉楼层失败的兜底）
  if(!inTavern()) notify('content-data / demo-floors 未载入——书页无米下锅', 'warn', 8000);
}
showCover();
{ // 调试直达：?floor=2 / ?insert=fama / ?ritual=1（验收截图用，不影响正常进入）
  const q = new URLSearchParams(location.search);
  const f = parseInt(q.get('floor')||'', 10);
  if(!isNaN(f) && FLOORS[f]){ coverEl.classList.add('opened'); coverEl.style.display='none'; showFloor(f, 1); }
  const ins = q.get('insert');
  if(q.get('dexopen')==='1') window.__dexUnlocked = true;
  if(q.get('ddetail')){ window.__dexUnlocked = true; window.__dexDetail = q.get('ddetail'); }
  if(ins && MODULES.some(m=>m.key===ins)) openInsert(ins);
  if(q.get('dscroll')) setTimeout(()=>insertEl.querySelector('.dw-searchbar, .dd-back, .dex-lock')?.scrollIntoView({block:'start'}), 120);
  if(q.get('ritual')){ coverEl.classList.add('opened'); coverEl.style.display='none';
    const iv = setInterval(()=>{
      if(typeof window.openRitual === 'function'){
        clearInterval(iv);
        openRitual();
        const rs = parseInt(q.get('rstep')||'', 10);
        if(!isNaN(rs)) setTimeout(()=>window.__ritStep(rs), 120);
      }
    }, 60);
  }
  if(q.get('ep')){ coverEl.classList.add('opened'); coverEl.style.display='none'; setTimeout(()=>showEndpaper(coverEl.dataset.text),0); }
  if(q.get('letter')){ coverEl.classList.add('opened'); coverEl.style.display='none'; setTimeout(()=>{ if(letBody && !letBody.value) enterDraft('接过那盏引路的灯火'); else openLetter(); },200); }
}
/* 现场诊断：真机白屏/空页时，在该 iframe 的控制台敲 __MODIAN.diag() 即可拿到全量剖面 */
function diag(){
  const t=document.getElementById('tome'), c=document.getElementById('cover'),
        pb=document.getElementById('page-base'), ep=document.getElementById('endpaper');
  const cs=(el)=>{ if(!el) return null; const s=getComputedStyle(el);
    const r=el.getBoundingClientRect();
    return {display:s.display,opacity:s.opacity,visibility:s.visibility,z:s.zIndex,
            rect:[Math.round(r.width),Math.round(r.height)],len:(el.textContent||'').trim().length}; };
  let api={};
  for(const k of ['getChatMessages','getLastMessageId','eventOn']){
    try{ api[k]= (typeof window[k]==='function') ? (k==='getLastMessageId'?window[k]():'fn') : typeof window[k]; }
    catch(e){ api[k]='THROW:'+e.message; }
  }
  let floors=[];
  try{ floors=(typeof FLOORS!=='undefined'?FLOORS:[]).map((f,i)=>{
    let r; try{ r=parseFloor(f.raw); }catch(e){ return {i,idx:f.idx,parseErr:''+e}; }
    return {i,idx:f.idx,label:f.label,rawLen:(f.raw||'').length,cover:!!r.cover,
            flow:(r.flow||[]).length,cards:(r.cards||[]).length,opts:(r.options||[]).length,
            head:(r.header||'').slice(0,16)};
  }); }catch(e){ floors=[{err:''+e}]; }
  return {
    url:location.href,
    stage:t?.dataset.stage, tomeClass:t?.className,
    cover:cs(c), coverOpened:c?.classList.contains('opened'), coverTextLen:(c?.dataset?.text||'').trim().length,
    page:cs(pb), endpaper:cs(ep), endpaperOpen:ep?.classList.contains('open'),
    ritualOpen:!!document.querySelector('.ritual.open'),
    insertOpen:(typeof insertOpen!=='undefined'?insertOpen:null),
    letterOpen:!!document.querySelector('.letter.open'),
    floorsLen:(typeof FLOORS!=='undefined'?FLOORS.length:null), hasRealFloor:(typeof hasRealFloor==='function'?hasRealFloor():null),
    fs:{pseudo:window.__modianFullscreen===true,native:!!document.fullscreenElement,
        bodyCls:document.body.className,modianFS:!!document.getElementById('modian-fs-hide')},
    data:{MODIAN_DATA:!!window.MODIAN_DATA,firstMesTextLen:((window.MODIAN_DATA||{}).firstMesText||'').length,
          MODIAN_FLOORS:(window.MODIAN_FLOORS||[]).length,MODIAN_RITUAL:!!window.MODIAN_RITUAL},
    api, inTavern:(typeof inTavern==='function'?inTavern():null),
    lastId:(typeof getLastMessageId==='function'?getLastMessageId():'n/a'),
    floors,
  };
}
window.__MODIAN = { showFloor, openInsert, parseFloor, notify, diag,
  // 应急出口：万一点封面后是空页，直接从这里跳到末页/封面
  jump:(i)=>showFloor(i==null?FLOORS.length-1:i,1),
  debugShowFloor:(i)=>{ const c=document.getElementById('cover'); if(c){c.classList.add('opened');c.style.display='none';} showFloor(i,1); },
};

.lv-roll{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid rgba(120,96,56,.55);font-size:12.5px;color:var(--ink-soft);font-family:var(--font-serif);display:flex;align-items:center;justify-content:center;transition:all .22s}
.lv-roll:hover{background:var(--cinnabar);color:#F6E8E2;border-color:var(--cinnabar)}
.rit-hintbar{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bond-random{flex:none;background:none;border:none;font-family:var(--font-serif);font-size:12.5px;letter-spacing:.16em;color:var(--gilt-dim);border-bottom:1px solid rgba(138,112,64,.55);padding:2px 3px;cursor:pointer;transition:color .22s,border-color .22s}
.bond-random:hover:not(:disabled){color:var(--cinnabar);border-color:var(--cinnabar)}
.bond-random:disabled{opacity:.35;cursor:default}
.rel-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed rgba(120,96,56,.28)}
.rel-row b{flex:none;width:74px;font-size:13.5px;letter-spacing:.04em}
.rel-row select{flex:1;background:rgba(255,253,246,.5);border:1px solid rgba(120,96,56,.45);border-radius:3px;padding:6px 8px;font-family:var(--font-serif);font-size:13px;color:var(--ink);outline:none}
.rel-row select:focus{border-color:var(--cinnabar)}
@media (max-width:760px){.rit-form{grid-template-columns:1fr}.rit-form label.wide{grid-column:1}.rel-row{flex-wrap:wrap}.rel-row select{min-width:46%}}
/* —— 仪典 v2 增补控件（满血移植自欢迎页面交互） —— */
.rit-form input,.rit-form textarea{background:rgba(255,253,246,.35);border:1px solid rgba(120,96,56,.45);border-radius:3px;padding:7px 10px;font-family:var(--font-serif);font-size:14px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical}
.rit-form textarea:focus{border-color:var(--cinnabar);box-shadow:0 0 0 2px rgba(150,55,46,.12)}
.rit-form.cwrap{margin:-4px 0 10px;background:rgba(246,242,231,.34);border:1px dashed rgba(120,96,56,.42);border-radius:4px;padding:9px 12px 10px}
.rr-banner{margin:2px 0 10px;padding:9px 14px;border:1px solid rgba(169,138,70,.55);border-left:3px solid var(--gilt-dim);border-radius:3px;background:rgba(251,247,235,.55);color:var(--ink-soft);font-size:13px;letter-spacing:.06em;line-height:1.8}
.rchip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.rchip-row.sub{margin-top:-2px;margin-left:10px}
/* 仪典选项芯片：压印铜牌 —— 上沿高光 + 内阴影做出厚度，取代扁平药丸 */
.rchip{padding:4px 12px;border:1px solid rgba(120,88,40,.44);border-radius:13px;
  background:linear-gradient(180deg,rgba(255,252,242,.72),rgba(233,226,208,.58) 58%,rgba(222,213,190,.5));
  font-family:var(--font-serif);font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 4px rgba(120,96,56,.16),0 1px 2px rgba(96,66,28,.12);
  transition:transform .2s var(--ease-out),box-shadow .2s,border-color .2s,color .2s}
.rchip:hover{border-color:var(--gilt);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 4px rgba(120,96,56,.14),0 3px 6px rgba(96,66,28,.18)}
/* 选中：压下感（内阴影翻到上方）+ 朱砂印泥色 */
.rchip.on{background:linear-gradient(180deg,rgba(150,55,46,.16),rgba(150,55,46,.09));
  border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700;letter-spacing:.06em;
  box-shadow:inset 0 2px 5px rgba(120,40,32,.3),inset 0 -1px 0 rgba(255,235,225,.5),0 1px 2px rgba(96,66,28,.14)}
.rchip-lab{flex:none;font-size:11.5px;color:var(--ink-faint);letter-spacing:.16em}
.rchip-hint{font-size:11px;color:var(--ink-faint);letter-spacing:.1em}
.rchip-clear{margin-left:auto;color:var(--gilt-dim)}
.rchip:disabled{opacity:.4;pointer-events:none}
.rchip-row.prof-row{margin-top:16px;gap:8px}
.rchip-row.prof-row .rst{margin-left:auto;color:var(--cinnabar)}
.sum-dim{font-size:.82em;color:var(--ink-faint)}
/* 种族手风琴 */
.race-acc{display:flex;flex-direction:column;gap:4px;margin:2px 0 8px}
.race-cat{display:flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid rgba(120,88,40,.38);border-radius:3px;background:rgba(246,242,231,.45);font-size:12.5px;letter-spacing:.12em;color:var(--ink-soft);transition:all .2s;text-align:left}
.race-cat:hover{border-color:var(--gilt)}
.race-cat.has{border-color:var(--cinnabar);color:var(--cinnabar)}
.race-cat.open::after{content:'▾';margin-left:auto;color:var(--gilt-dim)}
.race-cat:not(.open)::after{content:'▸';margin-left:auto;color:var(--gilt-dim)}
.race-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px;padding:6px 10px;border:1px dashed rgba(120,96,56,.32);border-top:none;border-radius:0 0 3px 3px;background:rgba(251,247,235,.4)}
.race-items:empty,.race-cat:not(.open)+.race-items{display:none}
.race-item{padding:4px 8px;border:1px solid rgba(120,88,40,.35);border-radius:3px;background:rgba(246,242,231,.5);font-size:12px;color:var(--ink-soft);text-align:center;letter-spacing:.06em;transition:all .18s}
.race-item:hover{border-color:var(--gilt);box-shadow:0 5px 12px rgba(96,66,28,.2),inset 0 1px 0 rgba(255,255,255,.7)}
.race-item.sel{background:rgba(150,55,46,.12);border-color:var(--cinnabar);color:var(--cinnabar);font-weight:600}
.race-fam{grid-column:1/-1;font-size:10.5px;letter-spacing:.14em;color:var(--gilt-dim);border-bottom:1px solid rgba(120,96,56,.22);padding:3px 2px 2px;margin-top:2px}
.dex-enlink{color:var(--lapis);text-decoration:none;border-bottom:1px dashed rgba(67,97,122,.5)}
.dex-enlink:hover{color:var(--gilt)}
/* 羁绊名册 */
.bnd-item{margin-bottom:10px;border:1px solid rgba(120,88,40,.4);border-radius:4px;background:linear-gradient(172deg,rgba(246,242,231,.72),rgba(239,234,221,.48));transition:border-color .22s,box-shadow .22s}
.bnd-item.active{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar),0 8px 18px rgba(150,55,46,.14)}
.bnd-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:9px 13px;cursor:pointer}
.bnd-hd:hover{background:rgba(201,174,109,.08)}
.bnd-nm{font-weight:700;font-size:14.5px;letter-spacing:.06em;color:var(--ink)}
.bnd-rc{font-size:11.5px;color:var(--gilt-dim);border:1px solid rgba(138,112,64,.55);border-radius:9px;padding:1px 7px;letter-spacing:.08em}
.bnd-rc.is-custom{color:var(--cinnabar);border-color:rgba(150,55,46,.6)}
.bnd-rel{font-size:11px;color:var(--cinnabar);border:1px solid rgba(150,55,46,.45);border-radius:9px;padding:1px 7px;background:rgba(150,55,46,.1)}
.bnd-del{margin-left:auto;background:none;border:none;font-family:var(--font-serif);font-size:11.5px;color:var(--cinnabar);letter-spacing:.1em;cursor:pointer;padding:2px 4px}
.bnd-del:hover{text-decoration:underline}
.bnd-desc{padding:0 13px 7px;font-size:12px;line-height:1.75;color:var(--ink-soft)}
.bnd-desc b{color:var(--lapis)}
.bnd-item .rchip-row{padding:0 11px}
.chip-x{background:none;border:none;font-size:12px;color:var(--cinnabar);cursor:pointer;margin-left:4px;padding:0 2px}
.rit-enter-mini{border-color:rgba(150,55,46,.6);color:var(--cinnabar);font-weight:600}
@media (max-width:760px){
  .rit-grid,.rit-grid.cols-3,.rit-grid.cols-4{grid-template-columns:repeat(2,1fr)}
  .rit-grid.cols-2{grid-template-columns:1fr}
  .rit-body{padding:12px 16px 16px}
  .rc-step span{font-size:0}
  .rc-step em{font-size:11px}
  .rit-opt.bond{padding-right:78px}
}
/* ══════════ 卷册删改（删楼层 + 重生成，合并一册） ══════════ */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.sc-grid{grid-template-columns:1fr}}
.sc-card{border:1px solid rgba(120,96,56,.36);border-radius:5px;padding:13px 15px;
  background:linear-gradient(172deg,rgba(250,246,236,.86),rgba(238,232,216,.7));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(96,66,28,.1)}
.sc-lab{font-family:var(--font-sans);font-size:11.5px;letter-spacing:.2em;color:var(--gilt-dim);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.sc-lab em{font-style:normal;font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}
.sc-in{display:flex;align-items:stretch;gap:7px;margin-bottom:8px}
.sc-in input{flex:1;min-width:0;background:rgba(255,253,246,.66);border:1px solid rgba(120,96,56,.45);border-radius:3px;
  padding:8px 11px;font-family:var(--font-sans);font-size:15px;color:var(--ink);outline:none}
.sc-in input:focus{border-color:var(--cinnabar)}
.sc-go{flex:none;padding:0 18px;border:1px solid rgba(150,55,46,.6);border-radius:3px;
  background:linear-gradient(180deg,rgba(150,55,46,.14),rgba(150,55,46,.08));color:var(--cinnabar);
  font-family:var(--font-serif);font-size:13px;font-weight:700;letter-spacing:.14em;transition:box-shadow .2s,background .2s}
.sc-go:hover:not(:disabled){background:rgba(150,55,46,.2);box-shadow:0 4px 10px rgba(150,55,46,.2)}
.sc-go:disabled{opacity:.42;cursor:not-allowed}
.sc-hint{font-family:var(--font-sans);font-size:10.5px;line-height:1.8;color:var(--ink-faint);letter-spacing:.04em}
.sc-cur{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 12px;margin-bottom:9px;
  border:1px solid rgba(120,96,56,.34);border-radius:4px;background:rgba(251,247,235,.45);
  font-family:var(--font-sans);font-size:12px;color:var(--ink-soft)}
.sc-cur b{font-family:var(--font-serif);font-size:14px;color:var(--ink)}
.sc-cur .sc-pill{padding:2px 9px;border:1px solid rgba(120,96,56,.5);border-radius:10px;font-size:10.5px;color:var(--gilt-dim)}
.sc-chapters{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto}
.sc-ch{border:1px solid rgba(120,96,56,.4);border-radius:3px;background:rgba(246,242,231,.55);
  padding:5px 11px;font-family:var(--font-serif);font-size:12.5px;color:var(--ink-soft);transition:box-shadow .2s,border-color .2s,color .2s}
.sc-ch:hover{border-color:var(--gilt);color:var(--ink);box-shadow:0 4px 10px rgba(96,66,28,.18)}
.sc-ch.on{border-color:var(--cinnabar);color:var(--cinnabar);font-weight:700;background:rgba(150,55,46,.12)}
.sc-ch.on.busy{opacity:.55;pointer-events:none}
@media (hover:none){.sc-go{min-height:44px;padding:0 20px}.sc-in input{font-size:16px}.sc-ch{min-height:40px;padding:8px 14px}}
</style>
</body>
</html>
