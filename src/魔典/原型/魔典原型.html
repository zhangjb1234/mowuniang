<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔典 · 烛光抄本原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="preload" as="style" onload="this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ============ 烛光抄本 · 设计令牌 ============ */
:root{
  --desk-0:#171310;--desk-1:#211a15;
  --vellum:#EAE0C7;--vellum-hi:#F6F0DE;--vellum-aged:#DCCFAF;
  --ink:#2C221A;--ink-soft:#4E4032;--ink-faint:#6E5E4C;
  --cinnabar:#96372E;--cinnabar-deep:#6D231C;--cinnabar-hi:#B04A3E;
  --gilt:#A98A46;--gilt-hi:#C9AE6D;--gilt-dim:#8A7040;
  --lapis:#2F4A5E;--lapis-hi:#43617A;
  --moss:#5B6B4C;--moss-deep:#46543B;
  --leather-0:#4A2E22;--leather-1:#3A231A;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-spring:cubic-bezier(.34,1.4,.64,1);
  --dur:420ms;
  --font-serif:'Noto Serif SC',serif;--font-sans:'Noto Sans SC',sans-serif;--font-latin:'Cormorant Garamond',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html,body{height:100%}
body{
  font-family:var(--font-serif);color:var(--ink);overflow:hidden;
  background:
    radial-gradient(130% 70% at 50% -6%,rgba(224,158,74,.14),transparent 52%),
    radial-gradient(150% 120% at 50% 50%,rgba(23,19,16,.72) 0%,rgba(18,15,12,.88) 68%,rgba(10,8,6,.94) 100%),
    url('../素材候选/wood-wooden-texture-jpg.jpg') center/512px repeat;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 116%,rgba(0,0,0,.5),transparent 55%)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(150,55,46,.28)}

/* 器物文字统一黑体（文学文字一律宋体） */
.folio-head,.folio-foot,.chip,.cs-tag,.sp-fields dt,.m-label,.empty-note,
.rit-hint,.rit-form label,.rel-row b,.rel-row select,.rit-sum-row span,.rit-pool,.rc-step,
.bond-tag,.ms-cap,.dc-bond,.choice-slip,.news-clip .nc-head,.duel-banner .db-head,
.init-badge,.insert-head .ih-latin,.ih-close,.ra-btn,.dc-intro,.ra-name i{font-family:var(--font-sans)}

/* ============ 书页舞台 ============ */

/* ============ 书页舞台 ============ */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2400px}
.tome{position:relative;width:min(760px,94vw);height:min(92vh,980px);transform-style:preserve-3d}
.page{
  position:absolute;inset:0;border-radius:6px 14px 14px 6px;overflow:hidden;
  background:
    /* 岁月斑：两抹极淡的水渍，落在内容层之下（保持图三浅色旧纸调） */
    radial-gradient(24% 20% at 15% 84%,rgba(126,94,46,.1),transparent 72%),
    radial-gradient(18% 14% at 85% 19%,rgba(116,84,42,.08),transparent 72%),
    radial-gradient(115% 88% at 74% 7%,rgba(255,250,238,.52),transparent 52%),
    linear-gradient(rgba(240,231,208,.42), rgba(232,219,188,.52)),
    url('../素材候选/parchment-pergament-1-jpg.jpg') center/cover, var(--vellum);
  box-shadow:0 30px 70px rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.45),inset 0 0 90px rgba(120,88,40,.15);
  display:flex;flex-direction:column;
  transform-origin:left center;backface-visibility:hidden;
}
/* 浅烧边：四周的淡褐陈痕，不压字 */
.page::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  box-shadow:inset 0 0 0 1px rgba(120,96,56,.32),inset 10px 0 22px rgba(96,76,40,.12),inset -30px 0 64px rgba(120,90,44,.19),inset 0 -34px 64px rgba(120,90,44,.15),inset 0 30px 56px rgba(122,92,46,.08);
  border-radius:inherit}
.page.leaving{transition:transform .62s cubic-bezier(.45,.05,.3,1);z-index:6}
.page.leaving.fwd{transform:rotateY(-168deg)}
.page.leaving.back{transform-origin:right center;transform:rotateY(168deg)}
.page.enter-r{animation:enterR .56s var(--ease-out)}
@keyframes enterR{from{opacity:0;transform:translateX(72px) rotateY(10deg)}to{opacity:1;transform:none}}
.page.enter-l{animation:enterL .56s var(--ease-out)}
@keyframes enterL{from{opacity:0;transform:translateX(-72px) rotateY(-10deg)}to{opacity:1;transform:none}}

/* 第零页 · 命运尚未落笔 */
.await-wrap{max-width:520px;margin:60px auto 40px;text-align:center}
.await-candle{width:34px;height:34px;margin:0 auto 14px;color:var(--gilt)}
.await-title{font-size:23px;font-weight:700;letter-spacing:.22em;color:var(--ink);margin-bottom:16px}
.await-text{font-size:15.5px;line-height:2.15;color:var(--ink-soft);text-align:justify;letter-spacing:.03em;margin:0 6px 18px}
.await-hint{font-family:var(--font-sans);font-size:11px;line-height:2;letter-spacing:.14em;color:var(--gilt-dim)}
.page.entering{animation:pageIn .5s var(--ease-out)}
@keyframes pageIn{from{opacity:.35;transform:translateX(10px)}to{opacity:1;transform:none}}

/* 天头 / 地脚 */
.folio-head,.folio-foot{position:relative;z-index:2;flex:none;display:flex;align-items:baseline;justify-content:space-between;padding:14px 30px 10px;color:var(--ink-faint);font-size:12px;letter-spacing:.16em}
/* 天头：时间/地点是每页的处境锚点，须与正文同色系才读得出来。
   原为 --ink-faint + 12px，在羊皮纸(--vellum)底上对比过弱，看着像脚注。
   提到 --ink/14px/500 字重，字距收至 .1em（字号变大后 .16em 会显松垮）。 */
.folio-head{border-bottom:1px solid rgba(120,88,40,.34);color:var(--ink);font-size:14px;font-weight:500;letter-spacing:.1em}
/* 右列「时段·月相·天气」由 gilt-dim 提到 gilt：仍是暖金，但不再读不出来 */
.folio-head .wh-latin{font-family:var(--font-latin);letter-spacing:.3em;font-size:12px;color:var(--gilt)}
/* 窄屏回落：14px 的天头 + 宽字距在手机屏上会把右列挤出可视区 */
@media (max-width:560px){
  .folio-head{font-size:13px;letter-spacing:.06em;padding:12px 18px 9px}
  .folio-head .wh-latin{letter-spacing:.18em;font-size:11px}
}
.folio-foot{border-top:1px solid rgba(120,88,40,.22);padding:10px 30px 14px;font-size:11.5px}
.folio-foot .ff-scribe{color:var(--gilt-dim);font-style:normal;letter-spacing:.08em}
.folio-foot .ff-side{display:flex;align-items:baseline;gap:12px}
.ff-latest{background:none;border:none;font-family:var(--font-serif);font-size:11px;letter-spacing:.14em;color:var(--gilt-dim);border-bottom:1px solid rgba(138,112,64,.55);padding:0 1px 1px;cursor:pointer;transition:color .25s,border-color .25s}
.ff-latest:hover{color:var(--cinnabar);border-color:var(--cinnabar)}
/* 页脚翻页键：取代旧书缘耳签，读完全页正好伸手可翻 */
.ff-page{flex:1;text-align:center}
.ff-nav{flex:none;background:none;border:none;font-family:var(--font-serif);font-size:11.5px;letter-spacing:.16em;color:var(--gilt-dim);padding:0 1px 2px;cursor:pointer;position:relative;transition:color .25s}
.ff-nav::after{content:'';position:absolute;left:1px;right:1px;bottom:0;height:1px;background:var(--cinnabar);transform:scaleX(0);transition:transform .3s var(--ease-out)}
.ff-nav:hover:not(:disabled){color:var(--cinnabar)}
.ff-nav:hover:not(:disabled)::after{transform:scaleX(1)}
.ff-nav:disabled{opacity:0;pointer-events:none}

/* 正文卷轴区（滚动可用，滑轮隐身） */
.scroll{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;padding:22px 34px 26px;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent}


/* 章节牌 */
.chapter-tag{display:flex;align-items:center;gap:14px;margin:6px 0 18px;color:var(--lapis)}
.chapter-tag h2{font-size:19px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.chapter-tag .ct-rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(47,74,94,.55),transparent)}
.chapter-tag .ct-latin{font-family:var(--font-latin);font-size:11px;letter-spacing:.26em;color:var(--lapis-hi);text-transform:uppercase;white-space:nowrap}

/* 正文排版 */
.prose p{font-size:17px;line-height:2;text-align:justify;letter-spacing:.015em;color:var(--ink);margin:0 0 .35em;text-indent:2em}
.prose p.no-indent{text-indent:0}
/* （已按反馈移除首字下沉/放大：正文段落与扉页一律常规字号起笔） */
.dlg{color:#7C2F28;font-weight:600}
/* 单星号强调 *…*：AI 正文里的星号是强调记号，不是正文。
   与 .dlg（对白·朱红）分色：强调走青蓝（--lapis），一眼分得开谁是对白、谁是着重。 */
.prose .em{color:var(--lapis);font-weight:500;border-bottom:1px solid rgba(47,74,94,.28)}


/* 心语便签（去斜体：正文一律正立，斜体只留给批注性文字） */
.mind-slip{max-width:88%;margin:16px auto 16px 6%;transform:none;background:linear-gradient(172deg,rgba(246,242,231,.85),rgba(239,234,221,.72));border-left:3px solid var(--cinnabar);padding:9px 14px 9px 13px;color:#6D3730;font-style:normal;font-size:14.5px;line-height:1.85;box-shadow:0 4px 14px rgba(96,66,28,.16);border-radius:2px 6px 6px 2px;position:relative}
.mind-slip::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--vellum-aged) transparent transparent;opacity:.85}
.mind-slip .ms-sigil{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px}
/* 预设留言笺 */
.preset-note{max-width:88%;margin:16px auto 16px 6%;background:linear-gradient(172deg,rgba(243,238,224,.8),rgba(236,228,206,.68));border-left:3px solid var(--lapis);padding:8px 13px 8px 12px;color:var(--ink-soft);font-size:13.5px;line-height:1.8;box-shadow:0 4px 14px rgba(96,66,28,.14);border-radius:2px 6px 6px 2px;position:relative}
.preset-note .pn-label{display:block;font-family:var(--font-latin);font-size:9px;letter-spacing:.3em;color:var(--lapis-hi);margin-bottom:3px}

/* ── 预设留言笺（移植自租借男友「猫爪笺 / 小此笺」，改绘为魔典羊皮纸＋雕版画描金） ──
   猫神留言（Reborn 小猫之神）：<details><summary>…留言…</summary>…</details>
   小此留言（Izumi 泉此方）：<tucao> 吐槽/创作思路/小此对话、<konatan_chat> 情感陪伴
   两者都是「读标签」，魔典只解析不生成。 */
.note-slip{position:relative;max-width:88%;margin:18px auto 18px 6%;padding:11px 15px 12px 14px;border-radius:2px 7px 7px 2px;box-shadow:0 6px 18px rgba(96,66,28,.17);overflow:hidden}
.note-slip::before{content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:repeating-linear-gradient(135deg,rgba(150,120,70,.05) 0 2px,transparent 2px 5px)}
/* 猫爪笺：朱印色边（左缘），猫神系 */
.note-slip.cat{background:linear-gradient(172deg,rgba(246,240,228,.92),rgba(236,226,208,.8));border-left:3px solid var(--cinnabar)}
.note-slip.cat::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 15px 15px 0;border-color:transparent var(--vellum-aged) transparent transparent;opacity:.85}
/* 小此笺：青金石色边（左缘），小此系 */
.note-slip.konata{background:linear-gradient(172deg,rgba(240,243,242,.92),rgba(228,233,234,.8));border-left:3px solid var(--lapis)}
.note-slip.konata::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 15px 15px 0;border-color:transparent rgba(206,214,212,.9) transparent transparent;opacity:.85}
/* 笺头：头像 + 标题 + 印记 */
.note-slip .ns-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;position:relative;z-index:1}
.note-slip .ns-avatar{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;border:1px solid rgba(96,66,28,.45);box-shadow:0 2px 6px rgba(96,66,28,.22);background:var(--vellum)}
.note-slip .ns-avatar.paw{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(168deg,#B04A3E,#8E3229);color:#F6EFE2;border:none;box-shadow:0 2px 6px rgba(96,26,19,.3)}
.note-slip .ns-avatar.paw svg{width:17px;height:17px}
.note-slip .ns-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.note-slip .ns-cn{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
.note-slip .ns-latin{font-family:var(--font-latin);font-size:8.5px;letter-spacing:.26em;color:var(--lapis-hi);text-transform:uppercase}
/* 笺头右侧印记：猫=「喵」，小此=「此」 */
.note-slip .ns-seal{flex:none;margin-left:auto;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1px solid rgba(96,66,28,.4);transform:rotate(-8deg)}
.note-slip.cat .ns-seal{background:var(--cinnabar);color:#F6EFE2;border-color:rgba(120,40,32,.6)}
.note-slip.konata .ns-seal{background:var(--gilt);color:#4A3616;border-color:rgba(138,112,64,.6);transform:rotate(8deg)}
/* 笺身 */
.note-slip .ns-body{position:relative;z-index:1;font-size:13.5px;line-height:1.85;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
/* 笺内分段（同一锚点上的多条吐槽） */
.note-slip .ns-seg{margin-top:9px;padding-top:8px;border-top:1px dashed rgba(120,98,66,.34)}
.note-slip .ns-seg:first-child{margin-top:0;padding-top:0;border-top:none}
.note-slip .ns-seg-tag{display:inline-block;margin:0 0 4px;padding:1px 7px;font-size:9.5px;letter-spacing:.16em;border-radius:9px;border:1px solid rgba(120,98,66,.4);color:var(--gilt-dim);background:rgba(169,138,70,.1)}
/* 窄屏：贴齐版心 */
@media (max-width:760px){.note-slip{max-width:96%;margin-left:2%}}

/* 大陆见闻·旅志剪页 */
.news-clip{margin:18px 4%;background:linear-gradient(180deg,rgba(246,242,231,.7),rgba(239,234,221,.5));border:1px solid rgba(47,74,94,.34);border-radius:3px;overflow:hidden;box-shadow:0 6px 18px rgba(96,66,28,.14)}
.news-clip .nc-head{background:var(--lapis);color:#E8E2D2;padding:6px 12px;font-size:12.5px;letter-spacing:.3em;display:flex;align-items:center;gap:8px}
.news-clip .nc-head svg{width:15px;height:15px;flex:none}
.news-clip .nc-body{padding:10px 14px;font-size:14.5px;line-height:1.9;color:var(--ink-soft)}

/* 战况·血墨战报 */
.duel-banner{margin:16px 4%;border:1px solid rgba(150,55,46,.5);border-radius:3px;background:linear-gradient(94deg,rgba(150,55,46,.10),rgba(150,55,46,.05));overflow:hidden}
.duel-banner .db-head{display:flex;align-items:center;gap:9px;padding:6px 12px;background:linear-gradient(94deg,rgba(150,55,46,.86),rgba(109,35,28,.86));color:#F0E4DC;font-size:12.5px;letter-spacing:.28em}
.duel-banner .db-head svg{width:15px;height:15px;flex:none}
.duel-banner .db-body{padding:9px 14px;font-size:14.5px;line-height:1.85;color:#5D2620}

/* 封面期间藏起书签、页缘与空书页；仪典/扉页期间只藏书页 */
.tome.cover-on .thumb-tabs,.tome.cover-on .thumb-tabs-left{display:none}
/* 常驻全屏钮：羊皮纸小圆牌 + 纯 CSS 四角落号（无 SVG）；全屏态落号旋转收成菱形表示「还原」 */
.fs-toggle{position:absolute;right:12px;bottom:78px;z-index:10;width:38px;height:38px;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  border:1px solid rgba(140,112,64,.6);
  background:radial-gradient(circle at 33% 26%,#F8F2E2 0%,#E8DCC0 52%,#D4C29C 100%);
  box-shadow:0 2px 8px rgba(41,30,16,.3),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -3px 5px rgba(120,96,56,.28);
  cursor:pointer;transition:transform .25s var(--ease-spring),box-shadow .25s,border-color .25s}
.fs-toggle:hover{transform:translateY(-1px);border-color:var(--cinnabar);
  box-shadow:0 6px 15px rgba(41,30,16,.34),inset 0 1px 0 rgba(255,255,255,.88)}
.fs-toggle:active{transform:translateY(0)}
.fs-icon{position:relative;width:15px;height:15px;transition:transform .32s var(--ease-spring)}
.fs-icon i{position:absolute;width:5px;height:5px;border:0 solid var(--ink-soft)}
.fs-icon i:nth-child(1){top:0;left:0;border-top-width:1.6px;border-left-width:1.6px}
.fs-icon i:nth-child(2){top:0;right:0;border-top-width:1.6px;border-right-width:1.6px}
.fs-icon i:nth-child(3){bottom:0;left:0;border-bottom-width:1.6px;border-left-width:1.6px}
.fs-icon i:nth-child(4){bottom:0;right:0;border-bottom-width:1.6px;border-right-width:1.6px}
.fs-t-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* 伪全屏态：全屏钮固定到右上角。
   ⚠ z-index 必须低于浮层面板（.toc=12/.letter=11/.insert=9 体系之上另起一层），
   否则 z-index:2147483002 会把目录头部的 ✕ 与插页的 ✕ 整个盖住——
   用户看到的正是「点开目录后找不到关闭按钮」。取 3002 仍远高于书页(2)与插页(9)。 */
body.modian-fs-on .fs-toggle{position:fixed;right:14px;bottom:auto;top:12px;z-index:3002;border-color:rgba(150,55,46,.6)}
body.modian-fs-on .fs-icon{transform:rotate(45deg) scale(.75)}
body.modian-fs-on .fs-icon i{border-color:var(--cinnabar)}
@media (hover:none){.fs-toggle{width:42px;height:42px}.fs-icon{width:16px;height:16px}}
/* 伪全屏态·画面放大（书卷变大+字体等比；尺寸按 zoom 预除，绝不冲出视口——参考幻璃镜/租借男友 UI 进视口感） */
body.modian-fs-on #stage{zoom:1.2}
body.modian-fs-on .tome{width:min(980px,78vw);height:min(calc(100dvh / 1.2),1000px)}
@media (max-width:760px){
  body.modian-fs-on #stage{zoom:1}
  body.modian-fs-on .tome{width:100%;height:100dvh}
}
/* 浮层面板统一压过常驻全屏钮（3002）。
   此前 .toc=12 / .letter=11 / .insert=9 全部低于全屏钮的 z-index，
   伪全屏时右上角的 ✕ 被全屏钮物理遮住 —— 用户「点开目录找不到关闭按钮」的根因。
   这里给三个面板 3003~3005，独立层级，彼此次序为 toc > letter > insert。 */
.letter{position:absolute;left:0;top:0;z-index:3004;width:min(560px,92vw);opacity:0;visibility:hidden;transform:translateY(10px);
  /* 高度封顶：全屏时 #stage 会被 zoom 放大，信笺若不封顶会顶出视口被裁；此处按局部坐标封顶，
     内部 .letter-paper 自行内滚（见下方 max-height/overflow） */
  max-height:calc(100% - 20px);
  transition:opacity .34s var(--ease-out),transform .4s var(--ease-out),visibility 0s .4s}
.letter.open{opacity:1;visibility:visible;transform:none;transition:opacity .3s var(--ease-out),transform .42s var(--ease-out)}
.letter-paper{position:relative;border-radius:8px;padding:15px 22px 14px;max-height:100%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent;
  background:
    repeating-linear-gradient(180deg,transparent 0 30px,rgba(120,96,56,.14) 30px 31px),
    linear-gradient(rgba(244,238,223,.9),rgba(240,232,210,.92)),
    url('../素材候选/parchment-pergament-1-jpg.jpg') center/cover, var(--vellum);
  box-shadow:0 -14px 42px rgba(0,0,0,.45),inset 0 0 40px rgba(120,88,40,.1);border:1px solid rgba(120,96,56,.42)}
.let-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.let-sign{font-family:var(--font-sans);font-size:11px;letter-spacing:.32em;color:var(--gilt-dim)}
.let-close{width:26px;height:26px;border-radius:50%;border:1px solid rgba(120,96,56,.4);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:all .22s}
.let-close svg{width:12px;height:12px}
.let-close:hover{background:var(--cinnabar);color:#F6E8E2;border-color:var(--cinnabar)}
.let-to{display:block;font-size:13px;color:var(--ink-faint);letter-spacing:.08em;margin-bottom:8px}
.let-to b{font-weight:700;color:var(--ink)}
#modian-letter-body{display:block;width:100%;min-height:122px;background:transparent;border:none;outline:none;resize:none;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent;
  font-family:var(--font-serif);font-size:16px;line-height:31px;color:var(--ink);caret-color:var(--cinnabar)}

#modian-letter-body::placeholder{color:#A89980;font-style:normal;font-size:14px;line-height:31px}
.let-foot{display:flex;align-items:center;gap:10px;padding-top:9px;border-top:1px dashed rgba(120,96,56,.32)}
.let-count{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint)}
.let-erase{margin-left:auto;padding:5px 13px;background:none;border:none;font-family:var(--font-serif);font-size:12.5px;letter-spacing:.16em;color:var(--ink-faint);border-bottom:1px solid transparent;transition:all .22s}
.let-erase:hover{color:var(--cinnabar);border-bottom-color:var(--cinnabar)}
.let-send{display:flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid rgba(109,35,28,.65);border-radius:26px;
  background:linear-gradient(165deg,#6D2A22,#4E1E18);color:#F0DFAE;font-family:var(--font-serif);font-size:14px;font-weight:700;letter-spacing:.24em;
  box-shadow:0 8px 20px rgba(78,30,24,.38);transition:transform .26s var(--ease-spring),box-shadow .26s}
.let-send svg{width:20px;height:20px;flex:none}
.let-send:hover{box-shadow:0 12px 26px rgba(78,30,24,.48),inset 0 1px 0 rgba(255,235,190,.26);color:#FFF0CC}
.let-send:active{transform:translateY(1px)}
.let-send:disabled{opacity:.6;transform:none;cursor:default}
/* 触屏：回车只换行，发送只能靠这个按钮 → 必须够大够好按（44px 最小命中区） */
@media (hover:none){
  .let-send{min-height:48px;padding:10px 24px}
  .let-send svg{width:24px;height:24px}
  .let-foot{gap:12px}
}
.letter.sending .letter-paper::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--cinnabar),transparent);animation:letInk 1.3s ease-in-out infinite}
@keyframes letInk{0%{transform:translateX(-70%);opacity:.2}50%{opacity:.9}100%{transform:translateX(70%);opacity:.2}}
@media (max-width:760px){
  .letter{width:min(94vw,560px)}
  .letter-paper{border-radius:12px;padding:12px 16px 12px;max-height:62dvh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent}
  
}

/* ============ 卷轴 · 层目（目录） ============
   形制同信笺：机皮书脊屉从右缘抽出；条目=页序+场景题，点击直跳（幻璃镜 FloorSelector 同款语义） */
.toc{position:absolute;right:0;top:0;bottom:0;z-index:3005;width:min(320px,88vw);
  display:flex;transform:translateX(106%);visibility:hidden;
  transition:transform .46s var(--ease-out),visibility 0s .5s}
.toc.open{transform:none;visibility:visible;transition:transform .46s var(--ease-out)}
.toc-paper{position:relative;flex:1;margin:9px 0;display:flex;flex-direction:column;overflow:hidden;
  border-radius:10px 0 0 10px;border:1px solid rgba(120,96,56,.42);border-right:none;
  background:
    radial-gradient(24% 20% at 15% 84%,rgba(126,94,46,.1),transparent 72%),
    linear-gradient(rgba(244,238,223,.9),rgba(240,232,210,.92)),
    url('../素材候选/parchment-pergament-1-jpg.jpg') center/cover, var(--vellum);
  box-shadow:-16px 14px 38px rgba(0,0,0,.45),inset 0 0 40px rgba(120,88,40,.1)}
.toc-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px;border-bottom:1px solid rgba(120,88,40,.3)}
.toc-sign{font-family:var(--font-sans);font-size:11px;letter-spacing:.32em;color:var(--gilt-dim)}
/* 关闭钮放大到 34px 并加淡红底 —— 原 26px 无底色的圆圈在羊皮纸上极不显眼，
   是用户「找不到关闭按钮」观感的一半原因。 */
.toc-close{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid rgba(150,55,46,.5);
  background:rgba(150,55,46,.10);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .22s}
.toc-close svg{width:15px;height:15px}
.toc-close:hover{background:var(--cinnabar);color:#F6E8E2;border-color:var(--cinnabar);transform:rotate(90deg)}
/* 目录外的可点遮罩：点空白处即合上（比只靠 ✕ 与 Esc 更好找） */
.toc-veil{position:absolute;inset:0;z-index:3004;background:rgba(20,14,9,.42);opacity:0;visibility:hidden;
  transition:opacity .4s var(--ease-out),visibility 0s .4s}
.toc-veil.on{opacity:1;visibility:visible;transition:opacity .4s var(--ease-out)}
@media (hover:none){ .toc-close:active{background:var(--cinnabar);color:#F6E8E2} }
.toc-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent;display:flex;flex-direction:column;gap:6px;padding:9px 12px 14px}

.toc-item{display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:4px;
  border:1px solid rgba(120,88,40,.28);background:rgba(251,247,235,.4);text-align:left;color:var(--ink);
  transition:transform .24s var(--ease-out),border-color .24s,background .24s}
.toc-item:hover{border-color:var(--cinnabar);transform:translateX(-3px)}
.toc-item.on{border-color:rgba(150,55,46,.6);background:rgba(150,55,46,.12)}
.toc-item.on .ti-num{color:var(--cinnabar);font-weight:700}
.ti-num{flex:none;width:46px;font-family:var(--font-sans);font-size:10.5px;letter-spacing:.08em;color:var(--gilt-dim)}
.ti-title{flex:1;min-width:0;font-family:var(--font-serif);font-size:13px;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-item.follow{justify-content:center;border-style:dashed;color:var(--gilt-dim);letter-spacing:.14em;font-size:12px;font-family:var(--font-sans)}
.toc-item.follow:hover{color:var(--cinnabar)}
.toc-empty{padding:22px 10px;text-align:center;color:var(--ink-faint);font-size:12.5px;letter-spacing:.1em}
@media (max-width:760px){.toc{width:100%}.toc-paper{margin:0;border-radius:0;border-left:none}}

/* 仪典 footer 步进：裸字 + 金线 */
.rit-foot .rf-step{display:flex;align-items:center;gap:7px;background:none;border:none;padding:6px 4px;font-family:var(--font-serif);font-size:13.5px;letter-spacing:.22em;color:var(--ink-soft);position:relative;transition:color .25s}
.rit-foot .rf-step svg{width:13px;height:13px;transition:transform .3s var(--ease-out)}
.rit-foot .rf-step::after{content:'';position:absolute;left:2px;right:2px;bottom:0;height:1px;background:var(--cinnabar);transform:scaleX(0);transition:transform .32s var(--ease-out)}
.rit-foot .rf-step:hover:not(:disabled){color:var(--cinnabar)}
.rit-foot .rf-step:hover:not(:disabled)::after{transform:scaleX(1)}
.rit-foot .rf-step.next:hover:not(:disabled) svg{transform:translateX(3px)}
.rit-foot .rf-step.prev:hover:not(:disabled) svg{transform:translateX(-3px)}
.rit-foot .rf-step:disabled{opacity:.26;pointer-events:none}
.p-desc:empty{display:none}

/* 标本插页·功能卡 */
.specimen{margin:20px 3%;background:linear-gradient(rgba(243,236,219,.40),rgba(238,229,204,.48)),url('../素材候选/parchment-parchment-00-jpg.jpg') center/cover, var(--vellum-aged);border-radius:4px;box-shadow:0 10px 26px rgba(66,44,18,.2),inset 0 0 34px rgba(120,96,56,.10);position:relative;padding:16px 18px 15px;border:1px solid rgba(120,96,56,.32)}
.specimen::before{content:'';position:absolute;inset:6px;border:1px solid rgba(120,88,40,.4);border-radius:2px;pointer-events:none}
.specimen .sp-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;padding-right:44px}
.specimen .sp-emblem{flex:none;width:30px;height:30px;color:var(--sp-accent,var(--lapis))}
.specimen .sp-title{font-weight:700;font-size:15.5px;letter-spacing:.12em;color:var(--sp-accent,var(--lapis))}
.specimen .sp-latin{font-family:var(--font-latin);font-size:10px;letter-spacing:.26em;color:var(--ink-faint);text-transform:uppercase;margin-left:auto}
.specimen .sp-fields{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;line-height:1.7}
.specimen .sp-fields dt{color:var(--ink-faint);letter-spacing:.12em;white-space:nowrap;font-size:12.5px;padding-top:1px}
.specimen .sp-fields dd{color:var(--ink)}
.specimen .sp-fields dd b{color:var(--sp-accent,var(--lapis))}
.specimen.t-monstrum{--sp-accent:var(--lapis)}
.specimen.t-res{--sp-accent:var(--moss-deep)}
.specimen.t-mandatum{--sp-accent:var(--gilt-dim)}
.specimen.t-certamen{--sp-accent:var(--cinnabar)}
.sp-seal{position:absolute;right:10px;top:10px;width:38px;height:38px;opacity:.9;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes sealPress{0%{transform:scale(1.7);opacity:0}60%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}

/* 较量记录 · 对阵插页 */
.cm-stance{margin:2px 0 12px;text-align:center;font-weight:700;font-size:14px;letter-spacing:.22em;padding:7px 10px;border-radius:3px}
.cm-stance.even{background:rgba(169,138,70,.14);color:var(--gilt-dim);border:1px solid rgba(169,138,70,.4)}
.cm-stance.bad{background:rgba(150,55,46,.12);color:var(--cinnabar);border:1px solid rgba(150,55,46,.45)}
.cm-stance.good{background:rgba(70,84,59,.14);color:var(--moss-deep);border:1px solid rgba(91,107,76,.45)}
.cm-sides{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.cm-side{background:rgba(251,247,235,.5);border:1px solid rgba(120,96,56,.32);border-radius:4px;padding:9px 11px}
.cm-side .meter .m-label{width:34px;font-size:11px}
.cm-side .meter .m-val{width:44px;font-size:12px}
.cm-side .meter{font-size:11px;gap:7px}
.cm-name{font-weight:700;font-size:14px;margin-bottom:4px;letter-spacing:.04em}
.cm-name span{display:block;font-size:10.5px;font-weight:400;color:var(--ink-faint);letter-spacing:.06em;font-family:var(--font-sans);margin-top:1px}
.cm-power{font-size:12px;color:var(--ink-soft);margin:3px 0 5px;font-family:var(--font-sans)}
.cm-power b{font-size:15px;color:var(--cinnabar)}
.cm-gear{font-size:11px;color:var(--ink-faint);font-family:var(--font-sans)}
.cm-vs{align-self:center;text-align:center;font-size:11px;letter-spacing:.1em;color:var(--gilt-dim);writing-mode:vertical-rl}
.cm-intent{font-size:12px;color:var(--ink-faint);font-family:var(--font-sans);margin:2px 0 6px}
.cm-judge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(47,74,94,.08);border:1px solid rgba(47,74,94,.3);border-radius:3px;padding:7px 11px;margin:7px 0;font-family:var(--font-sans);font-size:12px}
.cj-d20{font-weight:700;color:var(--lapis);letter-spacing:.06em}
.cj-mods{display:flex;gap:5px;flex-wrap:wrap}
.cj-mods i{font-style:normal;font-size:10.5px;color:var(--ink-faint);border:1px solid rgba(120,96,56,.35);border-radius:10px;padding:1px 8px}
.cj-sum{color:var(--ink-soft)}
.cj-res{font-weight:700;padding:1px 10px;border-radius:10px;letter-spacing:.1em}
.cj-res.pass{color:var(--moss-deep);border:1px solid rgba(91,107,76,.6)}
.cj-res.great{color:#FFF;background:var(--moss-deep)}
.cj-res.miss{background:var(--cinnabar);color:#F6E8E2}
.cm-bet{display:flex;gap:14px;font-size:12px;font-family:var(--font-sans);color:var(--ink-soft);margin:4px 0}
.cm-bet span:first-child{color:var(--moss-deep)}.cm-bet span:last-child{color:var(--cinnabar)}
.cm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.cm-act{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:2px 9px;align-items:center;text-align:left;background:rgba(251,247,235,.5);border:1px solid rgba(120,96,56,.35);border-radius:4px;padding:8px 10px;transition:all .24s var(--ease-spring)}
.cm-act:hover{border-color:var(--cinnabar);box-shadow:0 8px 18px rgba(96,66,28,.22),inset 0 1px 0 rgba(255,255,255,.5)}
.cm-risk{grid-row:1/3;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-family:var(--font-sans);border:1px solid}
.rk-safe{color:var(--moss-deep);border-color:rgba(91,107,76,.6)}
.rk-bold{color:var(--lapis);border-color:rgba(67,97,122,.6)}
.rk-risk{color:var(--gilt-dim);border-color:rgba(169,138,70,.65)}
.rk-doom{color:var(--cinnabar);border-color:rgba(150,55,46,.65)}
.rk-certain{color:var(--ink-soft);border-color:rgba(110,94,76,.5)}
.cm-act-name{font-weight:700;font-size:13px;letter-spacing:.04em}
.cm-act-name i{font-style:normal;font-weight:400;font-size:10.5px;color:var(--gilt-dim);margin-left:7px;font-family:var(--font-sans)}
.cm-act-desc{grid-column:2;font-size:11px;color:var(--ink-faint);font-family:var(--font-sans);line-height:1.55}
.cm-note{margin-top:8px;font-size:11px;color:var(--ink-faint);font-style:normal;letter-spacing:.04em}
@media (max-width:760px){.cm-sides{grid-template-columns:1fr}.cm-vs{writing-mode:horizontal-tb}.cm-actions{grid-template-columns:1fr}}

/* 抉择签（横排双列） */
.choices{margin:22px 2% 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-slip{position:relative;display:flex;align-items:center;gap:11px;padding:12px 15px;background:linear-gradient(168deg,#F2ECDC,#E6DEC8);border:1px solid rgba(120,88,40,.5);border-radius:3px;color:var(--ink);font-size:14px;letter-spacing:.04em;line-height:1.7;text-align:left;box-shadow:0 6px 16px rgba(66,44,18,.2);transition:transform .28s var(--ease-spring),border-color .28s,background .28s}
.choice-slip::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--cinnabar);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.choice-slip .cs-text{flex:1}
.choice-slip .cs-tag{flex:none;margin-left:auto;font-size:10px;color:var(--gilt-dim);letter-spacing:.14em;border:1px solid rgba(138,112,64,.5);border-radius:10px;padding:2px 8px}
.choice-slip:hover{border-color:var(--cinnabar);background:linear-gradient(168deg,#F7F2E4,#EDE6D4);box-shadow:0 10px 20px rgba(96,66,28,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.choice-slip:active{transform:translateY(-1px)}
@media (max-width:760px){.choices{grid-template-columns:1fr}}

/* 翻页把手 */
.leaf-handle{position:absolute;top:50%;z-index:8;transform:translateY(-50%);display:flex;align-items:center;gap:9px;padding:13px 15px;background:linear-gradient(165deg,rgba(246,242,231,.92),rgba(229,221,201,.9));border:1px solid rgba(120,88,40,.45);color:var(--ink-soft);font-size:12.5px;letter-spacing:.2em;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .3s var(--ease-spring),padding .3s}
.leaf-handle svg{width:15px;height:15px}
.leaf-handle.prev{left:-16px;border-radius:4px 10px 10px 4px}
.leaf-handle.next{right:-16px;border-radius:10px 4px 4px 10px}
.leaf-handle:hover{padding-left:20px;padding-right:20px}
.leaf-handle.prev:hover{transform:translateY(-50%) translateX(-9px)}
.leaf-handle.next:hover{transform:translateY(-50%) translateX(9px)}
.leaf-handle.disabled{opacity:.32;pointer-events:none}


/* ============ 书缘拇指书签（六模块） ============ */
/* ══════════ 烫金皮革工艺 · 书签与仪典按键统一 ══════════
   廉价感三来源：① 纯色圆角药丸无材质 ② 大字距稀疏发虚 ③ 硬边框无厚度
   修法：皮革渐层 + 内高光/内阴影做压印 + 金线双描边 + 细字距 + 微渐变 sheen */
.thumb-tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 8px 12px;
  font-size:12.5px;letter-spacing:.16em;color:#E3CE96;
  background:
    linear-gradient(180deg,rgba(255,255,255,.07),transparent 42%),
    linear-gradient(163deg,var(--leather-0),var(--leather-1) 62%,#2E1C13);
  border:1px solid rgba(201,174,109,.34);border-right:none;border-radius:0 8px 8px 0;
  box-shadow:
    inset 0 1px 0 rgba(255,225,170,.16),          /* 上沿高光 */
    inset 0 -8px 12px rgba(0,0,0,.34),            /* 下沿压暗 */
    4px 4px 14px rgba(0,0,0,.45);
  transition:transform .26s var(--ease-spring),background .26s,box-shadow .26s,color .26s;
  width:34px;overflow:hidden}
.thumb-tab span{writing-mode:vertical-rl;letter-spacing:.2em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.thumb-tab svg{width:19px;height:19px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
/* 金线压边：选中或悬停时从左侧渗出 */
.thumb-tab::before{content:'';position:absolute;left:0;top:8%;bottom:8%;width:2px;background:linear-gradient(180deg,transparent,var(--gilt-hi),transparent);opacity:0;transition:opacity .26s}
.thumb-tab:hover{color:#F4E4BC;box-shadow:inset 0 1px 0 rgba(255,225,170,.22),inset 0 -8px 12px rgba(0,0,0,.34),6px 6px 18px rgba(0,0,0,.5),0 0 0 1px rgba(201,174,109,.24)}
.thumb-tab:hover::before{opacity:.65}
.thumb-tab.active{color:#F7E9C6;letter-spacing:.2em;
  background:
    linear-gradient(180deg,rgba(255,235,190,.12),transparent 46%),
    linear-gradient(163deg,#7A3228,#571F18 62%,#3E1710);
  border-color:rgba(201,174,109,.62);
  box-shadow:inset 0 1px 0 rgba(255,235,190,.26),inset 0 -8px 12px rgba(0,0,0,.4),6px 6px 18px rgba(0,0,0,.55),0 0 0 1px rgba(201,174,109,.3)}
.thumb-tab.active::before{opacity:1;box-shadow:0 0 8px rgba(201,174,109,.7)}
/* 桌面端纵向书签栏：必须能内滚。
   此前只有 position:absolute + flex-direction:column，没有 max-height/overflow-y，
   签位多或视口矮时整列溢出到 iframe 之外被裁掉——用户看到的就是「锁死、滚不动」。
   桌面纵向滚动；移动端在下方媒体查询里改回横向 overflow-x，两套互不干扰。 */
.thumb-tabs{position:absolute;right:-34px;top:64px;bottom:14px;z-index:7;display:flex;flex-direction:column;gap:9px;
  max-height:calc(100% - 78px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent;padding:2px 0}
.thumb-tabs-left{position:absolute;left:-34px;top:64px;bottom:14px;right:auto}

/* 溢出时才给上下缘加渐隐提示，滚到头/尾自动去掉（滚动监听只在这两个元素上） */
.thumb-tabs.rail-more::before,.thumb-tabs.rail-more::after,
.thumb-tabs-left.rail-more::before,.thumb-tabs-left.rail-more::after{content:'';position:sticky;display:block;height:16px;margin:-2px 0;pointer-events:none;z-index:2}
.thumb-tabs.rail-more::before,.thumb-tabs-left.rail-more::before{top:0;background:linear-gradient(180deg,rgba(22,15,10,.62),transparent)}
.thumb-tabs.rail-more::after,.thumb-tabs-left.rail-more::after{bottom:0;background:linear-gradient(0deg,rgba(22,15,10,.62),transparent)}
.thumb-tabs.rail-edge-top::before,.thumb-tabs-left.rail-edge-top::before{display:none}
.thumb-tabs.rail-edge-bot::after,.thumb-tabs-left.rail-edge-bot::after{display:none}
/* 移动端横向底栏的溢出提示（左右缘），与纵向版互斥，由 JS 的 rail-h 类切换 */
.thumb-tabs.rail-h::before,.thumb-tabs-left.rail-h::before{content:'';position:absolute;left:0;top:0;bottom:0;width:18px;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(30,21,14,.85),transparent)}
.thumb-tabs.rail-h::after,.thumb-tabs-left.rail-h::after{content:'';position:absolute;right:0;top:0;bottom:0;width:18px;pointer-events:none;z-index:2;
  background:linear-gradient(270deg,rgba(30,21,14,.85),transparent)}
.thumb-tabs.rail-h-end::after,.thumb-tabs-left.rail-h-end::after{display:none}
/* 签本身不许被 flex 压扁（压扁=点不中、字被裁） */
.thumb-tab{flex:0 0 auto}
.thumb-tabs-left .thumb-tab{border-right:none;border-left:none;border-radius:9px 0 0 9px;box-shadow:-4px 4px 14px rgba(0,0,0,.45)}
/* 左缘账卷签（镜像皮签） */
.thumb-tabs-left .thumb-tab{border-right:1px solid rgba(201,174,109,.34);border-left:none;border-radius:8px 0 0 8px;box-shadow:inset 0 1px 0 rgba(255,225,170,.16),inset 0 -8px 12px rgba(0,0,0,.34),-4px 4px 14px rgba(0,0,0,.45)}
.thumb-tabs-left .thumb-tab::before{left:auto;right:0}
.thumb-tabs-left .thumb-tab:hover{box-shadow:inset 0 1px 0 rgba(255,225,170,.22),inset 0 -8px 12px rgba(0,0,0,.34),-6px 6px 18px rgba(0,0,0,.5),0 0 0 1px rgba(201,174,109,.24)}
.thumb-tabs-left .thumb-tab.active{box-shadow:inset 0 1px 0 rgba(255,235,190,.26),inset 0 -8px 12px rgba(0,0,0,.4),-6px 6px 18px rgba(0,0,0,.55),0 0 0 1px rgba(201,174,109,.3)}
.insert.from-left{left:1.2%;right:auto;border-radius:10px 3px 3px 10px;transform:translateX(-112%);box-shadow:18px 16px 40px rgba(0,0,0,.42),inset 0 0 44px rgba(120,96,56,.10)}
.insert.from-left.open{transform:none}
.insert.from-left::before{left:auto;right:0;background:linear-gradient(270deg,rgba(96,66,28,.35),transparent)}

/* ============ 扉页 · 开场白 ============
   ⚠ 这一整块此前在样式表里完全缺失（.endpaper/.ep-frame/.ep-text/.ep-nav/.ep-go
   六类零定义）。showEndpaper() 照常填好 HTML 并给 #endpaper 加 .open，但 aside 无高度、
   子元素无排版 → 真机点封面后书页区域高 0，整幅只剩羊皮纸底与页脚纹样，
   表现正是「点进去只有这个，除此之外什么都没有」。此处按封面同一套鎏金/羊皮纸语汇补齐。*/
.endpaper{position:absolute;inset:0;z-index:11;border-radius:6px 14px 14px 6px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transform:translateY(103%);visibility:hidden;
  transition:transform .55s var(--ease-out),visibility 0s .6s}
.endpaper.open{transform:none;visibility:visible;transition:transform .55s var(--ease-out)}
/* 西籍内扉（扉页）：双边版框 + 书名页居中构图 + 彩饰首字。DOM 顺序 = 自上而下 */
.ep-frame{position:relative;width:86%;height:88%;border:2px solid rgba(72,52,22,.55);
  padding:30px 40px 24px;
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,252,242,.42),transparent 55%),rgba(120,96,56,.06);
  box-shadow:inset 0 0 60px rgba(120,88,40,.16)}
.ep-frame::before{content:'';position:absolute;inset:7px;border:1px solid rgba(72,52,22,.42);pointer-events:none}
.ep-leaf{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
.ep-eyebrow{flex:none;display:flex;align-items:center;gap:13px}
.ee-line{width:44px;height:1px;background:linear-gradient(90deg,transparent,rgba(120,90,40,.6))}
.ee-line.rt{background:linear-gradient(90deg,rgba(120,90,40,.6),transparent)}
.ep-latin{font-family:var(--font-latin);font-size:11px;font-weight:600;letter-spacing:.42em;text-indent:.42em;color:var(--gilt-dim)}
.ep-title{flex:none;margin-top:14px;font-family:var(--font-serif);font-weight:700;font-size:32px;line-height:1.2;
  letter-spacing:.32em;text-indent:.32em;color:#2C1E0C}
.ep-lsign{font-family:var(--font-latin);font-size:10px;font-weight:600;letter-spacing:.36em;text-indent:.36em;text-transform:uppercase;color:rgba(110,84,40,.75)}
.ep-rule{flex:none;position:relative;width:190px;height:12px;margin:11px 0 2px}
.ep-rule::before,.ep-rule::after{content:'';position:absolute;left:0;right:0;height:1px}
.ep-rule::before{top:3px;background:rgba(72,52,22,.6)}
.ep-rule::after{bottom:3px;background:rgba(72,52,22,.42)}
.ep-rule span{position:absolute;top:50%;left:50%;width:6px;height:6px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(72,52,22,.6)}
/* 开场白：居中行长 + 两端对齐（不做首字放大，常规字号起笔） */
.ep-text{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent;
  width:min(100%,560px);margin:6px auto 2px;padding:2px 6px;
  color:#33281D;font-family:var(--font-serif);font-size:15.5px;line-height:2.15;
  letter-spacing:.04em;text-align:justify;white-space:pre-wrap}

.ep-nav{flex:none;display:flex;align-items:center;gap:56px;margin-top:12px;padding-top:14px;
  border-top:1px solid rgba(72,52,22,.35)}
.ep-nav button{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:0;
  background:none;font-family:var(--font-serif);font-size:13.5px;letter-spacing:.24em;color:var(--ink-soft);
  position:relative;transition:color .28s}
.ep-nav button::after{content:'';position:absolute;left:3px;right:3px;bottom:0;height:1px;
  background:var(--cinnabar);transform:scaleX(0);transform-origin:center;transition:transform .34s var(--ease-out)}
.ep-nav button:hover{color:var(--cinnabar)}
.ep-nav button:hover::after{transform:scaleX(1)}
.ep-chev{font-family:var(--font-latin);font-size:15px;line-height:1;opacity:.85;transition:transform .3s var(--ease-out)}
.ep-nav .ep-back:hover .ep-chev{transform:translateX(-3px)}
.ep-nav .ep-go{color:var(--cinnabar);font-weight:700}
.ep-nav .ep-go::after{transform:scaleX(1);background:linear-gradient(90deg,var(--cinnabar),rgba(150,55,46,.2))}
.ep-nav .ep-go:hover .ep-chev{transform:translateX(3px)}
@media (hover:none){ .ep-nav button{padding:12px 10px;font-size:14px} }
body.modian-fs-on .ep-frame{width:82%;height:86%}
@media (max-width:760px){
  .ep-frame{width:93%;height:91%;padding:22px 20px 18px}
  .ep-title{font-size:24px}
  .ep-rule{width:150px}
  .ep-text{font-size:14.5px;line-height:2}
  .ep-nav{gap:26px}
}

/* ============ 插页（模块面板） ============ */
.insert{position:absolute;top:2.2%;bottom:2.2%;left:1.2%;right:1.2%;z-index:3003;background:linear-gradient(rgba(242,237,222,.55),rgba(238,231,211,.62)),url('../素材候选/parchment-parchment-00-jpg.jpg') center/cover,var(--vellum-aged);border-radius:3px 10px 10px 3px;box-shadow:-18px 16px 40px rgba(0,0,0,.42),inset 0 0 44px rgba(120,96,56,.10);transform:translateX(112%);visibility:hidden;transition:transform .48s var(--ease-out),visibility 0s .5s;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(120,96,56,.32)}
.insert.open{transform:none;visibility:visible;transition:transform .48s var(--ease-out)}
/* 插页铺满书页后会盖住两侧皮签；打开时让它们退避。
   ⚠ 此前这里写了 pointer-events:none —— 那等于「打开插页后书签全变哑巴」，
   用户要的「再点一下收起」在物理上就不可能发生。改为只降透明度，点击照旧。 */
.insert.open ~ .thumb-tabs,.insert.open ~ .thumb-tabs-left{opacity:.34;transition:opacity .3s}
.insert.open ~ .thumb-tabs:hover,.insert.open ~ .thumb-tabs-left:hover{opacity:.85}
/* 兄弟选择器方向其实是反的（tabsLeft 被插在 tabs 与 insert 之间，insert ~ tabs 永不命中），
   这条规则历史上从未生效。改用 :has() 从 .tome 根上判状态，两侧书签一次到位。 */
.tome:has(.insert.open) .thumb-tabs,.tome:has(.insert.open) .thumb-tabs-left{opacity:.34;transition:opacity .3s}
.tome:has(.insert.open) .thumb-tabs:hover,.tome:has(.insert.open) .thumb-tabs-left:hover{opacity:.85}
.thumb-tabs,.thumb-tabs-left{transition:opacity .3s}
.insert::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(96,66,28,.35),transparent);pointer-events:none}
.insert-head{flex:none;display:flex;align-items:center;gap:12px;padding:15px 20px 12px;border-bottom:1px solid rgba(120,88,40,.3)}

.insert-head h3{font-size:18px;font-weight:700;letter-spacing:.16em;color:var(--ink)}
.insert-head .ih-latin{font-family:var(--font-latin);font-size:10.5px;letter-spacing:.3em;color:var(--gilt-dim);text-transform:uppercase;margin-top:2px}
.insert-head .ih-ver{letter-spacing:.08em;opacity:.6;text-transform:none}
.insert-head .ih-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.insert-head .ih-close{width:30px;height:30px;border-radius:50%;border:1px solid rgba(120,88,40,.5);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;transition:all .25s}
.insert-head .ih-close:hover{background:var(--cinnabar);color:#F6F2E7;border-color:var(--cinnabar);transform:rotate(90deg)}
/* 局内全屏：插页打开时也能收放，避免面板内容被视口裁掉 */
.insert-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 22px;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent}

.battle-flag .bf-t{display:flex;align-items:center;gap:7px;font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--cinnabar-deep)}
.battle-flag .bf-n{margin-top:3px;font-size:12.5px;font-weight:700;color:var(--ink)}

.battle-flag .m-track{background:rgba(109,35,28,.14)}
.sec-title.sv-cinnabar{color:var(--cinnabar)}.sec-title.sv-cinnabar::after{background:linear-gradient(90deg,rgba(150,55,46,.4),transparent)}
.plaque{background:linear-gradient(172deg,rgba(246,242,231,.72),rgba(239,234,221,.5));border:1px solid rgba(120,88,40,.35);border-radius:4px;padding:11px 14px;margin-bottom:9px;box-shadow:0 4px 12px rgba(96,66,28,.1)}

.meter .m-track{flex:1;height:9px;background:rgba(96,66,28,.16);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(43,34,26,.24)}
.meter .m-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--mv,#A98A46),var(--mv2,#C9AE6D));transition:width .7s var(--ease-out);width:0}
.meter .m-val{width:52px;flex:none;text-align:right;font-family:var(--font-latin);font-weight:700;font-size:14px;color:var(--ink)}

.dex-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:4px}
.dex-cell{background:linear-gradient(170deg,rgba(246,242,231,.66),rgba(229,221,201,.45));border:1px solid rgba(120,88,40,.4);border-radius:4px;padding:11px 10px 9px;text-align:center;transition:transform .25s var(--ease-spring),box-shadow .25s}

/* 种族总览 · 封印与名册（旧 DexWall 结构） */
.cameo{position:relative;width:100%;aspect-ratio:3/4;border:1px solid rgba(120,96,56,.5);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:radial-gradient(120% 100% at 50% 0%,rgba(255,250,238,.55),transparent 55%),repeating-linear-gradient(45deg,rgba(120,96,56,.07) 0 1px,transparent 1px 7px),linear-gradient(168deg,rgba(243,236,219,.6),rgba(232,220,190,.4));
  box-shadow:inset 0 0 18px rgba(120,88,40,.12)}
.cameo::before{content:'';position:absolute;inset:5px;border:1px dashed rgba(138,112,64,.38);border-radius:3px;pointer-events:none}
.cameo-ch{font-size:30px;font-weight:700;color:var(--gilt-dim);text-shadow:0 1px 0 rgba(255,250,238,.7);font-family:var(--font-latin);letter-spacing:.02em}

.dex-heroine .cameo-ch{font-family:var(--font-serif);font-size:32px}
.dw-searchbar{display:flex;align-items:center;gap:9px;margin:4px 0 12px}

.dex-slot:hover{box-shadow:0 10px 22px rgba(96,66,28,.26),inset 0 1px 0 rgba(255,255,255,.55);border-color:var(--cinnabar)}

/* —— 图鉴 · 内分栏（住民 / 女主 / 魔物娘）——
   三个大类共用一个「图鉴」标签。刻意复用名册里既有的 .dw-tabs/.dw-tab 视觉
   （同一套描金描边 + .on 朱砂），而不是另造一套卡片按钮——同一界面里出现两种
   分栏样式就是割裂。也刻意不吸顶：浮在正文上的控件会压住内容，且不属于这套
   书页语言；需要换类时滚回顶部即可。

   排版：早先用 flex + 内容宽度，三个药丸全挤在左侧，右边空出一大片 —— 而下面
   恰好是一条通栏的 .dex-grid，空白与网格不对齐，视觉上就是「缺了一块」。
   现改为 grid 三等分：每格等宽、文字居中，左右边缘与下方卡片网格严格对齐，
   空白被均匀摊进三格，不再偏在一侧。 */
.dx-subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}

@media (max-width:760px){.dx-subtabs{gap:6px;margin:0 0 11px}.dx-subtab{flex-direction:column;gap:4px;padding:7px 4px;font-size:11px;letter-spacing:.04em}.dx-subtab .dxs-ic{width:13px;height:13px}}
/* 实体化四阶段轨：不用箭头横排（阶段名因住民而异，横排必然要前端编名字），
   改成一列四行——序号 + 门槛 + 达标勾，差额直接印在门槛后面。 */
.as-track{display:flex;flex-direction:column;margin:2px 0 8px;border-top:1px solid rgba(120,96,56,.24)}
.as-row{display:flex;align-items:center;gap:11px;padding:8px 2px;border-bottom:1px solid rgba(120,96,56,.16);opacity:.5;transition:opacity .25s}
.as-row.done{opacity:1}
.as-row.cur{background:linear-gradient(90deg,rgba(150,55,46,.09),transparent)}
.as-no{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:1px solid currentColor;border-radius:50%;
  font-family:var(--font-latin);font-size:10.5px;font-weight:700;color:var(--ink-faint)}
.as-row.done .as-no{color:var(--gilt-dim);background:rgba(169,138,70,.14)}
.as-row.cur .as-no{color:var(--cinnabar);border-width:1.6px}
.as-hint{flex:1;font-size:12px;letter-spacing:.1em;color:var(--ink-soft)}
.as-row.done .as-hint{color:var(--ink)}
.as-mark{flex:none;font-size:12px;color:var(--gilt)}
.as-note{padding:9px 12px;border:1px dashed rgba(96,66,28,.4);border-radius:4px;font-size:11.5px;line-height:1.8;color:var(--ink-faint);letter-spacing:.04em}
.as-note b{color:var(--gilt-dim);font-weight:600}
/* —— 魔物娘名册 · 种类折叠 ——
   28 大类 / 79 科属平铺会撑出几千像素，读者找不到东西。按种类折叠成手风琴，
   标题栏常驻（种类名 + 成员数），点标题才展开该类的卡片网格。 */
.dw-foldbar{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.dw-foldbar .dfb-note{flex:1;font-size:10.5px;font-family:var(--font-sans);color:var(--ink-faint);letter-spacing:.06em;text-align:left;line-height:1.5}
.dw-foldbtn{padding:4px 12px;border:1px solid rgba(120,96,56,.4);border-radius:14px;background:transparent;font-family:var(--font-sans);font-size:11.5px;letter-spacing:.1em;color:var(--ink-soft);white-space:nowrap;transition:all .22s}
.dw-foldbtn:hover{border-color:var(--gilt);color:var(--ink)}
.dex-cat{margin:0}
.dw-cat-h{display:flex;align-items:center;gap:9px;width:100%;margin:15px 0 0;padding:0 0 7px;background:none;border:none;border-bottom:1px solid rgba(47,74,94,.22);
  font-family:var(--font-serif);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--lapis);cursor:pointer;text-align:left;transition:color .25s}
.dw-cat-h:hover{color:var(--cinnabar)}
.dw-cat-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(47,74,94,.35),transparent)}
.dw-cat-h .dc-caret{flex:none;display:inline-flex;align-items:center;justify-content:center;width:11px;height:11px;color:var(--gilt-dim);transform:rotate(0deg);transition:transform .3s var(--ease-out)}
.dw-cat-h .dc-caret svg{width:11px;height:11px;display:block}
.dw-cat-h.on .dc-caret{transform:rotate(90deg)}
.dw-cat-h .dc-n{font-weight:400;font-size:10.5px;font-family:var(--font-sans);color:var(--ink-faint);letter-spacing:.06em}
.dw-cat-b{display:none;padding-top:9px}
.dw-cat-b.on{display:block;animation:mgeDexCat .34s var(--ease-out)}
@keyframes mgeDexCat{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
/* 编号前缀：卡片名一律「NO.001 阿娜温」，与详情页 NO. 字段同源（r.no） */
.dex-slot .ds-nm{display:flex;align-items:baseline;justify-content:center;gap:5px}
.dex-slot .ds-no{flex:none;font-family:var(--font-latin);font-size:9px;font-weight:700;line-height:1.35;letter-spacing:.04em;color:var(--gilt-dim);border:1px solid rgba(169,138,70,.45);border-radius:3px;padding:0 3px}
.dex-cell.bonded{border-color:rgba(150,55,46,.55)}
.dex-cell.bonded .dc-bond{color:var(--cinnabar)}
.src-note{display:none}
@media (max-width:760px){.dex-grid{grid-template-columns:repeat(3,1fr)}}
.dex-detail .dd-back{display:flex;align-items:center;gap:7px;background:none;border:none;font-family:var(--font-serif);font-size:13px;letter-spacing:.16em;color:var(--ink-soft);padding:4px 2px;margin-bottom:12px;transition:color .25s}
.dex-detail .dd-back:hover{color:var(--cinnabar)}
.dex-detail .dd-back svg{width:14px;height:14px}
.dd-hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.dd-hero .cameo{width:132px;flex:none}
.dd-hero .cameo-ch{font-family:var(--font-sans);font-size:36px}
.dd-id{padding-top:6px}
.dd-no{font-family:var(--font-sans);font-size:11px;letter-spacing:.18em;color:var(--gilt-dim)}
.dd-nm{font-size:26px;font-weight:700;letter-spacing:.08em;margin:4px 0 2px}
/* 两列：标签列按内容宽（nowrap 保证不折），值列吃掉剩余全部宽度。
   首列 minmax(0,auto) + 值列 minmax(0,1fr)：两侧都可压缩，
   窄屏时值列不会被标签顶出横向滚动条。 */
.dd-fields{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:5px 13px;font-size:13px;margin:4px 0 12px;border-top:1px dashed rgba(120,96,56,.3);padding-top:11px}
.dd-fields dt{color:var(--gilt-dim);font-family:var(--font-sans);font-size:12px;letter-spacing:.14em;white-space:nowrap}
/* 行长自适应。踩过的坑：这里原本写 max-width:38em（为正文页 .tome 760px 设的），
   但图鉴详情页的插页内容区有 700px，38em≈500px 直接砍掉 200px —— 文字全挤在左边、
   右侧空出一大片（实测 dd 494 / p 513 / 内容区 700）。
   ⚠ 第二次踩坑：改成 min(38em,100%) 无效 —— em 在嵌套容器里被换算成绝对像素
   （实测算出 min(513px,100%)），仍然锁死。
   现在用纯百分比上限：100% 即填满当前容器，窄容器自动收窄、宽容器自动铺满，
   行长交由容器尺寸决定，不再有任何写死的 em。 */
.dd-fields dd{color:var(--ink);line-height:1.65;max-width:100%}
.dd-lore p{max-width:100%}
.dd-lore{border:1px solid rgba(120,96,56,.4);border-radius:4px;background:rgba(251,247,235,.4);padding:11px 14px;margin-bottom:12px}
.dd-lore p{font-size:13.5px;line-height:1.9;text-align:justify;color:var(--ink-soft);margin:0;text-indent:2em}
.dd-lore p+p{margin-top:.62em}   /* 段距：空行交给这里，不再靠 <br><br> 撑 */
/* WIKI 原文里的小标题（【简介】【动作特征】…）。必须零缩进 ——
   中文段落首行缩进两格是给正文看的，标题跟着缩两格就与正文左缘错开了。 */
.dd-lore h4{font-family:var(--font-serif);font-size:13.5px;font-weight:700;letter-spacing:.14em;color:var(--gilt-dim);
  margin:14px 0 6px;padding-left:0;text-indent:0;line-height:1.6}
.dd-lore h4:first-child{margin-top:2px}
.dw-cardlabel{font-family:var(--font-sans);font-size:11px;letter-spacing:.22em;color:var(--gilt-dim);margin:4px 0 2px}
/* ══════════ 立契 NPC · 自定义角色模块 ══════════ */
.npcforge{margin:10px 0 4px}
.nf-sec{margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed rgba(120,96,56,.34)}
.nf-sec:last-child{border-bottom:none}
.nf-lab{font-family:var(--font-sans);font-size:11.5px;letter-spacing:.2em;color:var(--gilt-dim);margin-bottom:7px;display:flex;align-items:baseline;gap:8px}
.nf-lab em{font-style:normal;font-size:10.5px;color:var(--ink-faint);letter-spacing:.08em}
.nf-chips{display:flex;flex-wrap:wrap;gap:6px}

.nf-chip:hover{border-color:var(--cinnabar);color:var(--cinnabar)}

.nf-keyrow{display:flex;align-items:stretch;gap:7px}
.nf-keyrow input{flex:1;min-width:0}

  border:1px solid rgba(120,96,56,.5);border-radius:3px;background:linear-gradient(172deg,rgba(255,252,242,.7),rgba(233,226,208,.58));

  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 4px rgba(120,96,56,.14),0 1px 2px rgba(96,66,28,.1);
  transition:box-shadow .2s,border-color .2s,color .2s}
.nf-keyadd:hover:not(:disabled){border-color:var(--gilt);color:var(--cinnabar);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 10px rgba(96,66,28,.2)}
.nf-keyadd:active:not(:disabled){box-shadow:inset 0 2px 5px rgba(120,96,56,.26);transform:translateY(1px)}
.nf-keyadd:disabled{opacity:.36;cursor:not-allowed}

}

.dw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin:4px 0 14px}
.dw-slot{border:1px solid rgba(120,96,56,.28);border-radius:3px;padding:7px 6px;background:rgba(251,247,235,.34);text-align:center;opacity:.62;transition:opacity .3s,border-color .3s,background .3s}
.dw-slot.met{opacity:1;border-color:rgba(150,55,46,.45);background:rgba(150,55,46,.09);cursor:pointer}
.dw-slot.met:hover{border-color:var(--cinnabar)}
.dw-no{display:block;font-family:var(--font-latin);font-size:9px;letter-spacing:.14em;color:var(--ink-faint)}
.dw-nm{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-slot:not(.met) .dw-nm{color:var(--ink-faint);letter-spacing:.2em}
/* ── 世界书实时档案：形态版本块（女主 基础版/堕落版、心界住民档案共用） ── */
.dd-ver{margin:0 0 14px;padding:0}
.dd-ver:last-child{margin-bottom:0}
.dd-ver .dw-cardlabel{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:12px 0 7px}
.dd-ver:first-child .dw-cardlabel{margin-top:2px}
.wv-tag{flex:none;padding:1px 8px;border-radius:9px;font-family:var(--font-sans);font-size:9px;font-weight:700;letter-spacing:.16em;
  border:1px solid rgba(120,96,56,.42);color:var(--ink-faint);background:rgba(120,96,56,.07)}
.wv-tag.on{border-color:rgba(150,55,46,.6);color:var(--cinnabar);background:rgba(150,55,46,.12)}
.wv-src{margin-left:auto;font-family:var(--font-latin);font-size:9px;letter-spacing:.14em;color:var(--ink-faint);opacity:.8}
/* 形态未生效的版本：整体压暗，但文字仍完整可读可复制（只是弱化，不删内容） */
.dd-ver:not(.on){opacity:.62}
.dd-ver:not(.on):hover{opacity:1}
.dd-ver.on{position:relative;padding-left:10px;border-left:2px solid rgba(150,55,46,.35)}
/* 索引建立中的占位格 */
.dex-cell.pending{opacity:.34;animation:cellBreath 1.6s ease-in-out infinite}
@keyframes cellBreath{0%,100%{opacity:.22}50%{opacity:.45}}
.hs-pending{font-family:var(--font-sans);font-size:10px;letter-spacing:.14em;color:var(--ink-faint);opacity:.8}
.dex-lock .dl-form{display:flex;gap:9px;justify-content:center}
.dex-lock input{width:150px;background:rgba(255,253,246,.5);border:1px solid rgba(120,96,56,.5);border-radius:3px;padding:7px 11px;font-family:var(--font-serif);font-size:14px;color:var(--ink);outline:none;text-align:center;letter-spacing:.2em}
.dex-lock input:focus{border-color:var(--cinnabar)}
.dex-lock button{padding:7px 20px;border:1px solid rgba(150,55,46,.55);border-radius:3px;background:rgba(150,55,46,.12);color:var(--cinnabar);font-size:13px;letter-spacing:.22em;transition:all .25s}
.dex-lock button:hover{background:var(--cinnabar);color:#F6E8E2}
.manuscript-strip{margin:12px 0 4px;border:1px solid rgba(120,88,40,.42);border-radius:4px;overflow:hidden;position:relative;max-height:150px}
.manuscript-strip img{width:100%;display:block;object-fit:cover;object-position:center 30%}
.manuscript-strip .ms-cap{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;font-size:11.5px;letter-spacing:.16em;color:#EFE3C6;background:linear-gradient(transparent,rgba(20,14,8,.82))}

/* 封面（启封）· 一部西幻古卷：古旧皮面 + 书脊竹节 + 书口纸纹 + 盲压双边与菱形中饰
   + 烫金书名 + 火漆印 + 拉丁版记。不贴花——高级感来自皮料、压凹、烫金与留白。 */
.cover{position:absolute;inset:0;z-index:10;border-radius:8px 13px 13px 8px;overflow:hidden;
  background:
    radial-gradient(115% 92% at 50% -4%,rgba(255,220,160,.15),transparent 52%),
    linear-gradient(100deg,rgba(28,14,6,.5),rgba(0,0,0,0) 10%),
    linear-gradient(rgba(84,50,26,.22),rgba(46,26,13,.38)),
    url('../素材候选/leather-free-antique-leather-book-cover-texture-for-laye.jpg') center/cover, #6B4A2E;
  box-shadow:0 34px 80px rgba(0,0,0,.68),inset 0 0 90px rgba(28,14,6,.52);
  display:flex;transform-origin:left center;transition:transform .9s cubic-bezier(.55,.06,.35,1),opacity .7s}
/* 书脊：左缘深勒 + 两道竹节压线 */
.cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5%;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.2) 60%,rgba(255,225,170,.06) 85%,transparent),
    linear-gradient(180deg,transparent 0,transparent 20.8%,rgba(20,10,4,.5) 21%,rgba(20,10,4,.5) 22.6%,rgba(255,220,160,.08) 22.8%,transparent 23.4%,transparent 75.8%,rgba(20,10,4,.5) 76%,rgba(20,10,4,.5) 77.6%,rgba(255,220,160,.08) 77.8%,transparent 78.4%)}
/* 书口：右缘书页断层的细密纸纹 */
.cover::after{content:'';position:absolute;right:0;top:1.2%;bottom:1.2%;width:9px;pointer-events:none;
  background:repeating-linear-gradient(180deg,#DCCDA8 0 1px,#7E6B48 1px 2px);
  border-radius:0 3px 3px 0;box-shadow:-2px 0 7px rgba(0,0,0,.4);opacity:.9}
.cover.opened{transform:rotateY(-128deg) translateX(-4%);opacity:0;pointer-events:none;transform-origin:left center}
/* 进入阅读态：封面彻底移除。翻页动画只在点「启封」那一瞬有意义；
   若保留 .opened 的 rotateY 姿态，封皮会永久停在书页左侧遮挡正文（真机即「只看到封面」）。 */
.tome[data-stage="reading"] .cover,
.tome[data-stage="ritual"] .cover,
.tome[data-stage="awaiting"] .cover,
.tome[data-stage="endpaper"] .cover{display:none}
/* 盲压双边 + 中央菱形压饰：深沟 + 下缘微光，像烫斗压进皮面的凹线（西籍装帧） */
.cover-board{position:relative;flex:1;margin:4.4% 5.2% 4.4% 7.5%;
  border:1px solid rgba(40,22,8,.55);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.35),0 1px 1px rgba(255,225,170,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px}
.cover-board::before{content:'';position:absolute;inset:8px;border:1px solid rgba(40,22,8,.45);pointer-events:none;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.3),0 1px 0 rgba(255,225,170,.06)}
/* 中央盲压菱形（双层），古西籍封面中饰 */
.cv-lozenge{position:absolute;top:50%;left:50%;width:min(310px,58%);aspect-ratio:1;pointer-events:none;
  transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid rgba(38,20,7,.5);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.35),0 1px 1px rgba(255,225,170,.09),inset 0 0 0 9px rgba(0,0,0,.06)}
.cv-lozenge::before{content:'';position:absolute;inset:10px;border:1px solid rgba(38,20,7,.42);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.3),0 1px 0 rgba(255,225,170,.07)}
/* 书名组：拉丁眉题 + 烫金书名 + 双线分隔 + 副题 */
.cv-head{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:13px;text-align:center;
  padding:28px 46px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(22,11,4,.42),rgba(22,11,4,0))}
.cv-eyebrow{display:flex;align-items:center;gap:13px}
.cv-line{width:52px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,174,109,.8))}
.cv-line.rt{background:linear-gradient(90deg,rgba(201,174,109,.8),transparent)}
.cv-latin{font-family:var(--font-latin);font-size:11px;font-weight:600;letter-spacing:.46em;text-indent:.46em;
  color:rgba(224,199,140,.9);text-shadow:0 1px 0 rgba(0,0,0,.4)}
.cv-title{font-size:52px;font-weight:700;letter-spacing:.3em;text-indent:.3em;line-height:1.16;
  background:linear-gradient(178deg,#F6E7B6 5%,#E8CF92 32%,#C99F58 52%,#A5813F 60%,#ECD394 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.cv-rule{position:relative;width:200px;height:12px}
.cv-rule::before,.cv-rule::after{content:'';position:absolute;left:0;right:0;height:1px;background:rgba(201,174,109,.75)}
.cv-rule::before{top:3px}.cv-rule::after{bottom:3px}
.cv-rule span{position:absolute;top:50%;left:50%;width:6px;height:6px;transform:translate(-50%,-50%) rotate(45deg);
  border:1px solid rgba(201,174,109,.8);background:transparent}
.cv-sub{font-size:12px;color:rgba(216,196,142,.75);letter-spacing:.5em;text-indent:.5em;text-shadow:0 1px 0 rgba(0,0,0,.4)}
/* 火漆印：纯 CSS 的不规则蜡团 + 压凹字母纹章 */
/* 火漆印 · 开启命运的唯一入口（原「触碰以开启命运」按钮已撤除，
   交互样式由 .cv-unseal 整段平移至此，朱印本体即按钮） */
.cv-seal{position:relative;z-index:1;margin-top:6px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;
  padding:0;border:none;appearance:none;cursor:pointer;font:inherit;
  border-radius:47% 53% 55% 45%/52% 46% 54% 48%;
  background:radial-gradient(circle at 36% 28%,#B5503F 0%,#96372E 46%,#6D231C 78%,#57170F 100%);
  box-shadow:0 5px 13px rgba(18,8,3,.55),inset 0 2px 3px rgba(255,190,160,.32),inset 0 -5px 9px rgba(40,8,4,.55);
  transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease-spring),filter .3s;
  animation:cvBreath 3.8s ease-in-out infinite}
.cv-seal::before{content:'';position:absolute;inset:9px;border-radius:46% 54% 52% 48%/55% 45% 50% 50%;
  border:1.5px solid rgba(60,12,8,.55);box-shadow:0 1px 0 rgba(255,190,160,.16),inset 0 1px 1px rgba(40,8,4,.4)}
.cv-seal span{font-family:var(--font-latin);font-size:24px;font-weight:700;color:#E9CBA1;
  text-shadow:0 1px 1px rgba(50,9,4,.7),0 -1px 1px rgba(255,205,175,.22);pointer-events:none}
.cv-seal:hover{transform:scale(1.1);filter:brightness(1.12);
  box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 30px rgba(150,55,46,.4),inset 0 2px 3px rgba(255,190,160,.4),inset 0 -5px 9px rgba(40,8,4,.5)}
.cv-seal:active{transform:scale(.96)}
.cv-seal:focus-visible{outline:2px solid rgba(240,222,160,.9);outline-offset:5px}
/* 版記：右下角一行拉丁小字，像西籍封底的印坊落款 */
.cv-colophon{position:absolute;bottom:5.4%;right:6.4%;z-index:1;
  font-family:var(--font-latin);font-size:9.5px;font-weight:600;letter-spacing:.4em;text-indent:.4em;text-transform:uppercase;
  color:rgba(46,26,10,.62);text-shadow:0 1px 0 rgba(255,225,170,.07)}
/* 呼吸动效：朱印微微起伏，暗示「可点」 */
@keyframes cvBreath{0%,100%{box-shadow:0 5px 13px rgba(18,8,3,.55),inset 0 2px 3px rgba(255,190,160,.32),inset 0 -5px 9px rgba(40,8,4,.55)}
  50%{box-shadow:0 6px 17px rgba(18,8,3,.6),inset 0 2px 3px rgba(255,190,160,.36),inset 0 -5px 9px rgba(40,8,4,.55),0 0 22px rgba(201,174,109,.24)}}

/* ============ 墨签通知 ============ */
#ink-slips{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.ink-slip{display:flex;align-items:center;gap:10px;max-width:min(82vw,480px);padding:9px 18px 9px 13px;background:linear-gradient(172deg,#F6F2E7,#E6DEC8);border:1px solid rgba(120,88,40,.55);border-left:4px solid var(--lapis);border-radius:3px;color:var(--ink);font-size:13px;letter-spacing:.06em;box-shadow:0 12px 28px rgba(0,0,0,.5);pointer-events:auto;animation:slipIn .46s var(--ease-spring) both}
.ink-slip.warn{border-left-color:var(--cinnabar)}
.ink-slip.gild{border-left-color:var(--gilt)}
.ink-slip .is-ico{width:17px;height:17px;flex:none;color:var(--lapis)}
.ink-slip.warn .is-ico{color:var(--cinnabar)}
.ink-slip.gild .is-ico{color:var(--gilt-dim)}
.ink-slip.hide{animation:slipOut .4s ease-in both}
@keyframes slipIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes slipOut{to{opacity:0;transform:translateY(-10px) scale(.97)}}

/* ============ 移动端 ============ */
@media (max-width:760px){
  .tome{width:100%;height:100dvh}
  .page{border-radius:0}
  .scroll{padding:14px 14px 18px}
  .folio-head,.folio-foot{padding-left:12px;padding-right:12px;font-size:10.5px}
  /* 移动端书签栏改为底部横排：必须重置桌面端新增的 max-height / bottom / overflow-y，
     否则横向底栏会被纵向 max-height 裁掉一行（正是「锁死」的移动端版本）。 */
  .thumb-tabs,.thumb-tabs-left{right:auto;left:0;top:auto;bottom:0;position:absolute;flex-direction:row;width:50%;gap:0;border-radius:0;background:linear-gradient(160deg,#241a12,#1a130d);border-top:1px solid rgba(201,174,109,.28);padding:6px 4px calc(6px + env(safe-area-inset-bottom));max-height:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:rgba(120,96,56,.42) transparent;position:absolute}
  .thumb-tabs-left{left:auto;right:0;border-left:none}
  
  .thumb-tabs .thumb-tab,.thumb-tabs-left .thumb-tab{border-radius:8px}
  .thumb-tab{flex:1;min-width:0;flex-direction:row;justify-content:center;Writing-mode:horizontal-tb;writing-mode:horizontal-tb;width:auto;border:none;border-radius:8px;padding:9px 2px;letter-spacing:.12em;background:transparent;box-shadow:none;color:#CBB98D}
  /* 触屏点按会粘住 :hover，移动端不给任何 hover 反馈，避免按钮突然变色 */
@media (hover:none){ .thumb-tab:hover{transform:none!important;background:transparent!important;box-shadow:none!important} }
  .thumb-tab.active{background:rgba(109,42,34,.7)}
  .thumb-tab svg{width:18px;height:18px}
  .thumb-tab span{display:none}
  .insert{top:auto;left:0;right:0;bottom:0;width:100%;max-height:82%;border-radius:14px 14px 0 0;transform:translateY(108%)}
  .leaf-handle{top:auto;bottom:64px;padding:9px 11px;font-size:11px}
  .leaf-handle .lh-text{display:none}
  .leaf-handle.prev{left:8px}.leaf-handle.next{right:8px}
  .choice-slip{font-size:13px;padding:11px 13px}
  .choice-slip .cs-tag{display:none}
  .prose p{font-size:15.5px}
  .cv-title{font-size:34px;letter-spacing:.22em;text-indent:.22em}
  .cv-latin{font-size:9.5px;letter-spacing:.36em;text-indent:.36em}
  .cv-line{width:32px}
  .cv-sub{letter-spacing:.38em;text-indent:.38em}
  .cv-seal{width:52px;height:52px}.cv-seal span{font-size:20px}
  .cv-colophon{font-size:8px}
  .cv-lozenge{width:min(230px,62%)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(138,112,64,.48),rgba(96,66,28,.42));border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(150,55,46,.55);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
.dw-range{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 8px}
.dw-list .dw-range:first-child,.insert-body .dw-range:first-child{margin-top:2px}
.dw-range-t{font-family:var(--font-serif);font-size:14.5px;font-weight:700;letter-spacing:.14em;color:var(--gilt-dim)}
.dw-range-n{font-family:var(--font-sans);font-size:11px;letter-spacing:.12em;color:var(--ink-faint)}
button.dw-slot{cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="ink-slips" role="status" aria-live="polite"></div>

<main id="stage">
  <div class="tome" id="tome">
    <article class="page" id="page-base" aria-label="魔典书页"></article>
    <nav class="thumb-tabs" id="thumb-tabs" aria-label="六大系统书签"></nav>
    <aside class="insert" id="insert" aria-label="系统插页"></aside>
    <aside class="endpaper" id="endpaper" aria-label="扉页 · 开场白"></aside>
    <section class="cover" id="cover" aria-label="魔典封面"></section>
  </div>

  <!-- 信笺 · 输入窗口（呈函入命运；入口为书缘蜡封书签，由书签构建脚本注入右缘栏） -->
  <aside id="letter" class="letter" aria-label="信笺输入窗">
    <div class="letter-paper">
      <div class="let-head"><span class="let-sign">呈函 · 入命运</span><button class="let-close" id="let-close" aria-label="收拢信笺"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <label class="let-to" for="modian-letter-body">自 <b id="let-from">无名旅人</b></label>
      <textarea id="modian-letter-body" rows="4" enterkeyhint="newline" placeholder="落笔吧——选项已为你誊入此笺（回车换行，写完点「寄出」）"></textarea>
      <div class="let-foot">
        <span class="let-count" id="let-count"></span>
        <button class="let-erase" id="let-clear">誊清</button>
        <button class="let-send" id="let-send"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="waxsend" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#B04A3E"/><stop offset="55%" stop-color="#96372E"/><stop offset="100%" stop-color="#6D231C"/></radialGradient></defs><path d="M60 8c14-3 30 4 36 14 8 2 14 12 12 22 6 8 4 20-2 26 2 12-8 22-18 24-4 10-18 16-28 12-10 4-24-2-28-12-12-2-20-14-18-24-8-8-6-22 2-28-2-10 6-20 16-22C46 12 52 10 60 8Z" fill="url(#waxsend)"/></svg><span>寄出</span></button>
      </div>
    </div>
  </aside>

  <!-- 卷轴 · 层目：楼层目录（由「目录」书签收放） -->
  <div id="toc-veil" class="toc-veil" aria-hidden="true"></div>
  <aside id="toc" class="toc" aria-label="卷轴层目">
    <div class="toc-paper">
      <div class="toc-head"><span class="toc-sign">卷轴 · 层目</span><button class="toc-close" id="toc-close" aria-label="合上目录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="toc-list" id="toc-list"></div>
    </div>
  </aside>
  <!-- 常驻全屏切换：页脚/插页里的按钮会随内容滚走或被收起，这里始终可点；再点一下即退出 -->
  <button id="fs-toggle" class="fs-toggle" aria-label="切换全屏" title="展卷 · 全屏"><span class="fs-icon"><i></i><i></i><i></i><i></i></span><span class="fs-t-label">全屏</span></button>
</main>



<script>
/* [合入] 魔典-主题切换.js — 克劳德卡顿优化与美化包 */
/* 魔典-主题切换 v1
 * 在魔典 iframe 内运行：给 <html> 打 data-mdx-theme（vellum 羊皮纸 / night 紫曜夜读），
 * 在书页左下角放一枚切换按钮，选择记在 localStorage（与酒馆同源，所有楼层与「旧楼收纳」卡片共享）。
 * 手动指定：加载前设 window.MODIAN_THEME_DEFAULT = 'night'（仅在玩家没选过时生效），
 * 或在控制台 / 其他脚本里调用 window.__modianTheme.set('night')。
 * 另含较量面板 d20 的滚骰动画（两套主题通用；系统「减少动态效果」时跳过）。
 */
(function () {
  'use strict';
  if (window.__modianTheme) return;
  var KEY = 'modian_theme_v1';
  var THEMES = { vellum: '羊皮纸', night: '紫曜夜读' };
  var root = document.documentElement;

  function store() {
    try { if (window.localStorage) return window.localStorage; } catch (e) {}
    try { return window.parent.localStorage; } catch (e) {}
    return null;
  }
  function saved() {
    var s = store(), v = null;

  var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 3.5v3M15.5 5h3"/></svg>';

    var m = text.match(/(\d+)(?!.*\d)/);
    if (!m) return;
    var v = parseInt(m[1], 10);

  // $('body').load() 会整体替换 body 内容，按钮被冲掉时补回

})();

 * 放在魔典内核 <script> 之前执行（dist 里插在 content-data.js 之前，或直接内联进「魔典-界面」正则）。
 * ① 长周期轮询（≥1s 的 setInterval）只在「当前那一本」里跑：最新 AI 楼层或伪全屏中，且 iframe 可见、标签页在前台。
 * ② parseFloor 按楼层原文缓存，楼层事件时只解析新增/改动的楼。
 * ③ iframe 滚出视口或标签页转入后台时暂停 CSS 动画；系统「减少动态效果」时循环动画只播一次。

      if (el.getAttribute('is_user') === 'true' || el.getAttribute('is_system') === 'true') continue;

<script>
/* ================================================================
   魔典 · 原型内核
   数据源：window.MODIAN_DATA（自动提取自卡）/ window.MODIAN_FLOORS
   ================================================================ */
'use strict';
const D = window.MODIAN_DATA || {};
/* ── 跨帧探测（全局版）──────────────────────────────
   魔典跑在「界面正则」提升出来的 iframe 里，酒馆助手的全局函数
   （getChatMessages / eventOn / getLastMessageId …）**只存在于父/顶层窗口**，
   本上下文里 `typeof eventOn === 'function'` 恒为 false。
   此处统一提供取帧顺序：本上下文 → parent → top；取到的函数一律 bind 回原帧，
   否则调用时 this 丢失会抛错。
   ⚠ 必须定义在 syncFloors / wireFloorEvents 之前（那两处早于 Stat 声明）。 */
function hostFrames(){
  const out = [];
  try{ out.push(window); }catch(e){}
  try{ if(window.parent && window.parent !== window) out.push(window.parent); }catch(e){}
  try{ if(window.top && window.top !== window) out.push(window.top); }catch(e){}
  return out;
}
/* 按名字跨帧取一个值（函数会 bind）。取不到返回 null。 */
function hostPick(name){
  for(const f of hostFrames()){
    try{
      const v = f[name];
      if(typeof v === 'function') return v.bind(f);
      if(v != null) return v;
    }catch(e){}
  }
  return null;
}

/* ── 楼层装配（真机接酒馆；裸跑吃演示数据） ──
   优先级：demo-floors.js 显式演示 > 真酒馆 getChatMessages 拉 AI 楼层 > 单封面零层。
   idx 即真实楼层号（事件回调据它定位；真机数据缺 is_user 字段时按奇偶数兜底） */
let FLOORS = (window.MODIAN_FLOORS || []).map((f,i)=>({idx:i,...f}));
function inTavern(){
  try{ return !!(window.parent && window.parent !== window); }catch(e){ return true; }
}
function syncFloors(){
  try{
    if(window.MODIAN_FLOORS) return;                 // 演示数据在场 → 永远用演示
    /* 跨帧取接口：iframe 里裸名恒为 undefined，直接 typeof 判会整条同步静默失效
       —— 表现是「生成新楼后魔典永远停在旧楼层」。 */
    const getChatMessages = hostPick('getChatMessages');
    const getLastMessageId  = hostPick('getLastMessageId');
    if(typeof getChatMessages!=='function' || typeof getLastMessageId!=='function') return;
    const n = getLastMessageId();
    if(typeof n!=='number' || Number.isNaN(n) || n < 0) return;
    const msgs = getChatMessages('0-' + n) || [];
    const list = [];
    for(const m of msgs){
      if(!m || typeof m.message!=='string') continue;
      if(m.is_system) continue;                      // 隐藏楼层不进书
      if(m.role && m.role!=='assistant') continue;   // 有 role 字段只收 AI 层
      if(!m.role){
        if(m.is_user===true) continue;
        if(typeof m.mesid==='number' ? m.mesid%2===1 : (m.id!=null && m.id%2===1)) continue;  // 兜底奇偶
      }
      list.push({ idx: typeof m.message_id==='number' ? m.message_id : (typeof m.mesid==='number'?m.mesid:list.length), label:'' , raw: m.message });
    }
    if(!list.length){ FLOORS = [{ idx:0, label:'封面 · 扉页', raw:'<start>\n'+(D.firstMesText||'')+'\n</start>' }]; return; }
    FLOORS = list;
    for(let i=0;i<FLOORS.length;i++){
      const lbl = (()=>{ try{ return parseFloor(FLOORS[i].raw).header || ''; }catch(e){ return ''; } })();
      FLOORS[i].label = lbl || (i===0 ? '封面 · 扉页' : '');
    }
  }catch(e){ console.warn('[魔典] 楼层拉取失败，沿用现有数据', e); }
}
function isFollowingLatest(){
  if(stage==='cover' || stage==='reading') return true;
  if(stage==='endpaper' && FLOORS.length>1) return true;
  // 仪典/待章期也算跟随：开局定稿寄出后 AI 生成的新楼必须自动翻过去，
  // 否则用户永远停在封面/仪典，看不到第一幕。
  if(stage==='ritual' || stage==='awaiting') return true;
  return false;
}
/* 是否存在真实 AI 楼层？syncFloors 的「封面·扉页」占位不算 */
function hasRealFloor(){
  // raw 可能为 undefined（酒馆消息体异常）——parseFloor 已兜底空串，这里再兜一层不抛
  return FLOORS.some(f=>{ try{ return !parseFloor(f.raw).cover; }catch(e){ return false; } });
}
function refetchAndFollow(){
  const before = FLOORS.length, beforeLast = before ? FLOORS[before-1].idx : -1;
  syncFloors();
  if(!FLOORS.length) return;
  // ⚠ 顺序修复：变量刷新必须在「有没有真实楼层」判定之**前**。
  //   原实现把 refreshStatsUI() 放在 hasRealFloor() 早退之后，于是只要聊天里
  //   还没有真实 AI 楼层（正停在第零层/封面），任何楼层事件都不会触发变量刷新——
  //   用户看到的正是「不换楼层就看不到 MVU 变化」。
  refreshStatsUI();   // 对齐幻璃镜：任何楼层事件（新楼/改楼/换聊天）都算数，变量跟着最新楼刷新
  // 只有封面占位而无真实楼层：保持现状，等新楼到达（否则会对着封面页反复重渲）
  if(!hasRealFloor()) return;
  const last = FLOORS[FLOORS.length-1];
  const samePage = stage==='reading' && FLOORS.length===before && last.idx===beforeLast;
  // 同页内容更新（流式/本楼改）→ dir 0 静默重渲；新楼到达或跟随态 → 翻至末页
  if(samePage) showFloor(cur, 0);
  else if(isFollowingLatest() || FLOORS.length!==before) showFloor(FLOORS.length-1, 1);
}

/* 变量刷新统一出口：MVU 事件与楼层事件都导向这里。
   读：Stat.sync 重拉（最新楼级优先）；写：打开的插页重渲 + 阅读中天头就地重刷。 */
function refreshStatsUI(){
  try{
    Promise.resolve(Stat.sync()).then(()=>{
      if(insertOpen) openInsert(insertOpen);
      const h = pageBase.querySelector('.folio-head');
      if(h && stage==='reading' && FLOORS[cur]) h.innerHTML = worldHeader(FLOORS[cur].idx);
    });
  }catch(e){}
}
/* 楼层事件生命周期（照幻璃镜 GameContext 极简版：新楼/改楼/换聊天 → 重拉并追最新） */
(function wireFloorEvents(){
  let t = 0;
  const bump = ()=>{ clearTimeout(t); t = setTimeout(refetchAndFollow, 160); };
  /* ⚠ 跨帧：iframe 里裸 `eventOn` / `window.tavern_events` 恒不存在，
     原实现整段被 `typeof eventOn==='function'` 短路 → 四个楼层事件一个都没订阅上，
     于是生成新楼后既不翻页也不刷变量。现统一走 hostPick 逐帧取，并逐帧绑事件源。 */
  for(const f of hostFrames()){
    try{
      const eOn = f.eventOn;
      if(typeof eOn !== 'function') continue;
      const te = f.tavern_events;
      if(te){
        for(const key of ['MESSAGE_RECEIVED','MESSAGE_UPDATED','CHAT_CHANGED','MESSAGE_SWIPED']){
          const name = te[key];
          if(typeof name === 'string') eOn.call(f, name, bump);
        }
      }
      const ie = f.iframe_events;
      if(ie && typeof ie.GENERATION_ENDED === 'string') eOn.call(f, ie.GENERATION_ENDED, ()=> setTimeout(bump, 200));
    }catch(e){}
  }
  // 真机里若无演示数据：拉一次作为起点（裸跑 MODIAN_FLOORS 恒在场，此步恒跳过 demo 态）
  if(!window.MODIAN_FLOORS && inTavern()) syncFloors();
})();

/* ================================================================
   Stat 数据桥 · 六模块唯一数据口
   三级降级：MVU 实况 → 聊天变量 → 初始档案（明示来源，绝不装实况）
   ================================================================ */
/* ═══════════════════════════════════════════════════════════════
   立契 NPC · 世界书写入层
   按 NPC 生成规则拼装条目正文；绿灯（selective）+ 角色定义后 + 双向禁递归。
   契约对齐幻璃镜 clueWorldbook：getOrCreateChatWorldbook / updateWorldbookWith /
   deleteWorldbookEntries。
   ⚠ iframe 适配：魔典跑在界面正则提升的 iframe 里，酒馆助手全局未必在本上下文，

   ═══════════════════════════════════════════════════════════════ */
const NpcForge = (()=>{
  const PREFIX = '';                   // 条目名 = NPC 姓名本身（不加项目前缀，AI 侧更自然）
  /* 用户定：NPC 生成表单「用过即抛」——不跨会话保留。

  /* 生成规则的四个维度选项（玩家勾选，AI 依此展开个体） */
  const OPTS = {
    外貌: ['种族特征为底','清丽出挑','英气飒爽','娇小玲珑','成熟妩媚','伤痕累累','异族特征明显'],
    性格: ['种族倾向为底','温顺依赖','高傲冷淡','活泼跳脱','沉静内敛','狡黠危险','疯批执着'],
    实力: ['种族基准','初出茅庐','久经沙场','一方强者','深藏不露','威名远播'],
    初始态度: ['依情境而定','一见倾心','戒备疏离','桀骜不驯','主动讨好','敌意明显','懵懂无觉'],
  };

  function fresh(){
    return {
      name:'', race:'', tier:'', gender:'人类女性',
      // 四个可手填维度；空 = 交由 AI 依生成规则补全
      look:'', age:'', persona:'', attitude:'', bg:'', note:'',
      keys:[], keyInput:'', husband:false, created:[],
      // UI 状态：三级树展开路径与 AI 补全忙碌标记
      ui:{ openCat:'', openFam:'', busy:{} },
    };

  let S = fresh();
  try{ localStorage.removeItem(KEY); }catch(e){}   // 一次性表单：上次内容一律不留
  const save = ()=>{};   // 会话内不落盘（表单状态仅存内存）

  function frames(){ return hostFrames(); }

    for(const f of frames()){

  }

  }
  /* —— 种族索引：卡内世界书三级树（大类 → 科属 → 种族），只读不可自定义 —— */
  const DEx = window.MODIAN_DEX || { cats:[] };

  /* 把 85 个科属归并进 28 个大类；无 family 的种族归「未分科属」 */
  const raceIndex = (()=>{
    const out = [];
    for(const c of (DEx.cats||[])){
