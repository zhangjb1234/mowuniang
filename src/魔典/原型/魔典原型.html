        const fam = r.family || r.family2 || '未分科属';
        if(!fams.has(fam)) fams.set(fam, []);
        fams.get(fam).push(r);
      }
      out.push({
        name: c.name,
        count: c.count || (c.races||[]).length,
        fams: [...fams.entries()].map(([fn, rs])=>({ name:fn, races:rs })),
      });
    }
    return out;
  })();
  const totalRaces = raceIndex.reduce((s,c)=>s+c.fams.reduce((a,f)=>a+f.races.length,0),0);

  /* 当前所选种族对象（供 AI 补全取素材） */
  function raceOf(name){
    for(const c of raceIndex) for(const f of c.fams) for(const r of f.races)
      if(r.name === name) return { ...r, cat:c.name, fam:f.name };
    return null;
  }

  /* —— 条目正文：按 NPC 生成规则拼装 —— */
  const DIMS = [
    { k:'look',     lab:'外貌',     rule:'基于种族特征 + 个体差异' },
    { k:'persona',  lab:'性格',     rule:'基于种族倾向 + 随机个性' },
    { k:'attitude', lab:'初始态度', rule:'基于种族性格 + 当前情境 + 玩家阵营声望' },
    { k:'bg',       lab:'经历',     rule:'基于种族习性与当前世界局势，补一段可信的过往' },
  ];
  /* 性别：三档固定 + 自定义（__custom__ 哨兵 = 选中自定义但尚未输入文字） */
  const GENDERS = ['人类女性', '人类男性', '魔物娘'];
  function genderText(){
    if(GENDERS.includes(S.gender)) return S.gender;
    return (S.gender && S.gender !== '__custom__') ? S.gender : '';
  }
  function buildContent(){
    const L = [];
    L.push(S.name);
    if(S.race) L.push('种族：' + S.race);
    if(genderText()) L.push('性别：' + genderText());
    if(S.age) L.push('年龄：' + S.age.trim());
    const r = raceOf(S.race);
    if(r){
      L.push('所属：' + r.cat + ' · ' + r.fam);
      if(r.habitat) L.push('栖息地：' + r.habitat);
    }
    if(S.tier) L.push('实力：' + S.tier);
    for(const d of DIMS){ const v = String(S[d.k]||'').trim(); if(v) L.push(d.lab + '：' + v); }
    if(S.note) L.push(S.note.trim());
    return L.join('\n');
  }
  /* —— 世界书条目规格：绿灯 / 角色定义后 / 双向禁递归 —— */
  function entryTemplate(keys){
    return {
      enabled: true,
      strategy: {
        type: 'selective',
        keys,
        keys_secondary: { logic: 'and_any', keys: [] },
        scan_depth: 'same_as_global',
      },
      position: { type: 'after_char', role: 'system', depth: 0, order: 10030 },
      probability: 100,
      recursion: { prevent_incoming: true, prevent_outgoing: true, delay_until: null },
    };
  }
  const entryName = (n)=> PREFIX + n;
  const cleanKeys = ()=> S.keys.map(k=>String(k).trim()).filter(Boolean);

  /* —— AI 补全：单维度静默生成（走酒馆助手 generate，不落楼） —— */
  function aiContext(){
    const r = raceOf(S.race);
    const bits = [];
    if(S.name.trim()) bits.push('姓名：' + S.name.trim());
    if(genderText()) bits.push('性别：' + genderText());
    if(S.race.trim()) bits.push('种族：' + S.race.trim());
    if(r){ bits.push('所属谱系：' + r.cat + ' · ' + r.fam + (r.habitat ? ('（栖息地：' + r.habitat + '）') : '')); }
    if(String(S.age).trim()) bits.push('年龄：' + String(S.age).trim());
    if(S.tier) bits.push('实力：' + S.tier);
    if(String(S.note||'').trim()) bits.push('额外线索：' + String(S.note).trim());
    for(const d of DIMS){ const v = String(S[d.k]||'').trim(); if(v) bits.push(d.lab + '（已定）：' + v); }
    return bits.join('\n');
  }
  async function aiFill(dim){
    const dimDef = DIMS.find(x=>x.k===dim);
    if(!dimDef) return { ok:false, msg:'未知的补全维度。' };
    /* ⚠ 只走 generateRaw，绝不退回 generate。
       generate = 正文生成路径：会把主预设、思维链、聊天历史全卷进来，
       实测会把一段剧情正文灌进「外貌」栏（比不调用更糟）。
       generateRaw = 自带 ordered_prompts 的隔离调用，才是补全该用的那条。
       权威签名：JS-Slash-Runner @types/function/generate.d.ts
       （同仓已验证写法：幻璃镜 src/utils/subApi.ts、租借男友 src/utils/phone/subAi.ts）*/
    const gen = api('generateRaw');
    if(!gen) return { ok:false, msg:'未取得 generateRaw（静默生成接口）。已刻意不退回 generate——那是正文生成路径，会把剧情正文灌进本栏。请确认酒馆助手已启用且版本较新。' };
    if(!S.name.trim() && !S.race.trim()) return { ok:false, msg:'至少先定名或选个种族，AI 才有落笔的根据。' };
    S.ui.busy[dim] = true; save(); if(insertOpen) openInsert(insertOpen);
    try{
      const prompt = [
        '你在为《魔物娘图鉴世界》角色卡的「立契 NPC」补全人设。以下是目前已知的角色信息：',
        aiContext(),
        '',
        '任务：只写「' + dimDef.lab + '」这一项（规则：' + dimDef.rule + '）。',
        '要求：贴合魔物娘图鉴世界观；直接输出正文，60~120字；不要标题、引号、列表或任何解释；使用中文。'
      ].join('\n');
      const raw = await gen({
        user_input: prompt,
        ordered_prompts: [
          { role:'system', content:'你是《魔物娘图鉴世界》角色卡的 NPC 设定助手。直接输出被要求的设定文本，不要任何标题、引号、列表、思维链或解释。' },
          'user_input',
        ],
        // 补全是独立小任务，绝不能带聊天历史——否则主对话的人设/剧情会污染这一栏
        max_chat_history: 0,
        should_stream:false, should_silence:true,
      });
      /* 容错：默认返回字符串，若返回详情对象则取 content */
      let txt = (typeof raw === 'string') ? raw.trim() : (raw && typeof raw.content === 'string' ? raw.content.trim() : '');
      if(!txt) throw new Error('AI 返回为空（' + (typeof raw === 'object' && raw ? '对象:' + Object.keys(raw).join('/') : typeof raw) + '）');
      txt = txt.replace(/^["“”「『]+|["“”」』]+$/g, '').trim();
      if(!txt) throw new Error('AI 返回为空');
      S[dim] = txt.slice(0, 400);
      save();
      return { ok:true, msg: dimDef.lab + '已由 AI 拟定，可再手改。' };
    }catch(e){
      return { ok:false, msg:'AI 补全失败：' + ((e && e.message) || e) };
    }finally{
      S.ui.busy[dim] = false; save(); if(insertOpen) openInsert(insertOpen);
    }
  }

  /* 校验：{ok:false,msg} 或 {ok:true,keys} */
  function validate(){
    if(!S.name.trim()) return { ok:false, msg:'请先为这位角色定名。' };
    if(!S.race.trim()) return { ok:false, msg:'请填写种族（或写「未定」交由 AI 拟定）。' };
    const ks = cleanKeys();
    if(!ks.length) return { ok:false, msg:'至少需要一个触发关键词——AI 靠它在正文里认出这位角色。' };
    return { ok:true, keys:ks };
  }

  /* 写入：同名条目已存在则拒绝并提示（用户指定口径，不覆盖） */
  async function commit(){
    const v = validate();
    if(!v.ok) return { ok:false, msg:v.msg };
    const wbName = await ensureWB();
    if(!wbName) return { ok:false, msg:'未接入酒馆助手世界书接口（当前环境非酒馆），条目未写入。' };
    const updateFn = api('updateWorldbookWith');
    if(!updateFn) return { ok:false, msg:'未取得世界书写入接口，条目未写入。' };
    const name = entryName(S.name.trim());
    const content = buildContent();
    try{
      let clash = null;
      await updateFn(wbName, (wb)=>{
        const hit = (wb||[]).find(e=>e && e.name === name);
        if(hit){ clash = name; return wb; }
        return [...(wb||[]), { name, content, ...entryTemplate(v.keys) }];
      });
      if(clash) return { ok:false, msg:`世界书里已存在同名条目「${clash}」，未覆盖。改名或先除去旧条。` };
      const kept = S.created;
      S.created.unshift({ name:S.name.trim(), keys:v.keys });
      save();
      /* 用户定：NPC 生成「用过即抛」—— 立契成功后表单内容立即清空，
         不留姓名/种族/四维/触发词，下次进来是空白一张。
         created 立契名录是本次会话内的回执，保留（不落盘）。 */
      const done = S.name.trim();
      S = fresh();
      S.created = kept;
      return { ok:true, msg:`已立契：${done}（绿灯 · 角色定义后 · 双向禁递归）· 表单已清空` };
    }catch(e){
      console.warn('[魔典] 立契写入失败', e);
      return { ok:false, msg:'写入世界书失败：' + ((e && e.message) || e) };
    }
  }

  async function removeOne(npcName){
    const wbName = await ensureWB();
    if(!wbName) return { ok:false, msg:'未接入酒馆助手世界书接口。' };
    const delFn = api('deleteWorldbookEntries');
    if(!delFn) return { ok:false, msg:'未取得世界书删除接口。' };
    try{
      await delFn(wbName, e=> e && e.name === entryName(npcName));
      S.created = S.created.filter(x=>x.name !== npcName);
      save();
      return { ok:true, msg:`已除去：${npcName}` };
    }catch(e){
      return { ok:false, msg:'删除失败：' + ((e && e.message) || e) };
    }
  }
/* —— 渲染：左种族树 / 右档案卡 —— */
  function raceTree(){
    const sel = S.race;
    const cOpen = S.ui.openCat, fOpen = S.ui.openFam;
    const catRow = (c)=>{
      const on = cOpen === c.name;
      return `<button type="button" class="nrt-cat${on?' open':''}" data-nf-cat="${esc(c.name)}">
        <span class="nrt-arrow">${on?'▾':'▸'}</span>
        <span class="nrt-cname">${esc(c.name)}</span>
        <span class="nrt-ccount">${c.fams.reduce((a,f)=>a+f.races.length,0)}</span>
      </button>
      ${on ? `<div class="nrt-fams">${c.fams.map(f=>{
        const fo = fOpen === c.name + '||' + f.name;
        return `<div class="nrt-famwrap">
          <button type="button" class="nrt-fam${fo?' open':''}" data-nf-fam="${esc(c.name)}||${esc(f.name)}">
            <span class="nrt-arrow">${fo?'▾':'▸'}</span><span class="nrt-fname">${esc(f.name)}</span>
            <span class="nrt-ccount">${f.races.length}</span>
          </button>
          ${fo ? `<div class="nrt-races">${f.races.map(r=>
            `<button type="button" class="nrt-race${sel===r.name?' on':''}" data-nf-race="${esc(r.name)}" title="${esc((r.intro||r.feat||'').slice(0,120))}">${esc(r.name)}</button>`).join('')}</div>` : ''}
        </div>`;
      }).join('')}</div>` : ''}`;
    };
    return `<div class="nrt">
      <div class="nrt-bar"><input type="text" data-nf="raceQ" value="${esc(S.raceQ||'')}" placeholder="检索种族 / 科属 / 大类……"></div>
      <div class="nrt-hint">${S.race?`已择 <b>${esc(S.race)}</b>`:`共 ${raceIndex.length} 大类 · ${totalRaces} 种，逐一展开挑选`}</div>
      <div class="nrt-tree">${filterCats(catRow)}</div>
    </div>`;
  }
  /* 检索过滤：不匹配的大类/科属整体隐去 */
  function filterCats(renderRow){
    const q = (S.raceQ||'').trim().toLowerCase();
    if(!q) return raceIndex.map(renderRow).join('');
    const keep = [];
    for(const c of raceIndex){
      const catHit = c.name.toLowerCase().includes(q);
      const fams = c.fams.filter(f => catHit || f.name.toLowerCase().includes(q) ||
        f.races.some(r=>r.name.toLowerCase().includes(q)));
      if(fams.length) keep.push({ c, fams });
    }
    if(!keep.length) return `<div class="nf-hint">无匹配种族。</div>`;
    return keep.map(({c,fams})=>renderRow({ ...c, fams })).join('');
  }
  function dimCard(d){

        <button type="button" class="nf-ai" data-nf-ai="${d.k}" ${busy?'disabled':''}>${busy?'推演中…':'✦ AI 补全'}</button></div>
      <textarea data-nf="${d.k}" placeholder="留空则由 AI 按规则拟定；点 ✦ 让它先写一版">${esc(S[d.k])}</textarea>
    </div>`;
  }

    const v = validate();

      `<div class="nf-row"><div class="nr-main">
         <div class="nr-name"><span class="nf-lamp green"></span>${esc(c.name)}</div>
         <div class="nr-keys">${esc(c.race||'')}${c.tier?' · '+esc(c.tier):''}　关键词：${esc(c.keys.join(' / '))}</div>
       </div><button type="button" class="nr-del" data-nf-del="${esc(c.name)}">除去</button></div>`
    ).join('') : emptyNote('尚未立契——下方落印即写入本局聊天世界书。');
    return `

        </div>
        <div class="nf-col-r">
          <div class="nf-f"><label>姓名<input type="text" data-nf="name" value="${esc(S.name)}" placeholder="她叫什么"></label></div>
          <div class="nf-2col">
            <div class="nf-f"><label>性别<select data-nf-sel="gender">${GENDERS.map(x=>`<option${S.gender===x?' selected':''}>${x}</option>`).join('')}<option${GENDERS.includes(S.gender)?'':' selected'} value="__custom__">自定义</option></select></label></div>
            ${GENDERS.includes(S.gender)?'':`<div class="nf-f"><label>自定义性别<input type="text" data-nf="gender" value="${esc(S.gender==='__custom__'?'':S.gender)}" placeholder="例：半魔化男子 / 无性别 / 双生体……"></label></div>`}
            <div class="nf-f"><label>实力阶层<select data-nf-sel="tier">
              <option value="">（未定 · 由 AI 依种族基准拟定）</option>
              ${TIER_NAMES.map(t=>`<option${S.tier===t?' selected':''}>${esc(t)}</option>`).join('')}
            </select></label></div>
          </div>
          ${DIMS.map(dimCard).join('')}
          <div class="nf-dim">
            <div class="nf-dhead"><span class="nf-dlab">年龄</span><span class="nf-drul">按种族寿命与个体差异</span></div>
            <input type="text" data-nf="age" value="${esc(S.age)}" placeholder="留空由 AI 拟定">
          </div>
        </div>
      </div>
      <div class="nf-sec">
        <div class="nf-lab">补笔 <em>选填 · 写给 AI 的额外线索</em></div>
          <div class="nf-f"><label>备注<textarea data-nf="note" placeholder="其他需要 AI 遵守的事">${esc(S.note)}</textarea></label></div>
        </div>
        <div class="nf-chips" style="margin-top:8px">
          <button type="button" class="nf-chip${S.husband?' on':''}" data-nf-husb>认定为丈夫 · 身心完全专属</button>
        </div>
        ${S.husband?'<p class="nf-hint">已锁定铁律：该 NPC 一旦被认定为丈夫，身心完全专属于玩家，AI 不得使其移情或离开。</p>':''}
      </div>
      <div class="nf-sec">

        </div>

        <div class="nf-act">

  }

  /* 关键词提交：单一入口。
     手机没有回车键，所以四条路都接到这里：
     ① 点「＋」按钮  ② 回车  ③ 失焦  ④ 输入逗号/顿号即分隔多词 */
  function addKeys(raw, quiet){
    const parts = String(raw||'')
      .split(/[,，、;；\s]+/)
      .map(s=>s.trim())
      .filter(Boolean);
    if(!parts.length) return 0;
    let added = 0, dup = 0;
    for(const p of parts){
      if(S.keys.indexOf(p) < 0){ S.keys.push(p); added++; } else dup++;
    }
    S.keyInput = ''; save();
    if(insertOpen) openInsert(insertOpen);
    if(dup && !quiet) notify('其中 '+dup+' 个关键词已在列。','warn',2600);
    return added;
  }
  /* 「＋」按钮的可用态：空输入时禁用，避免点了没反应 */
  function syncKeyAddBtn(root){
    const btn = root.querySelector('#nf-keyadd');
    const inp = root.querySelector('[data-nf="keyInput"]');
    if(btn && inp) btn.disabled = !inp.value.trim();
  }

  /* —— 绑定 —— */
  function bind(root){
    root.querySelectorAll('[data-nf]').forEach(el=>{
      const k = el.dataset.nf;
      if(k === 'keyInput'){
        // 提交口径统一到 addKeys：按钮 / 回车 / 失焦 / 分隔符 都走它
        // 回车在触屏上=换行（手机要能分段写多个关键词），在桌面指针设备上=提交。
        // 触屏提交只走「＋」按钮与失焦，不劫持回车。
        const touch = matchMedia("(hover:none)").matches || ("ontouchstart" in window && navigator.maxTouchPoints > 0);
        el.addEventListener("keydown", (e)=>{
          if(e.key === "Enter" && !touch){ e.preventDefault(); addKeys(el.value); }
          if(e.key === "," || e.key === "\uff0c" || e.key === "\u3001"){ e.preventDefault(); addKeys(el.value); }
        });
        el.addEventListener("blur", ()=>{ setTimeout(()=>{ if(document.activeElement && document.activeElement.id === "nf-keyadd") return; addKeys(el.value, true); }, 120); });
        el.addEventListener("input", ()=>{ S.keyInput = el.value; save(); syncKeyAddBtn(root); });
      }else{
        el.addEventListener('input', ()=>{ S[k] = el.value; save(); });
      }
    });
// 检索框：只重渲不丢焦点；输入法组词期间不重绘，compositionend 再刷新
    const rq = root.querySelector('[data-nf="raceQ"]');
    if(rq){
      rq.addEventListener('input', (e)=>{ S.raceQ = rq.value; if(e.isComposing) return; reraceKeepFocus(rq); });
      rq.addEventListener('compositionend', ()=>{ S.raceQ = rq.value; reraceKeepFocus(rq); });
    }
    // 三级树：大类
    root.querySelectorAll('[data-nf-cat]').forEach(b=>b.addEventListener('click', ()=>{
      S.ui.openCat = (S.ui.openCat === b.dataset.nfCat) ? '' : b.dataset.nfCat;
      S.ui.openFam = '';
      if(insertOpen) openInsert(insertOpen);
    }));
    // 三级树：科属
    root.querySelectorAll('[data-nf-fam]').forEach(b=>b.addEventListener('click', ()=>{
      const k = b.dataset.nfFam;
      S.ui.openFam = (S.ui.openFam === k) ? '' : k;
      if(insertOpen) openInsert(insertOpen);
    }));
    // 三级树：种族（只可选，不可自定义）

const Stat = (()=>{
  let stat = null, source = 'defaults';
  const FRAME = ()=> (window.MODIAN_DATA && window.MODIAN_DATA.schemaDefaults) || {};
  /* ⚠ 跨帧探测（关键修复）：魔典跑在界面正则提升的 iframe 里，酒馆助手的
     window.Mvu / getVariables / waitGlobalInitialized 未必注入在本上下文。
     此前 Stat 只查 window.*，真机上大概率永远取不到 → 静默落到 defaults，
     用户看到的就是「变量永远不更新」。此处照 NpcForge.frames() 的同款纪律
     逐帧探测：本上下文 → parent → top，并对 function 做 bind（否则 this 丢失）。 */
  function frames(){ return hostFrames(); }
  function pick(name){
    for(const f of frames()){
      try{
        const v = f[name];
        if(typeof v === 'function') return v.bind(f);
        if(v != null) return v;
      }catch(e){}
    }
    return null;
  }
  const MvuOf = ()=> pick('Mvu');
  const getVariablesOf = ()=> pick('getVariables');
  const getAllVarsOf = ()=> pick('getAllVariables');   /* 254 卡首选通道 */
  const waitGlobalOf = ()=> pick('waitGlobalInitialized');
  /* ⚠ 就绪探测的**负结果**必须缓存。
     sync() 现在调得很勤（每次开插页、每次变量事件、每 4s 轮询都会打进来），
     而 ensureMvu 在 Mvu 缺席时会把 waitGlobalInitialized 竞速**等满** timeoutMs。
     不缓存的话，浏览器裸跑 / 未装 MVU 的环境里每开一次插页都要白等 2.5 秒，
     插页会肉眼可见地卡一下 —— 那是我这次改动引入的回归，不能留。
     正结果永久缓存（Mvu 一旦装载就不会再消失）；负结果按 TTL 短暂缓存，
     保证「脚本晚于魔典加载」这种常见时序仍能在 TTL 后被重新探到。 */
  let mvuReady = false, mvuMissAt = 0;
  const MVU_MISS_TTL = 8000;
  async function ensureMvu(timeoutMs){
    const probe = ()=>{ const m = MvuOf(); return !!(m && typeof m.getMvuData === 'function'); };
    if(mvuReady) return true;
    const m0 = MvuOf();
    if(m0 && typeof m0.getMvuData === 'function'){ mvuReady = true; return true; }
    // 负结果刚发生过：不再空等，直接用当前探测结果作答
    if(Date.now() - mvuMissAt < MVU_MISS_TTL) return false;
    try{
      const wait = waitGlobalOf();
      if(typeof wait === 'function'){
        await Promise.race([
          wait('Mvu'),
          new Promise(r=>setTimeout(r, timeoutMs||6000)),
        ]);
      }
    }catch(e){}
    const ok = probe();
    if(ok) mvuReady = true; else mvuMissAt = Date.now();
    return ok;
  }
  async function sync(){
    // 读取顺序对齐 254 卡《MGE状态栏》的 getStat() 四级探测（该卡已在真机验证）：
    //   ① Mvu.getMvuData({type:'message', message_id:'latest'})（MVU 最新楼层）
    //   ② getAllVariables()（酒馆助手变量 API，最快最稳）
    //   ③ 跨帧 TavernHelper / Mvu
    //   ④ chatMetadata.variables.stat_data（MVU 落点之一）
    //   ⑤ schemaDefaults（明示兜底）
    // ⚠ 顺序铁律：**楼层级必须排在聊天级之前**。
    //   病灶（用户报「总览不跟最新楼层」）：原实现把 getAllVariables() 放在第一位并
    //   `return` 掉了。而 getAllVariables() 拿的是**聊天级** stat_data —— 那是变量「曾经」
    //   落过盘的快照，不随每一楼实时推进。只要它返回了非空对象（几乎总是），
    //   第二级那条真正的 latest 楼层读取就永远执行不到，总览/行囊/图鉴于是集体停在旧值。
    //   MVU 的权威语义（galgame-core/mvu/mvuCore.ts 的 readStatData）也是「楼层级优先，
    //   读不到才回退聊天级」——这里与它对齐。
    //   另：getAllVariables() / getVariables() 返回的是 Promise，须 await，否则 adopt
    //   拿到的是 Promise 对象（Object.keys 恒为空）→ 白判一次 false。
    const adopt = (sm, src)=>{ if(sm && typeof sm==='object' && !Array.isArray(sm) && Object.keys(sm).length){ stat = sm; source = src; return true; } return false; };
    // 第一级：MVU 最新楼层（幻璃镜同款：总览/行囊永远跟着最新一落走）
    try{
      if(await ensureMvu(2500)){
        const mvu = MvuOf();
        const dm = mvu.getMvuData({type:'message', message_id:'latest'});
        if(adopt(dm && dm.stat_data ? dm.stat_data : dm, 'mvu-latest')) return;
        const d = mvu.getMvuData({type:'chat'});
        if(adopt(d && d.stat_data ? d.stat_data : d, 'mvu')) return;
      }
    }catch(e){ statWarnOnce(); /* 落级 */ }
    // 第二级：聊天变量 API
    try{
      const av = getAllVarsOf();
      if(typeof av === 'function'){
        const v = await av();
        if(adopt(v && v.stat_data ? v.stat_data : v, 'allvars')) return;
      }
    }catch(e){}
    // 第三级：跨帧
    for(const f of frames()){
      try{
        const th = f.TavernHelper;
        if(th && typeof th.getAllVariables === 'function'){
          const v = await th.getAllVariables();
          if(adopt(v && v.stat_data ? v.stat_data : v, 'allvars-frame')) return;
        }
      }catch(e){}
    }
    // 第四级：聊天变量
    try{
      const gv = getVariablesOf();
      if(typeof gv === 'function'){
        const v = await gv({type:'chat'});
        if(adopt(v && v.stat_data ? v.stat_data : v, 'chat')) return;
      }
    }catch(e){}
    // 第五级：SillyTavern chatMetadata（MVU 的另一处落点）
    try{
      for(const f of frames()){
        const ctx = f.SillyTavern && f.SillyTavern.getContext && f.SillyTavern.getContext();
        const meta = ctx && (ctx.chatMetadata || ctx.chat_metadata);
        if(meta && meta.variables){
          if(adopt(meta.variables.stat_data ? meta.variables.stat_data : meta.variables, 'chatmeta')) return;
        }
      }
    }catch(e){}
    // 末级：初始档案（明示）
    stat = FRAME(); source = 'defaults';
  }
  function get(path, fb){
    let o = stat;
    for(const k of String(path).split('.')){
      o = (o && typeof o==='object') ? o[k] : undefined;
      if(o === undefined) break;
    }
    return (o === undefined || o === null) ? fb : o;
  }
  /* 楼层级读取（幻璃镜同款语义：看哪一楼，显示那一楼落盘时的世界状态）。
     第一级 Mvu.getMvuData({type:'message', message_id}) → 第二级聊天级缓存 get()。 */
  function getFloor(path, messageId, fb){
    try{
      const mvu = MvuOf();
      if(mvu && typeof mvu.getMvuData === 'function' && messageId != null){
        const d = mvu.getMvuData({type:'message', message_id: messageId});
        const sd = (d && d.stat_data) ? d.stat_data : d;
        if(sd && typeof sd === 'object'){
          let o = sd;
          for(const k of String(path).split('.')){ o = (o && typeof o==='object') ? o[k] : undefined; if(o === undefined) break; }
          if(o !== undefined && o !== null) return o;
        }
      }
    }catch(e){}
    return get(path, fb);
  }
  return { sync, get, getFloor, frames, pick, get source(){ return source; } };
})();
let __statWarned = false;
function statWarnOnce(){
  if(__statWarned) return; __statWarned = true;

/* MVU 变量更新 → 与楼层事件共用同一出口（刷新面照幻璃镜抄全）
   ⚠ 三处修复（用户报「不退出全屏就看不到最新 MVU」）：
   ① 事件名真身是 Mvu.events.VARIABLE_UPDATE_ENDED（见 common/galgame-core/mvu/mvuCore.ts
      的 onVariableUpdateEnded），此前只认 window.tavern_events.VARIABLE_UPDATE_ENDED，
      真机上取不到 → 订阅从未成立。三个来源全查并去重。
   ② eventOn 走跨帧探测（iframe 里本上下文未必有酒馆助手全局）。
   ③ 生成结束也兜底刷一次：MVU 落盘与楼层事件存在时序差。 */
function wireOneEvent(evtName, cb){
  if(!evtName || typeof evtName !== 'string') return false;
  let ok = false;
  for(const f of Stat.frames()){
    try{
      const eOn = f.eventOn;
      if(typeof eOn === 'function'){ eOn.call(f, evtName, cb); ok = true; }
    }catch(e){}
  }
  return ok;
}
(async function wireStatEvents(){
  const names = [];
  try{ const mvu = Stat.pick('Mvu'); if(mvu && mvu.events && mvu.events.VARIABLE_UPDATE_ENDED) names.push(mvu.events.VARIABLE_UPDATE_ENDED); }catch(e){}
  try{ const te = Stat.pick('tavern_events'); if(te && te.VARIABLE_UPDATE_ENDED) names.push(te.VARIABLE_UPDATE_ENDED); }catch(e){}
  names.push('mag_variable_updated');
  [...new Set(names)].forEach(n=>wireOneEvent(n, refreshStatsUI));
  // 收账时序兜底：变量事件可能早于/晚于楼层落地，两端各补一刀
  try{
    const ie = Stat.pick('iframe_events');
    if(ie && ie.GENERATION_ENDED) wireOneEvent(ie.GENERATION_ENDED, ()=> setTimeout(refreshStatsUI, 260));
  }catch(e){}
  await Stat.sync();
  // 定时兜底：MVU 缺席或事件面不全时，靠轮询也能看到最新（读命中即退出，不空转）
  let lastSig = '';
  setInterval(()=>{
    if(document.hidden) return;
    const s = Stat.source;   // getter 属性，不是函数——此前误写成 Stat.source()，每 4s 抛一次 TypeError，轮询兜底从未真正生效
    if(s === 'defaults') return;                 // 本来就没数据源，轮询无意义
    /* ⚠ 签名覆盖面（用户报「遇到新角色，图鉴没解锁」的另一半原因）：
       原来只盯 `主角` + `资产` 两项。于是「只增加了图鉴.已遭遇种族 / 羁绊 / 世界」的那些楼，
       签名一动不动 → 轮询判定「无变化」→ 永不刷新 → 用户明明遇见了，图鉴就是不变。
       现改为覆盖所有会驱动渲染的分组。 */
    let sig = '';
    try{
      sig = ['主角','资产','阵营声望','世界','图鉴','羁绊','战斗','心界住民','任务','事件记录','地点','行囊','技能','物品']
        .map(k=>JSON.stringify(Stat.get(k, null))).join('|');
    }catch(e){}
    if(sig && sig !== lastSig){ lastSig = sig; refreshStatsUI(); }
  }, 4000);
})();

const KONATA_NOTE_BLOCK_RE = /<(tucao|konatan_chat)\b[^>]*>([\s\S]*?)<\/\1\s*>/gi;
/* 流式期未闭合的小此留言 */
const KONATA_NOTE_TAIL_OPEN_RE = /<(tucao|konatan_chat)\b[^>]*>([\s\S]*)$/i;
/* 猫神留言标题判定：须含「留言/猫」才认，预设的 <summary> 摘要与内心话 details 不收 */
function isCatNoteTitle(title){ return /留言|猫/.test(title); }
/* 纯标签行（不产生可见正文行）：afterLine 锚定时要跳过 */
function isConsumedTagLine(line){
  const t = String(line||'').trim();
  if(!t) return true;
  return /^\[scene:/.test(t) || /^\[nsfw:/.test(t) || /^<achievement>/.test(t) || /^>/.test(t)
      || /^<\/?[A-Za-z_][^>]*>$/.test(t)
      || /^<\/?(?:content|正文|options|summary|details|danmu|UpdateVariable|Analysis|game|Interleaving|SUOT|tucao|konatan_chat|advice|think|thinking|simple_thinking|think_nya~|draft|Chain_of_Thought|start)\b/i.test(t);
}
/* 从 from 起找留言块后第一行可见文本（供按行锚定） */
function firstVisibleLineAfter(text, from){
  for(const line of String(text).slice(from).split(/\n/)){
    const t = line.trim();
    if(!t) continue;
    if(isConsumedTagLine(t)) continue;
    return t.slice(0,200);
  }
  return undefined;
}
/* ══════════════════════════════════════════════════════════
   功能标签白名单抢救（防各净炉分支误杀）
   ──────────────────────────────────────────────────────────
   病灶：卡内规则要求五个功能标签「一律置于 </正文> 之后」，
   而 ⑤<details/danmu/game> 与 ⑥<Interleaving> 等滤净分支各自
   整块删除文本 —— Dramatron 把 <Interleaving> 开在 <正文> 内部、
   闭在 </正文> 之前时，⑥ 的 `t = container[1]` 会把容器外的
   <魔物生成>/<获得物品>… 全部丢弃，卡片数归零、statusSeen 变false。

   修法（原则：功能标签只有这五个有「通行权」）：
     进净炉第一步先把五者整块提出来暂存，并把原位清空；
     全部滤净分支跑完后原样拼回文末。
   于是不管哪个分支怎么删，都碰不到它们；而容器外的其它文本
   （残渣、玩家提示等）仍照旧被丢弃 —— 不是「全留」，是「只留这五个」。
   渲染位置：parseFloor 用 fcWalk 在 t 上取块，cardHtml 排在 choices 之前（正文不受影响）。
   闭合缺失（流式截断）时按文末兜底收尾，避免整卡消失。 */
const FUNC_TAGS = '魔物生成|获得物品|获取任务|技能生成|较量面板';
function rescueFuncTags(src){
  const held = [];
  let t = String(src||'').replace(new RegExp(String.raw`<\s*(${FUNC_TAGS})\s*>([\s\S]*?)(?:<\/\s*\1\s*>|(?![\s\S]*<\/\s*\1\s*>)[\s\S]*$)`, 'gi'), (m, name, body)=>{
    held.push({ name, body });
    return '';
  });
  return { t, held };
}
function cleanseFloor(raw){
  let t = String(raw||'');
  const out = { text:'', notes: [], suot: '', catNotes: [], konataNotes: [] };
  if(!t) return out;
  // ⓿ 功能标签白名单抢救：先提走、留到末尾拼回（见上方说明）
  let held = [];
  try{ const r = rescueFuncTags(t); t = r.t; held = r.held; }catch(e){}
  // ① 泉此方思维链前缀：闭标签前全截
  t = t.replace(/[\s\S]*?<\/konatan_planning~>/i, '');
  // ② <SUOT> 选项块先提（滤净链将删之）
  const sm = SUOT_RE.exec(t);
  if(sm) out.suot = sm[1];
  // ③ 猫神留言（Reborn 小猫之神）—— 必须先于 ⑥ 的 <details> 整块滤净收，否则必丢
  {
    const ranges = [];
    for(const m of t.matchAll(CAT_NOTE_BLOCK_RE)){
      if(!isCatNoteTitle(m[1])) continue;                 // 预设的 <summary> 摘要/内心话 details 不收
      out.catNotes.push(m[2].trim());
      ranges.push([m.index||0, (m.index||0)+m[0].length]);
    }
    for(let i=ranges.length-1;i>=0;i--) t = t.slice(0,ranges[i][0]) + t.slice(ranges[i][1]);
    const tail = CAT_NOTE_TAIL_RE.exec(t);
    if(tail && isCatNoteTitle(tail[1])){
      const body = tail[2].trim();
      if(body){ out.catNotes.push(body); t = t.slice(0, tail.index||0); }
    }
  }
  // ④ 小此留言（Izumi 泉此方）—— 同样先收；记下块后第一行可见文本供按行锚定
  {
    const ranges = [];
    for(const m of t.matchAll(KONATA_NOTE_BLOCK_RE)){
      out.konataNotes.push({
        type: m[1].toLowerCase(),
        content: m[2].trim(),
        afterLine: firstVisibleLineAfter(t, (m.index||0)+m[0].length),
      });
      ranges.push([m.index||0, (m.index||0)+m[0].length]);
    }
    for(let i=ranges.length-1;i>=0;i--) t = t.slice(0,ranges[i][0]) + t.slice(ranges[i][1]);
    const tail = KONATA_NOTE_TAIL_OPEN_RE.exec(t);
    if(tail){
      const body = tail[2].trim();
      if(body){ out.konataNotes.push({type: tail[1].toLowerCase(), content: body}); t = t.slice(0, tail.index||0); }
    }
    /* 兼容旧字段：notes 汇总小此留言（历史消费方按 tag 展示） */
    for(const n of out.konataNotes) out.notes.push({tag:n.type, text:n.content});
  }
  // ④ 思维链对/未闭合流式尾/变体
  t = t.replace(/<(think|thinking|chain_of_thought|draft|simple_thinking|cot|think_nya~)[^>]*>[\s\S]*?<\/\1\s*>/gi,'')
       .replace(/<think(?:ing)?\s*\/>/gi,'')
       .replace(/\u22D8/g,'')
       .replace(/<(?:thinking|simple_thinking|think_nya~|think)>(?:(?!<\/(?:thinking|simple_thinking|think_nya~|think)>)[\s\S])*\s*$/i,'')
       .replace(/<\/?(?:thinking|simple_thinking|think_nya~|think|draft|Chain_of_Thought)>\s*/gi,'');
  // ⑤ 附加块 / SUOT / 弹幕 / game 壳 / details
  t = t.replace(/<(disclaimer|Reference_Example|summary|background|safety_check|advice)>[\s\S]*?<\/\1>/gi,'')
       .replace(/<SUOT\b[^>]*>[\s\S]*?<\/SUOT>/gi,'')
       .replace(/<!--\s*Technical Footer Start[\s\S]*?Technical Footer End\s*-->/gi,'')
       .replace(/<danmu\b[^>]*>[\s\S]*?<\/danmu\s*>/gi,'')
       .replace(/<\/?game\b[^>]*>\n?/gi,'')
       .replace(/<details\b[^>]*>[\s\S]*?<\/details\s*>/gi,'');
  // ⑥ Interleaving / content（Gemini Dramatron）＝杂质：整块删除，不再当容器选留
  // 2026-10 定稿（朋友方案）：正文只认 <正文></正文>，功能标签只认五件套（⓿已抢救）；
  // Interleaving 无论开在哪、闭在哪、闭合与否，一律整块剔除——
  // 废止旧「有容器只留容器体」互斥逻辑（Interleaving 开在 <正文> 内部时会错杀容器外正文）。
  t = t.replace(/<Interleaving>[\s\S]*?<\/Interleaving\s*>/gi, '')
       .replace(/<Interleaving>[\s\S]*$/i, '')
       .replace(/<\/?Interleaving>\n?/gi, '')
       .replace(/<\/?content\b[^>]*>/gi, '');
  // ⓿ 归位：五个功能标签按原出现顺序拼回文末（正文行为完全不变）
  if(held.length){
    const heldTxt = held.map(x=>`<${x.name}>\n${x.body.trim()}\n</${x.name}>`).join('\n');
    t = t.replace(/\s+$/,'');
    t = (t ? t + '\n\n' : '') + heldTxt;
  }
  out.text = t;
  return out;
}
/* 预清洗：对应卡内 #2(反引号围栏) #3(样式块) #4(q标签) #5(标签漂移/加粗包裹) */
function preNormalize(t){
  t = t.replace(/`{2,}[^\n]*/g, '');                                  // 围栏行
  t = t.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');                 // AI 模仿样式块
  t = t.replace(/<\/?q\s*>/gi, '');                                     // 残留 q 标签
  const drift = new RegExp(String.raw`\**[ \t]*<\s*(\/?)\s*(${TAG_ALT})\s*(\/?>)[ \t]*\**`, 'gi');
  t = t.replace(drift, '<$1$2$3');                                      // 加粗/空格漂移归一
  return t;
}
function extractBlocks(t, name){
  const out = []; const re = new RegExp(String.raw`<\s*${name}\s*>([\s\S]*?)<\/\s*${name}\s*>`, 'gi');
  let m; while((m = re.exec(t))) out.push(m[1]);
  return out;
}
function parseFields(raw){
  // 字段行解析：兼容「键：值」「【键】值」「键|值」三态；不吃进去的行进 extras
  const fields = [], extras = [];
  raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let m = line.match(/^【([^】]+)】\s*[:：]?\s*(.+)$/) || line.match(/^([^:：|]{1,12})\s*[:：]\s*(.+)$/) || line.match(/^([^:：|]{1,12})\s*\|\s*(.+)$/);
    if(m) fields.push([m[1].trim(), m[2].trim()]); else extras.push(line);
  });
  return {fields, extras};
}
/* afterLine（留言块后第一行可见文本）→ flow 下标匹配：
   取首条包含该行的正文段；对不回时回退到上一条锚点之后，保证笺仍会出现。 */
function anchorKonataNotes(notes, flow){
  const list = (notes||[]).map(n => ({...n}));
  if(!list.length) return list;
  const prose = (flow||[]).filter(x => x.type === 'prose');
  let searchFrom = 0;
  for(let i=0;i<list.length-1;i++){          // 末条是 tail，不锚定
    const n = list[i];
    if(n.type !== 'tucao') continue;
    let found = null;
    if(n.afterLine){
      for(let k=searchFrom;k<prose.length;k++){
        if(prose[k].text.includes(n.afterLine)){ found = k; break; }
      }
    }
    if(found === null){                       // 回退：锚到上一条之后
      found = Math.min(searchFrom, Math.max(0, prose.length-1));
    }
    n.anchorPara = found;
    searchFrom = found + 1;
  }
  list[list.length-1].anchorPara = null;       // 末尾留言常显在页末
  return list;
}

/* FNV-1a 变体散列：楼层号稳定映射进图池下标（同楼层恒定同图，避免重渲闪变）*/
function seedHash(seed){
  let h = 2166136261;
  const s = String(seed);
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function konataImageFor(seed){
  const pool = KONATA_IMAGES;
  if(seed == null || !Number.isInteger(seed) || seed < 0) return pool[Math.floor(Math.random()*pool.length)];
  return pool[seedHash(seed) % pool.length];
}

function parseFloor(raw){
  const r = { cover:false, header:'', prose:[], minds:[], news:[], duels:[], cards:[], options:[], statusSeen:false, updates:0, notes:[], catNote:null, konataNotes:[] };
  const cl = cleanseFloor(raw||'');
  let t = preNormalize(cl.text);
  /* 预设留言：猫神（Reborn）。catNote 合并多段；小此留言（Izumi）待 flow 建好后锚定 */
  r.catNote = cl.catNotes.length ? cl.catNotes.join('\n\n') : null;
  /* <start> 开局楼层：闭合与未闭合（流式截断）两形态都认；start 当包裹壳时把内层正文标签剥净留字 */
  const starts = extractBlocks(t,'start');
  if(!starts.length){
    const openTail = t.match(/<\s*start\s*>([\s\S]*)$/i);
    if(openTail) starts.push(openTail[1]);
  }
  if(starts.length){
    r.cover = true;
    r.coverText = starts.join('\n').replace(/<\s*\/?\s*(正文|content)\s*>/gi,'').trim();
    return r;
  }
  // 场景标头 = <正文> 之前独立一行
  const headMatch = t.match(/^([\s\S]*?)<\s*正文\s*>/);
  if(headMatch){ r.header = headMatch[1].split(/\r?\n/).map(s=>s.trim()).filter(Boolean).pop() || ''; }
  let bodies = extractBlocks(t,'正文');
  let body = '';
  if(bodies.length){
    body = bodies.join('\n');
  }else{
    // 2026-10 定稿（朋友方案）：废止 izumi/小猫/kemini 三预设的 <content> 正文提取路——
    // 正文唯一来源是 <正文></正文>；无正文块时兜底全文（剥功能标签壳）。
    body = t;
    TAGNAMES.forEach(n=>{ if(n!=='正文') body = body.replace(new RegExp(String.raw`<\s*${n}\s*>[\s\S]*?(?:<\/\s*${n}\s*>|$)`,'gi'),''); });
  }
  body = body.replace(/<\s*\/?\s*(正文|content)\s*>/gi,'');
  // 顺序游走：保真还原 正文段落 / 心语 / 大陆见闻 / 战况 的出现次序
  r.flow = [];
  const walk = /<\s*(心语|大陆见闻|战况)\s*>([\s\S]*?)<\/\s*\1\s*>/gi;
  let last = 0, wm;
  const pushProse = (txt)=>{ txt.split(/\n{2,}|(?<=\S)\n(?=\S)/).map(s=>s.trim()).filter(Boolean).forEach(p=>r.flow.push({type:'prose',text:p})); };
  while((wm = walk.exec(body))){
    pushProse(body.slice(last, wm.index));
    const type = wm[1]==='心语' ? 'mind' : wm[1]==='大陆见闻' ? 'news' : 'duel';
    r.flow.push({type, text: wm[2].trim()});
    last = walk.lastIndex;
  }
  pushProse(body.slice(last));
  /* 小此留言（Izumi）分楼：按出现顺序的最后一个留言块 = 末尾留言（常显，对齐猫爪笺）；
     其余 tucao = 穿插吐槽，锚到它后面那一段正文，书页上就落在该段旁边。
     锚定失败回退到「上一条之后」，保证笺仍会出现。 */
  r.konataNotes = anchorKonataNotes(cl.konataNotes, r.flow);
  r.konataTail = r.konataNotes.length ? r.konataNotes[r.konataNotes.length-1] : null;
  r.midTucao = r.konataNotes.slice(0, -1).filter(n => n.type === 'tucao');
  r.notes = cl.notes;
  // 正文后的功能标签（按源码出现顺序）
  r.cards = [];
  const tagMeta = {'魔物生成':['monstrum','魔物娘档案','MONSTRVM'],'获得物品':['res','获得物品','RES'],'获取任务':['mandatum','委托录','MANDATVM'],'技能生成':['artes','技能习得','ARS'],'较量面板':['certamen','较量记录','CERTAMEN']};
  const fcWalk = /<\s*(魔物生成|获得物品|获取任务|技能生成|较量面板)\s*>([\s\S]*?)<\/\s*\1\s*>/gi;
  let cm;
  while((cm = fcWalk.exec(t))){
    const meta = tagMeta[cm[1]];
    const p = parseFields(cm[2]);
    if(cm[1]==='较量面板'){ try{ p.cert = JSON.parse(cm[2].trim()); }catch(e){ p.cert = null; } }
    r.cards.push({tag: cm[1], cls: meta[0], title: meta[1], latin: meta[2], ...p});
  }
  // 选项（多路并取 + 去重，对齐蓝本 parseOptions）
  const CN = '一二三四五六七八九十';
  const pushOpt = (text, label)=>{
    text = (text||'').replace(/<\/?option\b[^>]*>/gi,'').replace(/\*\*/g,'').trim();
    if(!text || r.options.some(o=>o.text===text)) return;
    r.options.push({ label: label || ('选项' + (CN[r.options.length]||r.options.length+1)), text });
  };
  if(cl.suot) cl.suot.split(/\r?\n/).forEach(l=>pushOpt(l.replace(SUOT_INDEX_RE,'')));
  const obm = t.match(/<options\b[^>]*>([\s\S]*?)<\/options>/i);
  if(obm){
    const inner = obm[1];
    let matched = false;
    for(const m of inner.matchAll(/<option\b[^>]*>([\s\S]*?)<\/option>/gi)){ pushOpt(m[1]); matched = true; }
    if(!matched) {
      inner.split(/\r?\n/).forEach(line=>{
        const m = line.trim().match(/^>\s*([^:：]{1,6})\s*[:：]\s*(.+)$/);
        if(m){ pushOpt(m[2], m[1]); matched = true; }
      });
    }
    if(!matched) inner.split(/\r?\n/).filter(s=>s.trim()).forEach(s=>pushOpt(s));
  }
  for(const m of t.matchAll(/<option\b[^>]*>([\s\S]*?)<\/option>/gi)) pushOpt(m[1]);
  const cblk = t.match(/<choice>([\s\S]*?)<\/choice>/);
  if(cblk && cblk[1].includes('\n')) cblk[1].split(/\r?\n/).filter(s=>s.trim()).forEach(s=>pushOpt(s));
  for(const m of t.matchAll(/<choice>([^<]+?)<\/choice>/g)) pushOpt(m[1]);
  /* statusSeen 保留但已停用：状态栏标签不再由 AI 输出（前端自绘，数据源为 stat_data），
     页脚「状态簿已归档」改由 r.updates 驱动。仅作旧楼层兼容解析，不得再依赖它。 */
  if(/<\s*状态栏\s*>[\s\S]*?(<\/\s*状态栏\s*>|$)/i.test(t) || /<\s*状态面板\s*\/?>/i.test(t)) r.statusSeen = true;
  r.updates = (t.match(/<\s*(UpdateVariable|update)\s*>/gi)||[]).length;
  return r;
}

/* ---------- 小工具 ---------- */
const esc = (s)=>String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* esc 的多行版：仅用于正文展示位（图鉴条目、WIKI 原文、世界书条目）。
   esc() 只做 HTML 转义、不处理 \n，WIKI/卡内资料里的换行会全部塌成一行。
   ⚠ 不可直接改 esc()：它还被大量用在 value="…" / placeholder="…" 等属性上下文，
     在那里注入 <br> 会破坏属性值。故另立此函数，按需调用。
   —— escLines 的教训：它把每个 \n 都换成 <br>，于是原文的段落空行（\n\n）
     变成 <br><br>，在 line-height:1.9 下撑出夸张的段间距（用户截图实况）。
     段落必须用真正的 <p> 承载，空行交给 CSS margin 控制，不再拿 <br> 当段落。 */
const escLines = (s)=>esc(s).replace(/\r\n?/g,'\n').replace(/\n/g,'<br>');
/* 段落版：空行分段→ 每段一个 <p>；段内单换行仍保留（<br>）。
   中文正文排版正解，段距由 .dd-lore p + .dd-lore p + p 的 margin 决定。

   ⚠ WIKI 原文里的小标题（【简介】【动作特征】…）不能当正文段渲染：
   .dd-lore p 带 text-indent:2em，而 text-indent 只作用于「每个块的第一行」。
   若【标题】与其下正文之间没有空行，它们会被并进同一个 <p>：
       <p>【简介】<br>她们是…</p>
   结果是【标题】缩进两格、<br> 之后的正文齐左、下一个 <p> 又缩进两格 ——
   一段之内出现三种左缘，层次全乱（用户截图实况）。

   修法：先把「独占一行的【小标题】」从段落流里摘出来（前后各补一个空行），
   使其成独立的 <h4>（.dd-lore h4 零缩进），其下每段正文则都是规规矩矩的
   2em 首行缩进 —— 左右两缘各自对齐，层次就齐了。
   段内出现的【…】不是独占行，仍留在正文里不动。 */
const escParas = (s)=>{
  /* 标题归一：【小标题】与 Markdown 标题（#～######）同级同款，都渲染为 <h4>。
     卡内女主档案「基础版」用【…】、「堕落版」用 ## ，两套体系混排会导致左右不齐，
     所以先把两种写法都收进同一个标题判定。
     `#` 后必须有空白才是标题，否则 #hashtag 这类行内话题会被误吞。 */
  const H4_SRC = /^[ \t　]*(?:【([^【】\n]{1,24})】|#{1,6}[ \t　]+([^\n#]{1,40}))[ \t　]*$/;
  const h4Text = (l)=>{ const m = l.match(H4_SRC); return m ? String(m[1]!==undefined?m[1]:m[2]).trim() : l.trim(); };
  const isHead = (l)=> H4_SRC.test(l);
  // 阶段一：摘出独占行的标题，在其前后补空行，使其独立成块
  //（此处必须原样保留 【】/## 标记，阶段二要靠它判定，再在输出时才剥标记）
  const staged = String(s??'').replace(/\r\n?/g,'\n').split('\n').reduce((acc, line)=>{
    if(isHead(line)){
      if(acc.length && acc[acc.length-1] !== '') acc.push('');
      acc.push(line.trim());
      acc.push('');
    }else{
      acc.push(line);
    }
    return acc;
  }, []).join('\n');
  // 阶段二：按空行切段，逐段映射为 h4 / p
  return staged.split(/\n{2,}/).map(b=>b.trim()).filter(Boolean)
    .map(b=>{
      if(isHead(b)) return '<h4>'+esc(h4Text(b))+'</h4>';
      return '<p>'+esc(b).replace(/\n/g,'<br>')+'</p>';
    }).join('');
};
const g = (obj, path, fb)=>{ try{ return path.split('.').reduce((o,k)=>o?.[k], obj) ?? fb; }catch{ return fb; } };

const pageBase = document.getElementById('page-base');

function proseHtml(text){
  /* ⚠ 顺序不可调换：`**粗体**` 必须先吃掉，否则 `*a* 和 **b**` 会被单星号规则
     从第一个 `*` 一直配到 `**` 的第二个 `*`，产出 `<em>a* 和 *</em>` 这种碎屑。 */
  let t = esc(text)
    .replace(/\*\*([\s\S]*?)\*\*/g, '<strong>$1</strong>')              // 对应卡内 #7/#10
    /* 单星号强调 → 青蓝，**星号不显示**。
       三条约束：① 不跨行（段落内换行不是强调）；② 不跨 `*`（`***`/`**` 残渣不配对）；
       ③ 内容非空。剩下的孤立 `*` 原样保留——宁可露一个星号，也不要错配吞掉半段正文。 */
    .replace(/\*([^*\n]+?)\*/g, (m,inner)=> inner.trim() ? `<span class="em">${inner}</span>` : m)
    .replace(/^#{1,6}[ \t]+(.+)$/, '<strong>$1</strong>')               // 对应卡内 #11 标题行
    .replace(/「([^「」]{1,120})」/g, '<span class="dlg">「$1」</span>')            // 发言红，旁白黑
    .replace(/“([^“”]{1,140})”/g, '<span class="dlg">“$1”</span>');               // 弯引号对白同款红色
  return `<p>${t}</p>`;
}
/* ── 预设留言笺渲染 ──
   猫神留言（Reborn 小猫之神）：朱印猫爪笺，头像位用朱印猫爪刻印（预设只产文字，无图）
   小此留言（Izumi 泉此方）：青金石笺 + 按楼层种子取的小此头像 */
function noteSlip(o){
  const isCat = o.kind === 'cat';
  const head =
    `<div class="ns-head">`+
      (isCat
        ? `<span class="ns-avatar paw">${ICON_paw}</span>`
        : `<img class="ns-avatar" src="${esc(o.img||'')}" alt="小此" referrerpolicy="no-referrer" loading="eager">`)+
      `<span class="ns-title"><span class="ns-cn">${esc(o.title)}</span><span class="ns-latin">${esc(o.latin)}</span></span>`+
      `<span class="ns-seal">${isCat?'喵':'此'}</span>`+
    `</div>`;
  const segs = (o.segs && o.segs.length)
    ? o.segs.map(s=>`<div class="ns-seg">${s.tag?`<span class="ns-seg-tag">${esc(s.tag)}</span>`:''}<span class="ns-body">${esc(s.text)}</span></div>`).join('')

function konataNoteHtml(note, img, tagText){

function flowHtml(flow, midTucao, konataImg){
  /* 穿插吐槽按anchorPara 插到对应正文段之后；同一锚点多条合并进一张笺 */
  const byAnchor = new Map();
  for(const n of (midTucao||[])){
    if(n.anchorPara == null) continue;
    if(!byAnchor.has(n.anchorPara)) byAnchor.set(n.anchorPara, []);
    byAnchor.get(n.anchorPara).push(n);
  }
  let proseSeen = -1;
  return flow.map(node=>{
    let html;
    if(node.type==='prose'){
      html = proseHtml(node.text);
      proseSeen++;
      const group = byAnchor.get(proseSeen);
      if(group && group.length){
        /* 首条为「构思」、其余为「穿插」，对齐租借男友的分段口径 */
        html += noteSlip({
          kind:'konata',
          title:'小此的吐槽',
          latin:'KONATA · TUCAO',
          img: konataImg,
          segs: group.map((n,i)=>({ tag: i===0 ? '构思' : '穿插', text:n.content })),
        });
      }
      return html;
    }
    if(node.type==='mind') return `<aside class="mind-slip"><span class="ms-sigil" style="color:var(--cinnabar)">${ICON.quill}</span>${esc(node.text)}</aside>`;
    if(node.type==='news') return `<aside class="news-clip"><div class="nc-head">${ICON.news}<span>大陆见闻 · 旅志剪页</span></div><div class="nc-body">${esc(node.text)}</div></aside>`;
    return `<aside class="duel-banner"><div class="db-head">${ICON.sword}<span>战况 · 血墨战报</span></div><div class="db-body">${esc(node.text)}</div></aside>`;
  }).join('');
}

/* ════════════════════════════════════════════════════
   伪全屏 + iframe 高度守卫（完全按幻璃镜机制重做，modian 前缀）
   蓝本：幻璃镜 GameScreen 伪全屏接管 + galgame-core/iframeGuard 高度守卫
        + galgame-core/ttFullscreenCompat TT 宿主兼容层（ST 上全 no-op）。
   进入：父页 <style id="tavern-modian-fs-hide"> 按 mesid 藏其余楼层
        → .mes fixed 八属性顶满视口（z 99999）→ iframe 100%/100%
        → __modianFullscreen=true → TT compat 接管（仅 TT 宿主生效）
        → 同时尝试原生 requestFullscreen（原生全屏是「魔典-锁定前端」的
          锁定触发器，Esc 退出归浏览器管；原生不可用时纯伪全屏兜底）。
   退出：先退原生全屏 → 清 .mes 八属性 → 摘藏楼 style → 标志 false
        → TT compat 恢复祖先链 → restoreIframeHeight（清内联→写目标高）
        → 守卫 burst（3×100ms 修竞态：全屏改了父页内联样式，不恢复是必现坑）。
   Esc/浏览器 UI 退出原生全屏 → fullscreenchange 同步走完整退出链。
   分工：本页负责视觉，「魔典-锁定前端」脚本负责保命（拦酒馆销毁 iframe）。
   浏览器裸跑：无父页 jQuery → 伪全屏静默跳过，只剩原生全屏尽力而为。
   ════════════════════════════════════════════════════ */
const FS_HIDE_ID = 'tavern-modian-fs-hide';

function parentJQ(){ try{ if(window.parent && window.parent !== window && window.parent.$) return window.parent.$; }catch(e){} return null; }
function selfIframe(){ try{ return window.frameElement || null; }catch(e){ return null; } }

/* ── TauriTavern 宿主全屏兼容层（照 galgame-core/ttFullscreenCompat 内联移植） ──
   背景：TT 宿主改写过 .mes 结构，并对第三方 fixed 浮层做几何管理；伪全屏直接
   把父页楼层改成 position:fixed，在 TT 上有两类已知症状——「不能全屏」（祖先链
   transform/contain 等把 fixed 困进祖先盒）与「发消息后全屏弹出」（楼层重渲染/
   虚拟化投影重置接管样式）。上游 SillyTavern 上 isTauriTavern() 为 false，
   三个入口全部 no-op，现有行为零改动。 */
const ttCompat = (()=>{
  const LOG = '[魔典·TT全屏兼容]';
  /* containing-block 陷阱属性 → 恒等值（非恒等值时后代 fixed 以该祖先为包含块而非视口） */
  const TRAP_PROPS = [
    ['transform','none'], ['contain','none'], ['filter','none'], ['backdrop-filter','none'],
    ['perspective','none'], ['will-change','auto'], ['content-visibility','visible'], ['container-type','normal']
  ];
  const SURFACE_ATTR = 'data-tt-mobile-surface', SURFACE_VALUE = 'fullscreen-window';
  let trapRestoreList = [], taggedEls = [], ttHostCache = null;

  /* TT 宿主检测：平台 ABI / 运行标记，本 iframe 与父窗口各查一轮（同源可读） */
  function isTauriTavern(){
    if(ttHostCache !== null) return ttHostCache;
    let detected = false;
    try{
      if(window.__TAURITAVERN__ && window.__TAURITAVERN__.abiVersion) detected = true;
      else if(window.__TAURI_RUNNING__ === true) detected = true;
    }catch(e){}
    if(!detected){
      try{
        const p = window.parent;
        if(p && p !== window){
          if(p.__TAURITAVERN__ && p.__TAURITAVERN__.abiVersion) detected = true;
          else if(p.__TAURI_RUNNING__ === true) detected = true;
        }
      }catch(e){ /* 跨域安全异常，按非 TT 处理 */ }
    }
    ttHostCache = detected;
    return detected;
  }
  function readTTDiagnostics(){
    const out = {};
    try{
      const p = (window.parent && window.parent !== window ? window.parent : window);
      out.abiVersion = (p.__TAURITAVERN__ && p.__TAURITAVERN__.abiVersion) ?? null;
      out.erProfile = (p.localStorage && p.localStorage.getItem('tt:embeddedRuntimeProfile')) ?? null;
    }catch(e){ out.erProfile = 'unreadable'; }
    return out;
  }
  /* 进入伪全屏（TT only）：中和祖先链 containing-block 陷阱（存原值，退出按原样
     恢复；幂等，先恢复上一轮）+ 打 fullscreen-window opt-in 标记（TT 几何防火墙
     尊重已显式标记的节点，不再当异常浮层修正） */
  function enter(takeoverEl){
    if(!isTauriTavern()) return;
    exit();
    if(!takeoverEl) return;
    let neutralized = 0;
    try{
      const doc = takeoverEl.ownerDocument;
      const root = doc && doc.documentElement;
      let node = takeoverEl.parentElement;
      while(node){
        const view = node.ownerDocument && node.ownerDocument.defaultView;
        if(view){
          const cs = view.getComputedStyle(node);
          for(const [prop, identity] of TRAP_PROPS){
            const value = cs.getPropertyValue(prop);
            if(value && value !== identity){
              trapRestoreList.push({
                el: node, prop,
                hadInline: node.style.getPropertyValue(prop) !== '',
                inlineValue: node.style.getPropertyValue(prop),
                inlinePriority: node.style.getPropertyPriority(prop)
              });
              node.style.setProperty(prop, identity, 'important');
              neutralized++;
            }
          }
        }
        if(node === root) break;
        node = node.parentElement;
      }
    }catch(err){ console.warn(LOG + ' 祖先链中和失败', err); }
    try{
      if(!takeoverEl.hasAttribute(SURFACE_ATTR)){
        takeoverEl.setAttribute(SURFACE_ATTR, SURFACE_VALUE);
        taggedEls.push(takeoverEl);
      }
    }catch(e){}
    console.info(LOG + ' 已接管:', Object.assign({ neutralized }, readTTDiagnostics()));
  }
  /* 退出伪全屏（TT only）：按原样恢复祖先链与标记（与 enter 成对调用，卸载兜底） */
  function exit(){
    while(trapRestoreList.length){
      const rec = trapRestoreList.pop();
      try{
        if(rec.hadInline) rec.el.style.setProperty(rec.prop, rec.inlineValue, rec.inlinePriority);
        else rec.el.style.removeProperty(rec.prop);
      }catch(e){}
    }
    while(taggedEls.length){
      const el = taggedEls.pop();
      try{ el.removeAttribute(SURFACE_ATTR); }catch(e){}
    }
  }
  /* 全屏状态再断言守卫：楼层重渲染/虚拟化投影协调会重置接管元素的
     内联样式，导致伪全屏丢失——标准 ST 同样发生（新楼到达 → 酒馆重渲染
     楼层 → position:fixed 被抹 → 退出全屏）。故**不设宿主门槛**，全宿主生效；
     TT 额外做祖先链中和与 opt-in 标记。 */
  function installReassert(applyFn, isActive){
    // iframe 内酒馆助手全局常常不存在 → 逐帧探测（window / parent / top）
    const frames = [];
    try{ frames.push(window); }catch(e){}
    try{ if(window.parent && window.parent!==window) frames.push(window.parent); }catch(e){}
    try{ if(window.top && window.top!==window) frames.push(window.top); }catch(e){}
    let events = {};
    let onFn = null;
    for(const f of frames){
      try{ if(!events.tavern_events && f.tavern_events) events = f.tavern_events; }catch(e){}
      try{ if(!onFn && typeof f.eventOn === 'function') onFn = f.eventOn.bind(f); }catch(e){}
    }
    if(!onFn) return ()=>{};
    const EVENT_KEYS = ['MESSAGE_RECEIVED','MESSAGE_SENT','MESSAGE_UPDATED','MESSAGE_SWIPED',
      'USER_MESSAGE_RENDERED','CHARACTER_MESSAGE_RENDERED','CHAT_CHANGED','MORE_MESSAGES_LOADED'];
    let timer, settleTimer;
    const schedule = ()=>{
      if(!isActive()) return;
      window.clearTimeout(timer); window.clearTimeout(settleTimer);
      timer = window.setTimeout(()=>{
        if(!isActive()) return;
        try{ applyFn(); }catch(err){ console.warn(LOG + ' 再断言失败', err); }
        settleTimer = window.setTimeout(()=>{ if(isActive()){ try{ applyFn(); }catch(e){} } }, 350);
      }, 250);
    };
    const disposers = [];
    for(const key of EVENT_KEYS){
      const name = events[key];
      if(typeof name !== 'string') continue;
      try{ const d = onFn(name, schedule); if(d && typeof d.stop === 'function') disposers.push(()=>d.stop()); }catch(e){}
    }
    return ()=>{
      window.clearTimeout(timer); window.clearTimeout(settleTimer);
      while(disposers.length){ try{ disposers.pop()(); }catch(e){} }
    };
  }
  return { isTauriTavern, enter, exit, installReassert };
})();

function isPseudoFS(){ return window.__modianFullscreen === true; }
function isAnyFullscreen(){ return isPseudoFS() || !!document.fullscreenElement; }

/* ── 伪全屏接管（照幻璃镜 GameScreen applyPseudoFullscreen） ── */
function applyPseudoFullscreen(){
  const p$ = parentJQ(); if(!p$) return false;
  const iframe = selfIframe();
  const $mes = iframe ? p$(iframe).closest('.mes') : p$('#chat .mes').last();
  const floorId = $mes.attr('mesid');
  let hideStyle = p$('#' + FS_HIDE_ID);
  if(hideStyle.length === 0) hideStyle = p$('<style id="' + FS_HIDE_ID + '"></style>').appendTo('head');
  hideStyle.text(floorId
    ? '#chat .mes:not([mesid="' + floorId + '"]) { display: none !important; }'
    : '#chat .mes { display: none !important; }');
  $mes.css({ position:'fixed', top:'0', left:'0', width:'100vw', height:'100vh',
    'z-index':'99999', 'max-width':'none', 'max-height':'none' });
  if(iframe){
    // 视口高写像素：iframe 与 .mes 之间的包裹链(height:auto)会让 height:100% 落空成 150px
    let ph = 0;
    try{ ph = window.parent.innerHeight|0; }catch(e){}
    p$(iframe).css({ width:'100%', height: (ph > 0 ? ph : window.innerHeight) + 'px' });
  }
  window.__modianFullscreen = true;
  ttCompat.enter($mes[0] || null);
  return true;
}
/* ── 撤销伪全屏接管（照幻璃镜 GameScreen clearPseudoFullscreen） ── */
function clearPseudoFullscreen(){
  const p$ = parentJQ(); if(!p$) return;
  const iframe = selfIframe();
  const $mes = iframe ? p$(iframe).closest('.mes') : p$('#chat .mes').last();
  $mes.css({ position:'', top:'', left:'', width:'', height:'', 'z-index':'', 'max-width':'', 'max-height':'' });
  p$('#' + FS_HIDE_ID).remove();
  window.__modianFullscreen = false;
  ttCompat.exit();
}
/* 退出全屏后恢复 iframe（照 galgame-core/restoreIframeHeight）：清内联 → 写回目标高 */
function restoreIframeHeight(){
  const p$ = parentJQ(), iframe = selfIframe();
  if(!p$ || !iframe) return;
  try{
    p$(iframe).css({ width:'', position:'', top:'', left:'', 'z-index':'', 'max-width':'', 'max-height':'' });
    p$(iframe).css({ height: targetHeight() + 'px' });
  }catch(e){}
}
function fsTabRefresh(){
  const on = isAnyFullscreen();
  // 常驻全屏钮同步文案与选中态
  document.querySelectorAll('.fs-toggle').forEach(b=>{
    const t = b.querySelector('.fs-t-label');
    if(t) t.textContent = on ? '收屏' : '全屏';
    b.classList.toggle('on', on);
  });
  document.body.classList.toggle('modian-fs-on', on);
}
function enterFullscreen(){
  if(isAnyFullscreen()) return true;
  const p$ = parentJQ();
  if(p$){
    applyPseudoFullscreen();
    console.info('[魔典] 已进入全屏模式');
    // 布防 .mes 样式守卫：全屏期间酒馆重渲染抹掉 position:fixed 时自动重接管
    try{ window.__modianGuardArm && window.__modianGuardArm(true); }catch(e){}
    // 原生全屏尽力而为：它是锁定前端的锁定触发器，Esc 归浏览器管；不可用（如 iframe 无 allowfullscreen）不影响伪全屏
    try{ document.documentElement.requestFullscreen().then(fsTabRefresh).catch(()=>{}); }
    catch(e){ console.warn('[魔典] 浏览器原生全屏失败，使用伪全屏', e); }
  }else{
    try{ document.documentElement.requestFullscreen().then(fsTabRefresh).catch(()=>{}); }
    catch(e){ console.warn('[魔典] 浏览器原生全屏失败，使用窗口最大化', e); }
  }
  fsTabRefresh();
  return true;
}
function exitFullscreen(){
  // 先撤防（铁律）：clearPseudo 改 .mes 内联样式会触发守卫的 MutationObserver，
  // 布防未撤时守卫会把「已恢复的楼层」误判为重渲染抹除并重新锁死（Esc 退屏锁层事故根源）。
  try{ window.__modianGuardArm && window.__modianGuardArm(false); }catch(e){}
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }
  catch(e){ console.warn('[魔典] 退出浏览器全屏失败', e); }
  clearPseudoFullscreen();
  restoreIframeHeight();
  iframeGuard.burst();
  fsTabRefresh();
  console.info('[魔典] 已退出全屏模式');
}
function toggleFullscreen(){ if(isAnyFullscreen()) exitFullscreen(); else enterFullscreen(); }
/* 用户按 Esc / 浏览器 UI 退出原生全屏 → 与按钮退出走完全相同的链（先撤防，缺一都锁层） */
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && isPseudoFS()){
    try{ window.__modianGuardArm && window.__modianGuardArm(false); }catch(e){}
    clearPseudoFullscreen();
    restoreIframeHeight();
    iframeGuard.burst();
    console.info('[魔典] 浏览器全屏退出，已同步退出伪全屏');
  }
  fsTabRefresh();
});

/* ── iframe 高度守卫：事件驱动（观察者×3 + rAF 合帧 + 差值写入），全屏期间静默 ── */
function targetHeight(){
  const mobile = window.innerWidth <= 760;
  const def = mobile ? 700 : 800;
  try{ const ph = window.parent.innerHeight; if(ph > 0 && ph < def + 40) return Math.max(400, ph - 20); }catch(e){}
  return def;
}
const iframeGuard = (()=>{
  const p$ = parentJQ(), iframe = selfIframe();
  if(!p$ || !iframe) return { force(){}, burst(){}, destroy(){} };
  let raf = 0, dead = false;
  const apply = ()=>{
    if(dead) return;
    try{
      if(window.__modianFullscreen){
        // 全屏期间不静默：外部（酒馆/TT 的 iframe 自动高度）会把 iframe 写成定值（实见 150px 挤扁），
        // 这里盯住并重写成视口像素高（包裹链 height:auto 会让 100% 落空）。写前比实测矩形，到位不动笔。
        let ph = 0; try{ ph = window.parent.innerHeight|0; }catch(e){}
        const want = Math.max(400, ph > 0 ? ph : window.innerHeight);
        const cur = iframe.getBoundingClientRect().height;
        if(Math.abs(cur - want) > 2) p$(iframe).css({ width:'100%', height: want + 'px' });
        return;
      }
      const t = targetHeight(); const h = p$(iframe).height() || 0;
      if(Math.abs(h - t) > 1) p$(iframe).css({ height: t + 'px' });
    }catch(e){}
  };
  const schedule = ()=>{ if(raf || dead) return; raf = requestAnimationFrame(()=>{ raf = 0; apply(); }); };
  apply();
  let o1 = null, o2 = null, o3 = null;
  try{ o1 = new MutationObserver(schedule); o1.observe(iframe, { attributes:true, attributeFilter:['style'] }); }catch(e){}
  try{ const pe = iframe.parentElement; if(pe){ o2 = new MutationObserver(schedule); o2.observe(pe, { attributes:true, attributeFilter:['style','class'] }); } }catch(e){}
  try{ o3 = new ResizeObserver(schedule); o3.observe(document.body); }catch(e){}
  const onResize = ()=>schedule();
  window.addEventListener('resize', onResize);
  return {
    force: apply,
    burst(){ apply(); setTimeout(apply, 100); setTimeout(apply, 200); },
    destroy(){
      dead = true; if(raf) cancelAnimationFrame(raf);
      if(o1) o1.disconnect(); if(o2) o2.disconnect(); if(o3) o3.disconnect();
      window.removeEventListener('resize', onResize);
      try{ p$(iframe).css({ height: '' }); }catch(e){}
    }
  };
})();
/* TT 宿主再断言守卫：楼层重渲染/虚拟化投影重置接管样式 → 事件驱动重新应用
   （ST 上 installReassert 返回空 disposer，行为不变） */
const disposeTTReassert = ttCompat.installReassert(()=>{
  applyPseudoFullscreen();
}, isPseudoFS);

/* 兜底守卫：酒馆重渲染楼层时会直接抹掉 .mes 的内联 position:fixed，
   而上述事件在部分宿主上不触发。直接在父页盯 .mes 的 style 变化，
   一旦被重置就立刻重新接管（与事件守卫互补，双保险）。 */
(function installMesStyleGuard(){
  const p$ = parentJQ(); if(!p$) return;
  let armed = false, raf = 0, busy = false;
  const reassert = ()=>{
    if(!armed || busy) return;               // busy 自锁：重接管期间忽略自己引发的 DOM 变化
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>{
      raf = 0;
      if(!armed) return;
      if(window.__modianFullscreen !== true) return;   // 双闸门：非全屏态绝不重接管（退出竞态的硬保险）
      const iframe = selfIframe();
      const $mes = iframe ? p$(iframe).closest('.mes') : p$('#chat .mes').last();
      if(!$mes.length) return;
      const pos = $mes.css('position');
      const z = String($mes.css('z-index') || '');
      if(pos === 'fixed' && z === '99999') return;   // 接管仍在 → 什么都不做
      busy = true;                                  // ← 关键：上锁，阻断自触发循环
      console.info('[魔典] 楼层接管样式被重置，已重新接管');
      try{ applyPseudoFullscreen(); }catch(err){ console.warn(err); }
      setTimeout(()=>{ busy = false; }, 120);        // 落盘后再解锁
    });
  };
  try{
    const mo = new MutationObserver(reassert);
    mo.observe(p$('#chat')[0] || p$(document.body)[0], { subtree:true, childList:true, attributes:true, attributeFilter:['style','class'] });
  }catch(e){}
  // 布防/撤防（仅切状态，不主动重接管——避免与 enterFullscreen 打架）
  window.__modianGuardArm = (on)=>{ armed = !!on; };
})();
/* 启动自愈：本 iframe 开机时，若父页没有任何楼层处于伪全屏钉态，
   说明父页残留的藏楼样式是上一轮异常留下的（owner 已被销毁/换 mesid），立即摘除。 */
try{
  const p$ = parentJQ();
  if(p$){
    const pinned = p$('#chat .mes').filter(function(){
      return p$(this).css('position')==='fixed' && String(p$(this).css('z-index'))==='99999';
    }).length;
    if(!pinned){
      const hs = window.parent.document.getElementById(FS_HIDE_ID);
      if(hs){ hs.remove(); console.info('[魔典] 已摘除上一轮遗留的藏楼样式'); }
    }
  }
}catch(e){}
window.addEventListener('pagehide', ()=>{ clearPseudoFullscreen(); iframeGuard.destroy(); disposeTTReassert(); });

/* ---------- 翻页 与 时序 ---------- */
let cur = 0;
let stage = 'cover'; // cover → endpaper → ritual → awaiting → reading
function setStage(s){ stage = s; tome.dataset.stage = s; }
/* 末页是真实楼层（非封面）的最大下标；没有则 -1 */
function lastRealIdx(){
  for(let i=FLOORS.length-1; i>=1; i--){ if(!parseFloor(FLOORS[i].raw).cover) return i; }
  return -1;
}
function showFloor(idx, dir){
  idx = Math.max(0, Math.min(FLOORS.length-1, idx));
  /* 封面判定：只认「这是真的封面页」（idx=0 的开场白）。
     关键：syncFloors 的占位封面在有真实楼层后若仍按 r.cover 回退 showCover()，
     新楼到达时会把用户按回封面，永远看不到第一幕——所以只有 idx===0 才允许退封面。
     ⚠ 末位若是封面占位（首个开场白被删/换位、酒馆把占位排到非 0 位），
       这里**绝不能早退**：早退会留下「封面已 opened(opacity:0) + 书页空白」=
       点封面后白屏无内容（用户实况）。改为回退到最近一页真实楼层；
       一页真实楼层都没有才退回封面（而不是留白）。*/
  if(parseFloor(FLOORS[idx].raw).cover && idx !== 0){
    const real = lastRealIdx();
    if(real >= 0){ idx = real; }
    else { showCover(); cur = 0; return; }
  }
  const {html, r} = renderFloor(FLOORS[idx], idx);
  const isRealCover = r.cover && idx === 0;
  if(isRealCover){ showCover(); cur = 0; return; }
  tome.classList.remove('cover-on');
  tome.classList.remove('rit-on');   // 有真实楼层即退出仪典/扉页遮挡
  // 封面退场靠 .cover.opened（rotateY + opacity:0）；这里必须确保它已退场，
  // 否则封面会盖在正文上——真机表现就是「一直只能看到封面」。
  // 用惰性查询而非外层 const：showFloor 定义早于 coverEl/epEl 的 const 声明，
  // 运行时虽已初始化，但依赖声明顺序太脆弱。
  const coverBox = document.getElementById('cover');
  const epBox = document.getElementById('endpaper');
  if(coverBox) coverBox.classList.add('opened');
  if(epBox) epBox.classList.remove('open');
  const oldHtml = pageBase.innerHTML;
  pageBase.innerHTML = html;
  paintMeters(pageBase);   // 正文里的量条（较量面板的体力/法力）必须补宽度
  bindChoices();
  pageBase.querySelector('[data-latest]')?.addEventListener('click', ()=>showFloor(FLOORS.length-1, 1));
  pageBase.querySelectorAll('[data-fnav]').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.fnav==='prev'){ if(cur>1) showFloor(cur-1,-1); else if(cur===1){ setStage('cover'); showCover(); } }
    else if(cur<FLOORS.length-1) showFloor(cur+1,1);
  }));
  fsTabRefresh();
  if(oldHtml && !RM && dir!==0){   // dir=0 = 事件静默重渲（流式/改楼），不放翻页动画
    pageBase.classList.add(dir>0 ? 'enter-r' : 'enter-l');
    setTimeout(()=>pageBase.classList.remove('enter-r','enter-l'), 560);
    const ghost = document.createElement('article');
    ghost.className = 'page leaving';
    ghost.innerHTML = oldHtml;
    tome.insertBefore(ghost, tome.children[1]);
    void ghost.offsetWidth;
    ghost.classList.add(dir>0 ? 'fwd' : 'back');
    setTimeout(()=>ghost.remove(), 680);
  }
  cur = idx;
  if(!r.cover) setStage('reading');
}
const epEl = document.getElementById('endpaper');
const ritOpen = ()=> window.__ritual && window.__ritual.isOpen();
const epOpen = ()=> epEl.classList.contains('open');
addEventListener('keydown', e=>{
  if(insertOpen) { if(e.key==='Escape') closeInsert(); return; }
  if(tocOpen()) { if(e.key==='Escape') closeToc(); return; }
  if(ritOpen()) return; // 仪典不接受书页键
  if(epOpen()){
    if(e.key==='ArrowLeft') document.getElementById('ep-back')?.click();
    if(e.key==='ArrowRight') document.getElementById('ep-go')?.click();
    return;
  }
  if(stage!=='reading') return;
  if(e.key==='ArrowLeft'){ if(cur>1) showFloor(cur-1,-1); else setStage('cover'), showCover(); }
  if(e.key==='ArrowRight' && cur>=1 && cur<FLOORS.length-1) showFloor(cur+1,1);
  if(e.key==='Escape' && cur>0) setStage('cover'), showCover();
});
/* 触摸手势：横滑翻楼层，竖滑读当前楼层（方向占优判定，斜滑不误触） */
let touchStart = null;
addEventListener('touchstart', e=>{
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, {passive:true});
addEventListener('touchend', e=>{
  if(touchStart==null){ return; }
  const sx = touchStart.x, sy = touchStart.y; touchStart = null;
  if(ritOpen() || epOpen() || insertOpen || tocOpen() || stage!=='reading') return;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if(Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.3) return; // 竖滑/斜滑 → 交给原生滚动
  if(dx > 0){ if(cur>1) showFloor(cur-1,-1); else setStage('cover'), showCover(); }
  else if(cur>=1 && cur<FLOORS.length-1) showFloor(cur+1,1);
}, {passive:true});

function quillTabEl(){ return document.getElementById('quill-tab'); } // 书签由书签构建段后注入，故懒取
function updLetterCount(){
  const n = [...letBody.value].length;
  letCount.textContent = n ? `已书 ${n} 字` : '';
  // 信纸行高自适应（封顶九行，多余内滚无轮）
  const cap = 31 * 9 + 4;
  letBody.style.height = 'auto';
  const want = Math.min(letBody.scrollHeight + 2, cap);
  letBody.style.height = Math.max(122, want) + 'px';
  if(letterEl.classList.contains('open')) positionLetter();
}

/* 信笺橱窗：书底缘上方居中（手机端抬到书签底栏之上），随窗口 resize 重定位
 *
 * 坐标系铁律：伪全屏时 #stage 会挂 zoom:1.2，此时 getBoundingClientRect() 返回的是
 * 「缩放后的屏幕坐标」，而 letter 的 left/top 是 #stage 的「缩放前局部坐标」。
 * 两者混算必然错位（全屏时信笺底部被推出视口 ~140px）。
 * 故此处一律用 offsetLeft/offsetTop/offsetWidth（缩放前的布局坐标），
 * 夹逼也用 stage.clientWidth/Height（同样是局部坐标），全程不碰 rect。
 */
function positionLetter(){
  const stage = tome.parentElement || document.getElementById('stage');
  const sw = stage.clientWidth  || window.innerWidth;
  const sh = stage.clientHeight || window.innerHeight;
  const lw = letterEl.offsetWidth  || Math.min(560, sw * .92);
  const lh = letterEl.offsetHeight || 240;
  const pad = 10;
  const lift = sw <= 760 ? 62 : 26;   // 手机端为书签底栏留位
  // 局部坐标：tome.offsetLeft/Top 已是相对 #stage 的布局偏移（flex 居中已算好）
  let lx = tome.offsetLeft + (tome.offsetWidth  - lw) / 2;
  let ly = tome.offsetTop  + (tome.offsetHeight - lh) - lift;
  lx = Math.min(Math.max(pad, lx), Math.max(pad, sw - lw - pad));
  ly = Math.min(Math.max(pad, ly), Math.max(pad, sh - lh - pad));
  letterEl.style.left = Math.round(lx) + 'px';
  letterEl.style.top  = Math.round(ly) + 'px';
}
function openLetter(){
  positionLetter();
  letterEl.classList.add('open');
  quillTabEl()?.classList.add('active');
  letFrom.textContent = Stat.get('主角.姓名', null) || '无名旅人';
  updLetterCount();
}
function closeLetter(){ letterEl.classList.remove('open'); quillTabEl()?.classList.remove('active'); }

  letBody.value = text;
  openLetter();

  try{ letBody.setSelectionRange(text.length, text.length); }catch(e){}

}

async function tavernSend(text){
  const trimmed = (text||'').trim();
  if(!trimmed || letSend.disabled) return;
  letterEl.classList.add('sending');
  letSend.disabled = true; letBody.disabled = true;
  let ok = false;
  try{
    if(typeof triggerSlash === 'function'){
      await triggerSlash('/send ' + trimmed);
      await triggerSlash('/trigger await=true');
      ok = true;
      if(stage==='awaiting') enterReadingChapter();
      else notify('信函已寄出。', 'gild');
    }else{
      if(stage==='awaiting'){
        await new Promise(r=>setTimeout(r, 1100));   // 原型演示：等待"生成"后落章
        ok = true;
        notify('帷幕已定章。', 'gild');
        enterReadingChapter();
      }else{
        notify('未接入酒馆——字句留在笺上。', 'warn');
      }
    }
  }catch(e){
    notify('寄出受挫——字句仍留在笺上，可重试。', 'warn');
  }finally{
    letterEl.classList.remove('sending');
    letSend.disabled = false; letBody.disabled = false;
    if(ok){ letBody.value=''; updLetterCount(); persistDraft(); closeLetter(); }
  }
}

/* 回车只换行（手机没有 Ctrl，发送一律靠「寄出」按钮）；
   桌面保留 Ctrl/⌘+Enter 作为附加快捷，不夺走回车本身的分段职责。 */
letBody.addEventListener('keydown', e=>{

  if(e.key === 'Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); tavernSend(letBody.value); }
});

const insertEl = document.getElementById('insert');
let insertOpen = null;
/* ═══════════════════════════════════════════════════════════════
   卷册删改 · 删楼层 + 重生成（合并一册）
   契约对齐幻璃镜：删除走 /cut start-end（彻底删楼，非清空内容）；
   重生成走静默 generate + setChatMessages 覆写（不删楼不建楼，iframe 零重载）。
   ⚠ iframe 适配：酒馆助手全局未必在本上下文，逐帧探测；取不到则明说，不假装成功。
   ═══════════════════════════════════════════════════════════════ */
const ScrollOps = (()=>{
  let from = '', to = '', target = null, busy = false;

  function frames(){ return hostFrames(); }
  function api(name){
    for(const f of frames()){
      try{ if(typeof f[name] === 'function') return f[name].bind(f); }catch(e){}
    }
    return null;
  }
  /* 当前 AI 楼层号（书页 idx，排除封面占位） */
  function aiFloorIds(){
    return FLOORS.filter(f=>!parseFloor(f.raw).cover).map(f=>Number(f.idx)).filter(n=>!isNaN(n));
  }
  function curIdxOf(floorId){ return FLOORS.findIndex(f=>Number(f.idx) === Number(floorId)); }

  async function doDelete(){
    if(busy) return;
    const a = parseInt(from, 10), b = parseInt(to, 10);
    if(isNaN(a) || isNaN(b) || a<0 || b<a){ notify('楼层范围无效：需「起始 ≤ 结束」。','warn',3200); return; }
    const cut = api('triggerSlash');
    if(!cut){ notify('未取得酒馆助手 triggerSlash，当前环境非酒馆，未执行。','warn',4200); return; }
    busy = true;
    try{
      await cut(`/cut ${a}-${b}`);
      notify(`已焚卷：第 ${a} 至 ${b} 页。`,'gild',3600);
      from = ''; to = '';
      setTimeout(()=>{ syncFloors(); if(insertOpen) openInsert(insertOpen); }, 700);
    }catch(e){
      notify('焚卷失败：' + ((e && e.message) || e), 'warn', 4200);
    }finally{ busy = false; }
  }

  async function doRegen(){
    if(busy) return;
    if(target === null){ notify('请先点选要重生成的楼层。','warn',3000); return; }
    const gen = api('generate');
    if(!gen){ notify('未取得酒馆助手 generate，当前环境非酒馆，未执行。','warn',4200); return; }
    busy = true;
    try{
      const cur = (getChatMessages(target)||[])[0];
      if(!cur) throw new Error('未找到该楼层');
      let userText = '';
      for(let k = target - 1; k >= 0; k--){
        const m = (getChatMessages(k)||[])[0];
        if(m && m.role === 'user'){ userText = m.message || ''; break; }
      }
      const histEnd = userText ? target - 2 : target - 1;
      const raw = histEnd >= 0
        ? await gen({ user_input: userText, should_stream:false, should_silence:true,
            overrides:{ chat_history:{ prompts: getChatMessages('0-'+histEnd) } } })
        : await gen({ should_stream:false, should_silence:true });
      if(!raw || typeof raw !== 'string') throw new Error('AI 返回为空');
      const setM = api('setChatMessages');
      if(setM) await setM([{ message_id: target, message: raw }], { refresh:'none' });
      notify(`第 ${target} 页已重演。`,'gild',3200);
      setTimeout(()=>{ syncFloors(); if(insertOpen) openInsert(insertOpen); }, 700);
    }catch(e){
      notify('重演失败：' + ((e && e.message) || e), 'warn', 4200);
    }finally{ busy = false; }
  }

  function render(){
    const ids = aiFloorIds();
    const cur = (target !== null && curIdxOf(target) >= 0) ? FLOORS[curIdxOf(target)] : null;
    return `
    <div class="sec-title">卷册 · 删改</div>
    <div class="sc-grid">
      <div class="sc-card">
        <div class="sc-lab">焚卷 <em>彻底删除楼层</em></div>
        <div class="sc-in">
          <input type="number" min="0" data-sc="from" value="${esc(from)}" placeholder="起">
          <span style="align-self:center;color:var(--gilt-dim)">—</span>
          <input type="number" min="0" data-sc="to" value="${esc(to)}" placeholder="止">
        </div>
        <div class="sc-in" style="margin-bottom:10px">
          <button type="button" class="sc-go" id="sc-del" ${busy?'disabled':''}>焚 毁</button>
        </div>
        <p class="sc-hint">按楼层号删除（用户楼与 AI 楼都算），走 /cut 彻底移除而非清空内容。<br>当前共 ${ids.length} 个 AI 楼层。</p>
      </div>
      <div class="sc-card">
        <div class="sc-lab">重演 <em>静默重生成，不删楼不建楼</em></div>
        <div class="sc-cur">${cur
          ? `当前 <b>第 ${target} 页</b><span class="sc-pill">${esc(cur.label||'')}</span>`
          : '<span style="color:var(--ink-faint)">未选楼层 —— 点下方任意一页</span>'}</div>
        <div class="sc-chapters">${ids.length ? ids.map(i=>
          `<button type="button" class="sc-ch${i===target?' on':''}${busy?' busy':''}" data-sc-ch="${i}">第 ${i} 页</button>`).join('')
          : '<span class="sc-hint">尚无 AI 楼层。</span>'}</div>
        <div class="sc-in" style="margin-top:10px">
          <button type="button" class="sc-go" id="sc-regen" ${(busy||target===null)?'disabled':''}>重 演</button>
        </div>
        <p class="sc-hint">静默生成后覆写原楼层内容，前端零重载（不退出全屏）。</p>
      </div>
    </div>`;
  }

  function bind(root){
    root.querySelectorAll('[data-sc]').forEach(el=>{
      const k = el.dataset.sc;
      el.addEventListener('input', ()=>{ if(k==='from') from = el.value; else to = el.value; });
    });
    root.querySelectorAll('[data-sc-ch]').forEach(b=>b.addEventListener('click', ()=>{
      target = +b.dataset.scCh;
      if(insertOpen) openInsert(insertOpen);
    }));
    const d = root.querySelector('#sc-del'); if(d) d.addEventListener('click', doDelete);
    const r = root.querySelector('#sc-regen'); if(r) r.addEventListener('click', doRegen);
  }

  return { render, bind, _state:()=>({from,to,target,busy}) };
})();

const tabsEl = document.getElementById('thumb-tabs');

tabsLeftEl.className = 'thumb-tabs thumb-tabs-left';
tabsLeftEl.setAttribute('aria-label', '账卷书签');
tabsEl.parentNode.insertBefore(tabsLeftEl, tabsEl.nextSibling);
const tabsHTML = (list)=>list.map(m=>`<button class="thumb-tab" data-mod="${m.key}" aria-label="${m.name}">${ICON[m.icon]}<span>${m.tab}</span></button>`).join('');
tabsEl.innerHTML = tabsHTML(MODULES.filter(m=>m.side==='R'));
tabsLeftEl.innerHTML = tabsHTML(MODULES.filter(m=>m.side==='L'));
/* 书签栏溢出提示：可滚/不可滚一眼可辨（此前既不能滚也无任何提示，用户只能判定为「锁死」）。
   只监听 scroll 与 resize 两个源，不做观察器，避免无谓开销。 */
[tabsEl, tabsLeftEl].forEach(rail=>{
  const mobile = ()=> matchMedia('(max-width:760px)').matches;
  const sync = ()=>{
    if(mobile()){
      // 移动端是横向底栏：上/下缘渐隐不适用，改判横向溢出
      rail.classList.remove('rail-more','rail-edge-top','rail-edge-bot');
      const more = rail.scrollWidth - rail.clientWidth > 4;
      rail.classList.toggle('rail-h', more);
      rail.classList.toggle('rail-h-end', !more || rail.scrollLeft >= rail.scrollWidth - rail.clientWidth - 1);
      return;
    }
    rail.classList.remove('rail-h','rail-h-end');
    const more = rail.scrollHeight - rail.clientHeight > 4;
    rail.classList.toggle('rail-more', more);
    rail.classList.toggle('rail-edge-top', rail.scrollTop <= 1);
    rail.classList.toggle('rail-edge-bot', !more || rail.scrollTop >= rail.scrollHeight - rail.clientHeight - 1);

  //   实测证据：insert-head 高度 2128px，而外层 .insert 只有 420px。
  insertEl.innerHTML = `
    <div class="insert-head"><span class="ih-emblem">${ICON[m.icon]}</span>
      <div><h3>${m.name}</h3><div class="ih-latin">${m.latin}<span class="ih-ver"> · UI v${UI_VER}</span></div></div>

function meter(label, val, max, color=['#A98A46','#C9AE6D']){
  const pct = max>0 ? Math.round(Math.max(0,Math.min(val,max))/max*100) : 0;
  /* 宽度直接写进 style（不等 paintMeters 回填）：CSS 的 .m-fill 默认 width:0，
     只靠 data-w +事后遍历补宽，一旦某条渲染路径忘了调 paintMeters，条就是空的。
     data-w 保留，供 paintMeters 做重绘与动画。 */
  return `<div class="meter"><span class="m-label">${esc(label)}</span><div class="m-track"><div class="m-fill" data-w="${pct}" style="width:${pct}%;--mv:${color[0]};--mv2:${color[1]}"></div></div><span class="m-val">${val}</span></div>`;
}
function meterCentered(label, val, range=100, color=['#43617A','#2F4A5E']){
  const pct = Math.round((val+range)/(2*range)*100);
  return `<div class="meter"><span class="m-label">${esc(label)}</span><div class="m-track"><div class="m-fill" data-w="${pct}" style="width:${pct}%;--mv:${color[0]};--mv2:${color[1]}"></div></div><span class="m-val">${val>0?'+'+val:val}</span></div>`;
}
/* —— 十一阶阶梯（照卡内正则 #15 renderTop 口径）——
   优先从「阶层」文字抓「第N阶」，抓不到再按 等级 ceil(lv/20) 兜底。 */
const CN_NUM = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'十一':11};
const TIER_RE = /第(十一|[一二三四五六七八九十]|10|[1-9])阶/;
function tierOf(p){
  const ts = String(p?.阶层 ?? '');
  const m = ts.match(TIER_RE);
  const lv = Number(p?.等级);
  const t = m ? (CN_NUM[m[1]] || parseInt(m[1],10))
              : (Number.isFinite(lv) ? Math.max(1, Math.min(11, Math.ceil(lv/20))) : null);
  return { t, name: ts.includes('·') ? ts.split('·')[1] : '' };
}
function tierLadder(p){
  const ti = tierOf(p);
  if(!ti.t) return '';
  let h = '<div class="tiers">';
  for(let i=1;i<=11;i++) h += `<i class="${i<=ti.t?'on':''}"></i>`;
  h += '</div>';
  if(ti.name) h += `<div class="tiername">${esc(ti.name)}</div>`;
  return h;
}

/* —— 八维雷达（新版：资质四轴并入）——
   上限口径照卡内 radarHTML()：战力/敏捷/防御 = T表[阶] × 阶内倍率 × 1.8；
   幸运与资质四轴固定 0~20。T表取自〈等级属性与状态栏体系〉。 */
const TBL_ATK = [100,400,1600,6400,25000,100000,500000,2500000,5000000,12500000,60000000];
const TBL_SUB = [60,220,800,2900,10500,38000,190000,950000,1900000,4750000,23000000];
function tierMult(lv){
  if(!Number.isFinite(lv)) return 1;
  const st = (lv-1)%20;
  return st<5?1.0 : st<10?1.2 : st<15?1.5 : 1.8;
}
function radar8(p){
  const lv = Number(p?.等级);
  const ti = Number.isFinite(lv) ? Math.max(1, Math.min(11, Math.ceil(lv/20))) : null;
  const mult = tierMult(lv);
  const q = p?.资质 || {};
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
  const axes = [
    {lbl:'战力', v:num(p?.战斗力基础), plus:num(p?.战斗力加成) ?? 0, cap: ti!==null ? TBL_ATK[ti-1]*mult*1.8 : null},
    {lbl:'敏捷', v:num(p?.敏捷基础),   plus:num(p?.敏捷加成)   ?? 0, cap: ti!==null ? TBL_SUB[ti-1]*mult*1.8 : null},
    {lbl:'防御', v:num(p?.防御基础),   plus:num(p?.防御加成)   ?? 0, cap: ti!==null ? TBL_SUB[ti-1]*mult*1.8 : null},
    {lbl:'幸运', v:num(p?.幸运),       plus:0, cap:20},
    {lbl:'灵感', v:num(q.灵感), plus:0, cap:20},
    {lbl:'魅力', v:num(q.魅力), plus:0, cap:20},
    {lbl:'体质', v:num(q.体质), plus:0, cap:20},
    {lbl:'信仰', v:num(q.信仰), plus:0, cap:20},
  ];
  if(!axes.some(a=>a.v!==null)) return '';
  const cx=104, cy=98, R=64, K=8;
  const pt=(i,r)=>{const a=-Math.PI/2+i*(Math.PI*2/K);return [cx+Math.cos(a)*r, cy+Math.sin(a)*r];};
  const fx=p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  const ring=f=>{let s='';for(let i=0;i<K;i++)s+=fx(pt(i,R*f))+' ';return s.trim();};
  let poly='', labels='', spokes='';
  axes.forEach((ax,i)=>{
    const e0 = pt(i,R);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${e0[0].toFixed(1)}" y2="${e0[1].toFixed(1)}" stroke="rgba(47,74,94,.18)" stroke-width="0.8"/>`;
    const total = ax.v===null ? null : ax.v + (ax.plus||0);
    const maxV = (ax.cap!==null && ax.cap!==undefined) ? ax.cap : Math.max(total||1,1)*1.25;
    const ratio = total===null ? 0.035 : Math.max(0.035, Math.min(1, total/maxV));
    poly += fx(pt(i, R*ratio)) + ' ';
    const a2 = -Math.PI/2 + i*(Math.PI*2/K), cosA = Math.cos(a2);
    const lx = cx + cosA*(R+19), ly = cy + Math.sin(a2)*(R+11);
    const anchor = Math.abs(cosA)<0.35 ? 'middle' : (cosA>0?'start':'end');
    labels += `<text class="rlab" x="${lx.toFixed(1)}" y="${(ly-3).toFixed(1)}" text-anchor="${anchor}">${ax.lbl}</text>`
      + `<text class="rval" x="${lx.toFixed(1)}" y="${(ly+10).toFixed(1)}" text-anchor="${anchor}">${total===null?'—':total}`
      + (ax.plus?`<tspan class="rplus"> +${ax.plus}</tspan>`:'') + '</text>';
  });
  return `<div class="radarwrap"><svg viewBox="0 0 208 196" width="208" height="196">${spokes}`
    + `<polygon points="${ring(1)}" fill="none" stroke="rgba(47,74,94,.4)" stroke-width="1"/>`
    + `<polygon points="${ring(0.66)}" fill="none" stroke="rgba(47,74,94,.26)" stroke-width="0.8"/>`
    + `<polygon points="${ring(0.33)}" fill="none" stroke="rgba(47,74,94,.18)" stroke-width="0.8" stroke-dasharray="3 3"/>`
    + `<polygon points="${poly}" fill="rgba(150,55,46,.18)" stroke="#96372E" stroke-width="1.4" stroke-linejoin="round"/>`
    + `${labels}</svg></div>`;
}

/* 量条着色：把 .m-fill[data-w] 的宽度真正落到 style 上。
   ⚠ 病灶：此前只有 openInsert() 里补过一次，插页的条会亮；

function wikiBlock(r){

/* ══════════════════════════════════════════════════════════

const WB_HERO_RE   = /^(.+?)-基础版$/;

async function loadWbIndex(force){
  if(force){ __wbIndex = null; __wbIndexing = false; }
  if(__wbIndex || __wbIndexing) return __wbIndex;
  __wbIndexing = true;
  try{
    const namesFn = dexApi('getCharWorldbookNames');
    const getFn   = dexApi('getWorldbook');
    if(!namesFn || !getFn) return null;
    const cb = await namesFn('current');
    const books = [];
    if(cb && cb.primary) books.push(cb.primary);
    if(cb && Array.isArray(cb.additional)) books.push(...cb.additional);
    const all = [];
    for(const wbn of books){
      try{
        const entries = await getFn(wbn);
        for(const e of (entries||[])){
          if(!e) continue;
          const nm = wbName(e);
          if(nm) all.push({ name:nm, content:e.content||'', raw:e });
        }
      }catch(e){ /* 单本读不到就跳过，不影响其它 */ }
    }
    // 女主：条目名「{名}-基础版 / -堕落版」成对认领
    const map = new Map();
    const touch = (name)=>{ if(!map.has(name)) map.set(name, {name, base:null, fallen:null}); return map.get(name); };
    for(const e of all){
      let m = WB_FALLEN_RE.exec(e.name); if(m){ touch(m[1]).fallen = e; continue; }
      m = WB_HERO_RE.exec(e.name);       if(m){ touch(m[1]).base    = e; }
    }
    // 心界住民：「心界住民：{种族}·{名}」→ 取 · 之后的本名
    const anima = {};
    for(const e of all){
      if(!WB_ANIMA_RE.test(e.name)) continue;
      const short = e.name.replace(/^心界住民[：:]/,'').split('·').pop().trim();
      if(short) anima[short] = e;
    }
    __wbIndex = { heroes:[...map.values()], anima, all };
  }catch(e){ __wbIndex = null; }
  __wbIndexing = false;
  /* 索引就绪 → 图鉴正开着就刷一次（与 wikiBlock 同款异步回填） */
  try{
    if(insertOpen==='dex') openInsert('dex', {keepScroll:true});
  }catch(e){}
  return __wbIndex;
}

/* 当前形态该读哪一版 —— 严格按卡内控制器的优先级

   ⚠ 病灶（女主全员钉死堕落版）：schema 里 `羁绊.*.当前形态` 的 prefault 就是
     `'魔物形态'`（_extract/schema.txt:295），zod 会在 AI 没写这个字段时**照样填上它**。
     于是 bond.当前形态 恒非空 → `indexOf('魔物形态')===0` 恒真 → 全局变量那一层
     永远走不到，任何时线（含「未沦陷」）都判成堕落版。
     修法：把「恰等于 schema 预填默认值」识别为**未表态**，让位给全局变量去判。
     真正的个体指定值带前后缀（'魔物形态·异'/'人类形态·已侵蚀'…），不会等于裸默认值。 */
const FORM_DEFAULT = '魔物形态';

/* ══════════════════════════════════════════════════════════
   女主身份归一 —— 同一个人只能有一条羁绊

   病灶（用户实拍截图）：「莉莉姆·堤露埃拉」在界面上被拆成两条 ——
     · 女主图鉴 / 卡内档案 → 名字取自世界书条目「{名}-基础版」去后缀 =「莉莉姆」
     · 羁绊录/变量 羁绊  → 键是 AI 自写的 =「堤露埃拉」

   显示成「档案·未立契 / 好感度 0/100」的空壳，而带真实数据（Lv.130 / 好感 85 /
   羁绊「母亲」）的那条只出现在羁绊录里 —— 一个人被摊成两个人。
   其余女主同病：威尔玛丽娜·诺斯库里姆↔威尔玛丽娜、天之宫今宵↔今宵……

     ① 原样相等
     ② 归一后相等（去 ·・･ 与空白、全角转半角、去括号注释）
     ③ 全名（带「·」）的首段与末段，各自注册为别名
   ③ 只认「恰好等于首段或末段」，**不放开任意前缀/后缀** ——
   否则日后若再来一位「莉莉姆二世」，首段就会撞上「莉莉姆」，
   把两个人合并成同一条羁绊。宁可少认一个别名，不可错并两个人。

   只用于「按名册名反查羁绊」这一个方向；羁绊录仍原样遍历
   Object.keys(羁绊)，那是变量的真实全貌，不该被归一改写。
   ══════════════════════════════════════════════════════════ */
const HERO_NORM = (s)=> String(s??'')
  .replace(/[（(][^）)]*[）)]/g, '')
  .replace(/[·・･\s]/g, '')

/* 显示名覆盖（仅渲染层，2026-10-05 用户裁决）：女主名册名来自条目「{名}-基础版」去后缀

const HERO_DISPLAY_NAME = { '莉莉姆': '堤露埃拉' };
const heroDisplayName = (n)=> HERO_DISPLAY_NAME[String(n??'').trim()] || n;
/* 静态全名桥接表（关键）：名册名来自世界书条目「{名}-基础版」去后缀 = 短名
   （「莉莉姆·堤露埃拉」被截成「莉莉姆」），而羁绊键是 AI 自写的另一截（「堤露埃拉」）。
   两者互不为对方的「·」段，光看名册自身取别名永远对不上。
   故取卡内静态全名 D.heroines 做桥，两条规则：
